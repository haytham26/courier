openapi: 3.1.0
info:
  title: Courier Copilot API
  version: 0.1.0
  description: |
    Voice-first delivery driver API for NZ/AU markets.
    All endpoints follow the decisions in DECISIONS.md (D1-D17).
    - D1: Live voice agent is core MVP feature
    - D2: Voice-only control, everything voice-accessible
    - D3: All languages from day 1
    - D4: Voice delivery proof default
    - D7: Enterprise-grade design
    - D10: Autonomous execution with review boards + 50x backtest
    - D12: Free-first with auto paid fallback
    - D15: Bundled offline map + weekly updates
    - D16: Custom day/night/high-contrast map style
servers:
  - url: http://localhost:8000
    description: Local development server
  - url: https://api.courier-copilot.com
    description: Production server
tags:
  - name: shifts
    description: Driver shift management
  - name: runs
    description: Territory run configuration
  - name: intake
    description: Morning intake (voice/OCR)
  - name: voice
    description: Real-time voice channel (WebSocket)
  - name: templates
    description: Master Template Lock
  - name: locations
    description: Learned door/park/entry points
  - name: demo
    description: The demo-run seed (ADR-019)
paths:
  /runs/{run_id}/template:
    put:
      tags: [templates]
      summary: Master Template Lock - replace run's street order
      operationId: put_template
      security: [{ bearerAuth: [] }]
      parameters:
        - name: run_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/TemplateSegment'
      responses:
        '200':
          description: Template updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TemplateResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /shifts/{shift_id}/intake:
    post:
      tags: [intake]
      summary: Start morning intake from voice text
      operationId: intake_text
      security: [{ bearerAuth: [] }]
      parameters:
        - name: shift_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IntakeText'
      responses:
        '200':
          description: Intake started - returns briefing or first question
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/BriefingResponse'
                  - $ref: '#/components/schemas/InterruptQuestion'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '502':
          description: The extraction provider could not answer (never a silent empty manifest)

  /shifts/{shift_id}/intake/manifest:
    post:
      tags: [intake]
      summary: Upload paper manifest photo for OCR extraction
      description: |
        The photo is capped and magic-sniffed like the POD upload, then OCR'd
        through the gateway and run through the same intake graph with
        source='ocr'. HEIC is refused (the vision endpoints do not read it);
        503 means no gateway is configured yet - the endpoint never invents a
        manifest.
      operationId: intake_manifest
      security: [{ bearerAuth: [] }]
      parameters:
        - name: shift_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [image]
              properties:
                image:
                  type: string
                  format: binary
                  description: Photo of paper manifest
      responses:
        '200':
          description: OCR extraction queued - same intake graph with source='ocr'
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/BriefingResponse'
                  - $ref: '#/components/schemas/InterruptQuestion'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413': { description: The photo is over the 10 MiB cap }
        '415': { description: Not a JPEG/PNG/HEIC image, or HEIC (the OCR provider cannot read it) }
        '502':
          description: The OCR or extraction provider could not answer
        '503':
          description: No OCR provider is configured yet (the OmniRoute gateway is a founder item)

  /shifts/{shift_id}/import:
    post:
      tags: [intake]
      summary: Import stops from a CSV or Excel spreadsheet
      description: |
        The spreadsheet import's server half (D52, ADR-025). A header row is
        required; `address` is the only required column (aliases: street,
        delivery_address, addr), and `type` (delivery/pickup), `priority`
        (true/false/yes/no/1/0), `parcels`, `service_time_s`, `window_start`
        and `window_end` are optional (headers matched case- and
        punctuation-insensitively). The import is all-or-nothing: the whole
        file is validated before one row is stored, and a row without an
        address refuses the import with the row named - a silent mis-import is
        the failure this endpoint exists to avoid. Columns that match no known
        field are answered in `ignored_columns`, never dropped silently. Stops
        are stored unlocated (the API has no geocoder yet) and the routing layer
        reports them through `unroutable_stop_ids` until the address slice
        lands. The file is capped at 5 MiB and at the routing layer's own row
        cap (500); the name and the bytes must agree (.csv = UTF-8 text,
        .xlsx = zip), and the shift's total is capped too (a repeated import
        that would pass the planner's cap is a 409, not a silent append).
      operationId: import_stops
      security: [{ bearerAuth: [] }]
      parameters:
        - name: shift_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: The .csv or .xlsx file of stops
      responses:
        '201':
          description: The stops imported, all-or-nothing, in file order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413': { description: The file is over the 5 MiB cap }
        '415': { description: Not a .csv (UTF-8) or .xlsx (zip), or the name and bytes disagree }
        '409': { description: The import would take the shift past the planner's own cap - nothing was stored }
        '422': { description: A row is invalid (no address, bad type/priority/parcels/window, over the 500-row cap) or the .xlsx is not a readable spreadsheet or unpacks past 50 MiB - nothing was stored }

  /billing/webhooks/{source}:
    post:
      tags: [account]
      summary: A billing provider's webhook (the facts the entitlement layer ingests)
      description: |
        The signature rules run before the body is parsed (ADR-018 section 2): an
        empty signing secret, a replayed timestamp, a truncated body and a source
        this deployment does not accept each fail closed. The response says only
        whether the fact was accepted - what it means is the entitlement layer's
        decision, never the provider's.
      operationId: billing_webhook
      parameters:
        - name: source
          in: path
          required: true
          schema:
            type: string
            description: The source this deployment accepts (BILLING_SOURCES)
      responses:
        '200':
          description: The fact was accepted
          content:
            application/json:
              schema:
                type: object
                required: [accepted]
                properties:
                  accepted:
                    type: boolean
        '400':
          description: The webhook failed a signature rule (no secret, a replay, a truncated body)
        '404':
          description: This deployment does not accept that source


  /v1/billing/checkout-session:
    post:
      tags: [account]
      summary: The Stripe Checkout Session that sells one plan to this courier (D44)
      description: |
        The founder's billing provider is Stripe in New Zealand dollars, test mode
        until the keys are swapped (ADR-031 / D68). The plan comes from the body,
        the courier from the token, and the session carries the courier id as
        Stripe's own `client_reference_id`, so the webhook that follows the
        payment says who paid without this endpoint storing anything.

        A deployment with no Stripe key, and a plan with no configured price, are
        each a 400 with the reason - the switches are the founder's
        (docs/status/FOUNDER_TODO.md). The trial is not sold here: it is granted
        by the entitlement layer.
      operationId: create_checkout_session
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [plan, return_base]
              properties:
                plan:
                  type: string
                  enum: [solo, team]
                  description: The plan to sell (the trial is granted, not sold)
                return_base:
                  type: string
                  description: The absolute https origin to return to after Stripe
      responses:
        '200':
          description: The session's URL, to open in a browser
          content:
            application/json:
              schema:
                type: object
                required: [url]
                properties:
                  url:
                    type: string
                    format: uri
        '400':
          description: No Stripe key, no price for the plan, or a return base that is not absolute

  /v1/billing/portal-session:
    post:
      tags: [account]
      summary: The Stripe portal Session where this courier manages the subscription (D44)
      description: |
        The portal opens on the subscription's own recorded Stripe customer: the
        webhook that follows the checkout records it, and a caller with none has
        nothing to manage - opening somebody else's portal is the worst answer
        this endpoint could give.
      operationId: create_portal_session
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The session's URL, to open in a browser
          content:
            application/json:
              schema:
                type: object
                required: [url]
                properties:
                  url:
                    type: string
                    format: uri
        '400':
          description: No Stripe key, or no Stripe customer recorded for this courier


  /account/cost:
    get:
      tags: [account]
      summary: "The caller's own budget - what is spent and what is left (COST_PLAN)"
      description: |
        The budgets COST_PLAN names are enforced BEFORE a paid model call is
        made, and this is the same arithmetic read back for the app to show -
        the courier sees their own spend, never another's.

        An unbounded window answers `null` (the deployment set no limit) rather
        than a fake infinity, and a spent budget answers zero: the guard never
        lets the remaining go negative.
      operationId: get_cost
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The spend and the remaining per window
          content:
            application/json:
              schema:
                type: object
                required: [spent]
                properties:
                  courier_daily_usd:
                    type: [number, 'null']
                    description: What is left of the courier's daily budget, or null when unbounded
                  courier_monthly_usd:
                    type: [number, 'null']
                  tenant_daily_usd:
                    type: [number, 'null']
                  global_daily_usd:
                    type: [number, 'null']
                    description: The deployment's daily cap, never the caller's alone
                  spent:
                    type: object
                    description: The estimated spend per window (the gateway's own usage is the invoice)

  /account/entitlements:
    get:
      tags: [account]
      summary: The caller's entitlement, and what it opens
      description: |
        The app gates on "is this subscription active" and never on how it was
        paid (D44). A courier whose card is failing still answers `active`: the
        grace window is the rule (ADR-017 §1). A courier with no subscription gets
        a named free answer (`plan: null`), never an error.
      operationId: get_entitlements
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: The caller's entitlement
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Entitlement'
        '401': { $ref: '#/components/responses/Unauthorized' }

  /shifts/{shift_id}/stops:
    get:
      tags: [shifts]
      summary: List stops for a shift
      operationId: list_stops
      security: [{ bearerAuth: [] }]
      parameters:
        - name: shift_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, delivered, skipped, deferred, failed]
      responses:
        '200':
          description: List of stops
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StopResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /shifts/{shift_id}/events:batch:
    post:
      tags: [shifts]
      summary: Offline-first batch sync of delivery events
      operationId: sync_events
      security: [{ bearerAuth: [] }]
      parameters:
        - name: shift_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/DeliveryEvent'
      responses:
        '200':
          description: Events synced, returns server cursor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /shifts/{shift_id}/voice:
    get:
      tags: [voice]
      summary: Bidirectional voice channel (WebSocket upgrade)
      operationId: voice
      security: [{ bearerAuth: [] }]
      parameters:
        - name: shift_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '101':
          description: Switching protocols to WebSocket
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /demo/runs:
    post:
      tags: [demo]
      summary: Seed the caller's demo day (a run and its stops, in the real tables)
      description: |
        A1's seam (ADR-019): the app's core flow needs a run with stops that
        exist, with ids that stay still between calls, so an E2E job can reset
        the phone and run the flow again. The ids are derived from the caller, so
        a caller always gets their own day back.

        The gate is the environment: without DEMO_SEED_ENABLED=true this route
        answers 404, because seeding demo rows into a real database is not
        something an unguarded endpoint should ever do.

        A caller racing themself on the same reason is answered with 409, the
        same conflict `POST /runs` answers.
      operationId: seed_demo_run
      security: [{ bearerAuth: [] }]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DemoSeedRequest'
      responses:
        '200':
          description: The caller's demo day
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DemoRun'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409':
          description: The caller already has this day, written by a racing seed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404': { $ref: '#/components/responses/NotFound' }

  /runs:
    post:
      tags: [runs]
      summary: Create a new territory run
      operationId: create_run
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRunRequest'
      responses:
        '201':
          description: Run created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }

    get:
      tags: [runs]
      summary: List runs for current driver
      operationId: list_runs
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: List of runs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RunResponse'

  /runs/{run_id}:
    get:
      tags: [runs]
      summary: Get run details
      operationId: get_run
      security: [{ bearerAuth: [] }]
      parameters:
        - name: run_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Run details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunResponse'
        '404': { $ref: '#/components/responses/NotFound' }

  /locations/{location_id}/notes:
    get:
      tags: [locations]
      summary: The caller's learned notes for a location (entry codes, hazards)
      description: |
        The door memory: one note per (courier, location, kind), private to
        the courier. A location the caller has never had a stop at is 404,
        never an empty list - existence is not disclosed cross-courier. The
        id is the stop response's `StopResponse.location_id` (ADR-012).
      operationId: get_location_notes
      security: [{ bearerAuth: [] }]
      parameters:
        - name: location_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: The courier's notes, ordered by kind
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LocationNote'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [locations]
      summary: Add or correct a learned note for a location
      description: |
        Upsert by kind: 201 when the kind is new, 200 when an existing note
        is corrected. One gate code per door, not five.
      operationId: add_location_note
      security: [{ bearerAuth: [] }]
      parameters:
        - name: location_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateLocationNoteRequest'
      responses:
        '201':
          description: The note stored
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocationNote'
        '200':
          description: The existing note corrected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocationNote'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /healthz:
    get:
      tags: [runs]
      summary: The uptime probe's target (data-free by construction)
      operationId: healthz
      responses:
        '200':
          description: The service is up; the body carries only status, version and engine names
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HealthResponse' }

  /auth/me:
    get:
      tags: [authentication]
      summary: The identity behind the presented access token
      operationId: get_me
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: The verified identity
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthMe' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/verify:
    get:
      tags: [authentication]
      summary: Reports whether the presented token is currently valid
      operationId: verify_session
      responses:
        '200':
          description: The validity verdict (never an error for an invalid token)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthVerify' }

  /shifts/{shift_id}/route:
    get:
      tags: [runs]
      summary: The day's route — the ordered stops with the arrival times
      operationId: shift_route
      security: [{ bearerAuth: [] }]
      parameters:
        - name: shift_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: The stored plan when it still covers the run, else a fresh plan
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RouteResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /runs/{run_id}/stops/{stop_id}/pod:
    post:
      tags: [stops]
      summary: Upload the proof-of-delivery photo for a stop
      operationId: upload_pod
      security: [{ bearerAuth: [] }]
      parameters:
        - name: run_id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: stop_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [image, occurred_at]
              properties:
                image:
                  type: string
                  format: binary
                  description: JPEG/PNG/HEIC, at most 10 MiB (checked by magic bytes, not by name)
                occurred_at:
                  type: string
                  format: date-time
                safe_place:
                  type: string
                  maxLength: 200
                event_id:
                  type: string
                  format: uuid
                  description: Client-generated; a replay returns the first upload's answer
      responses:
        '201':
          description: POD stored
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PodResponse' }
        '200':
          description: A replay of an already-stored client event id
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PodResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413': { description: 'The image exceeds 10 MiB' }
        '415': { description: 'Not a JPEG/PNG/HEIC image (checked by magic bytes, not by name)' }

  /runs/{run_id}/stops/{stop_id}/pod/{event_id}/url:
    get:
      tags: [stops]
      summary: A short-lived URL for the stored proof-of-delivery photo
      description: |
        The owner of the run only; the stop must belong to the run and the
        event to the stop (a foreign anything is 404, never a URL). On the
        S3-compatible backend the URL is a presigned GET; on the local store
        it is a self-verifying streaming grant. Both expire (15 minutes by
        default) — the photo never streams through the API on S3.
      operationId: pod_url
      security: [{ bearerAuth: [] }]
      parameters:
        - name: run_id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: stop_id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: event_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: The dying URL and its expiry
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PodUrlResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /runs/{run_id}/pod/{event_id}/bytes:
    get:
      tags: [stops]
      summary: Stream a stored POD photo with a short-lived grant (the local backend)
      description: |
        The local backend's answer to the presign endpoint: the URL itself
        carries an HMAC grant over (run, event, expiry), because an image
        loader cannot send a bearer header. A tampered, expired or foreign
        grant is 404. The S3 backend never serves this route — its URLs point
        at the object store.
      operationId: pod_bytes
      parameters:
        - name: run_id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: event_id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: expires
          in: query
          required: true
          schema: { type: integer }
        - name: signature
          in: query
          required: true
          schema: { type: string }
      responses:
        '200':
          description: The image bytes
          content:
            image/jpeg: { schema: { type: string, format: binary } }
            image/png: { schema: { type: string, format: binary } }
            image/heic: { schema: { type: string, format: binary } }
        '404': { $ref: '#/components/responses/NotFound' }

  /runs/{run_id}/route:reopt:
    post:
      tags: [runs]
      summary: Re-place only the affected stops; the rest of the order stays
      operationId: reopt_route
      security: [{ bearerAuth: [] }]
      parameters:
        - name: run_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [affected_stop_ids]
              properties:
                affected_stop_ids:
                  type: array
                  maxItems: 500
                  items: { type: string, format: uuid }
      responses:
        '200':
          description: The reopt'd day with the finish-time delta (may be negative)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReoptResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { description: An affected stop is not part of this run }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
        message:
          type: string

    DemoSeedRequest:
      type: object
      properties:
        reason:
          type: string
          enum: [e2e, demo, dev]
          default: e2e
          description: The one reason this caller wants a demo day for

    DemoRun:
      type: object
      required: [run_id, shift_id, stops]
      properties:
        run_id:
          type: string
          format: uuid
        shift_id:
          type: string
          format: uuid
        stops:
          type: array
          description: The day's stops, in the seeded order
          items:
            $ref: '#/components/schemas/DemoStop'

    DemoStop:
      type: object
      description: >-
        One stop of the seeded demo day. BUG-236: the seeded day is a real
        day-one day, so the seed's answer carries the type and the time window
        beside the priority, as the contract's Stop does.
      required: [id, address, lat, lon]
      properties:
        id:
          type: string
          format: uuid
        address:
          type: string
        lat:
          type: number
          format: double
        lon:
          type: number
          format: double
        priority:
          type: boolean
        parcels:
          type: integer
        type:
          type: string
          enum: [delivery, pickup]
        window_start:
          type: string
          format: date-time
          nullable: true
        window_end:
          type: string
          format: date-time
          nullable: true

    Entitlement:
      type: object
      required: [active, features]
      properties:
        active:
          type: boolean
          description: Whether the subscription covers today
        plan:
          description: The plan on the subscription, when there is one
          oneOf:
            - type: string
              enum: [trial, solo, team]
            - type: 'null'
        features:
          type: array
          description: What the plan opens, sorted
          items:
            type: string

    IntakeText:
      type: object
      required: [text]
      properties:
        source:
          type: string
          enum: [voice, ocr, scan, manual]
          default: voice
        text:
          type: string
          description: Raw voice transcript or OCR text

    TemplateSegment:
      type: object
      required: [street_key]
      properties:
        street_key:
          type: string
          description: Normalised street key (e.g., "redwood:main north rd")
        direction:
          type: string
          enum: [odd_first, even_first, zigzag, asc, desc]
          default: asc
          description: Delivery direction for this street

    TemplateResponse:
      type: object
      properties:
        run_id:
          type: string
          format: uuid
        segments:
          type: integer

    BriefingResponse:
      type: object
      properties:
        briefing:
          type: string
          description: Spoken briefing for driver
        stops_count:
          type: integer
        set_aside_count:
          type: integer

    InterruptQuestion:
      type: object
      properties:
        speak:
          type: string
          description: Question to speak to driver
        index:
          type: integer
          description: Parcel index requiring clarification

    ImportResponse:
      type: object
      description: >-
        The answer of the spreadsheet import (ADR-025): the stops landed
        all-or-nothing, in file order. `ignored_columns` names the header
        columns that matched no known field - the import never drops a
        column silently.
      required: [shift_id, imported, stop_ids, ignored_columns]
      properties:
        shift_id:
          type: string
          format: uuid
        imported:
          type: integer
          description: How many stops the file added
        stop_ids:
          type: array
          items:
            type: string
            format: uuid
          description: The new stop ids, in file order
        ignored_columns:
          type: array
          items:
            type: string
          description: Header columns that matched no known field

    DeliveryEvent:
      type: object
      required: [id, stop_id, kind, occurred_at]
      properties:
        id:
          type: string
          format: uuid
          description: Client-generated for idempotent offline replay
        stop_id:
          type: string
          format: uuid
        kind:
          type: string
          enum: [delivered, left_at, skipped, failed]
          description: 'D4: Voice delivery proof default'
        utterance:
          type: string
          description: Exact driver words
        safe_place:
          type: string
          description: "D9: Safe place if 'left at'"
        reason:
          type: string
          maxLength: 200
          description: >-
            D58 (ADR-023): the structured failed-delivery reason, in the
            courier's own words (a product-owned list, not a generic enum).
            Required when kind is failed; carried through sync and compared on
            replay conflicts.
        lat:
          type: number
          format: double
          description: GPS latitude at moment of event
        lon:
          type: number
          format: double
          description: GPS longitude at moment of event
        accuracy_m:
          type: number
          format: double
          description: GPS accuracy in meters (learning only if <= 15m)
        occurred_at:
          type: string
          format: date-time

    SyncResponse:
      type: object
      properties:
        cursor:
          type: integer
          description: Server cursor for incremental sync
        accepted:
          type: integer
          description: Number of events accepted
        conflicts:
          type: array
          description: >-
            Event ids whose replay differed from the stored row; the stored
            copy wins and the incoming copy is discarded (ADR-014) - the phone
            surfaces them to the courier, it never overwrites.
          items:
            type: string
            format: uuid

    RouteResponse:
      type: object
      required:
        [
          shift_id,
          run_id,
          engine,
          locked,
          total_distance_m,
          total_duration_s,
          parcels,
          capacity_parcels,
          over_capacity,
          window_violations,
          unroutable_stop_ids,
          stops,
        ]
      properties:
        shift_id: { type: string, format: uuid }
        run_id: { type: string, format: uuid }
        engine: { type: string }
        locked: { type: boolean }
        template_id: { type: string, nullable: true }
        total_distance_m: { type: number }
        total_duration_s: { type: number }
        parcels: { type: integer }
        capacity_parcels: { type: integer, nullable: true }
        over_capacity: { type: boolean }
        window_violations: { type: integer }
        unroutable_stop_ids:
          type: array
          items: { type: string, format: uuid }
        stops:
          type: array
          items:
            type: object
            required:
              [
                stop_id,
                sequence,
                lat,
                lon,
                arrival_at,
                departure_at,
                distance_m,
                cumulative_distance_m,
                late,
              ]
            properties:
              stop_id: { type: string, format: uuid }
              sequence: { type: integer }
              lat: { type: number }
              lon: { type: number }
              arrival_at: { type: string, format: date-time }
              departure_at: { type: string, format: date-time }
              distance_m: { type: number }
              cumulative_distance_m: { type: number }
              late: { type: boolean }

    HealthResponse:
      type: object
      required: [status, version, engines]
      properties:
        status: { type: string, enum: [ok] }
        version: { type: string }
        engines:
          type: array
          items: { type: string }

    AuthMe:
      type: object
      required: [user_id]
      properties:
        user_id: { type: string }
        session_id: { type: string, nullable: true }
        organization_id: { type: string, nullable: true }
        team_id: { type: string, nullable: true }

    AuthVerify:
      type: object
      required: [valid]
      properties:
        valid: { type: boolean }
        user_id: { type: string }

    PodResponse:
      type: object
      required: [event_id, stop_id, sha256, bytes, stored_at, already_stored]
      properties:
        event_id: { type: string, format: uuid }
        stop_id: { type: string, format: uuid }
        sha256: { type: string }
        bytes: { type: integer }
        stored_at: { type: string, format: date-time }
        already_stored: { type: boolean }

    PodUrlResponse:
      type: object
      required: [event_id, url, expires_at]
      properties:
        event_id: { type: string, format: uuid }
        url:
          type: string
          description: Absolute or API-relative; fetch it before it expires
        expires_at: { type: string, format: date-time }

    ReoptResponse:
      type: object
      required: [run_id, engine, finish_delta_s, stops]
      properties:
        run_id: { type: string, format: uuid }
        engine: { type: string }
        finish_delta_s: { type: number }
        stops:
          type: array
          items: { type: object }

    StopResponse:
      type: object
      description: >-
        The stop as listStops returns it (ADR-010 §2): the routing
        coordinates and the live status ride beside the contract's original
        shape. `location_id` (ADR-012) is the door's stable id the notes
        endpoints take; `van_zone` and `tip` return when the van-loading
        lands.
      required: [id, seq, status, location_id, type]
      properties:
        id:
          type: string
          format: uuid
        location_id:
          type: string
          format: uuid
          description: The stable door id (ADR-012) the notes endpoints take
        type:
          type: string
          enum: [delivery, pickup]
          description: >-
            The stop's type (D59, ADR-024): the core of the reusable preset
            Spoke bundles on an address; the preset's other fields ride the
            address squad's door memory.
        address:
          type: string
          nullable: true
        seq:
          type: integer
        status:
          type: string
          enum: [pending, delivered, skipped, deferred, failed]
        lat:
          type: number
          nullable: true
        lon:
          type: number
          nullable: true
        priority:
          type: boolean
        parcels:
          type: integer
        service_time_s:
          type: integer
          nullable: true
        window_start:
          type: string
          format: date-time
          nullable: true
        window_end:
          type: string
          format: date-time
          nullable: true

    CreateRunRequest:
      type: object
      description: >-
        The narrowed request of ADR-010 §3: unknown fields are refused, never
        dropped silently. `territory` comes back 422 until the schema gains a
        home for it. The finish point and the break window are carried from
        ADR-022 (D63): the runs table has their columns, so they are storable
        and therefore accepted; the app halves ride the same features' later
        slices (D55/D56).
      required: [name, shift_id, depot, start_at]
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        shift_id:
          type: string
          format: uuid
        depot:
          type: object
          required: [lat, lon]
          additionalProperties: false
          properties:
            lat: { type: number, minimum: -90, maximum: 90 }
            lon: { type: number, minimum: -180, maximum: 180 }
        start_at:
          type: string
          format: date-time
        capacity_parcels:
          type: integer
          minimum: 0
          maximum: 9999
        speed_kmh:
          type: number
          minimum: 1
          maximum: 120
          default: 30
        break_window:
          type: object
          nullable: true
          description: >-
            The planned break (D55): both bounds are required together and must
            carry their timezone; the server refuses end <= start.
          required: [start, end]
          additionalProperties: false
          properties:
            start: { type: string, format: date-time }
            end: { type: string, format: date-time }
        finish:
          type: object
          nullable: true
          description: The end location of the day (D56); a round trip is finish == depot.
          required: [lat, lon]
          additionalProperties: false
          properties:
            lat: { type: number, minimum: -90, maximum: 90 }
            lon: { type: number, minimum: -180, maximum: 180 }

    RunResponse:
      type: object
      required: [id, shift_id, name, depot, speed_kmh, start_at]
      properties:
        id:
          type: string
          format: uuid
        shift_id:
          type: string
          format: uuid
        name:
          type: string
        depot:
          type: object
          required: [lat, lon]
          properties:
            lat: { type: number }
            lon: { type: number }
        capacity_parcels:
          type: integer
          nullable: true
        speed_kmh:
          type: number
        start_at:
          type: string
          format: date-time
        break_window:
          type: object
          nullable: true
          required: [start, end]
          additionalProperties: false
          properties:
            start: { type: string, format: date-time }
            end: { type: string, format: date-time }
        finish:
          type: object
          nullable: true
          required: [lat, lon]
          additionalProperties: false
          properties:
            lat: { type: number }
            lon: { type: number }

    LocationNote:
      type: object
      required: [id, kind, body, confidence, last_confirmed]
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
          enum: [entry, gate_code, hazard, safe_place, access]
        body:
          type: string
        confidence:
          type: number
          format: float
        last_confirmed:
          type: string
          format: date-time

    CreateLocationNoteRequest:
      type: object
      required: [kind, body]
      properties:
        kind:
          type: string
          enum: [entry, gate_code, hazard, safe_place, access]
        body:
          type: string
          minLength: 1
          maxLength: 500
        confidence:
          type: number
          format: float
          minimum: 0
          maximum: 1
          default: 0.5

  # WebSocket message schemas (for documentation)
  x-websocket-messages:
    client_to_server:
      - type: transcript
        fields:
          type: string
          enum: [transcript]
          text: string
          final: boolean
          gps:
            type: object
            properties:
              lat: number
              lon: number
              accuracy_m: number
              speed_kmh: number
      - type: gps
        fields:
          type: string
          enum: [gps]
          lat: number
          lon: number
          accuracy_m: number
          speed_kmh: number

    server_to_client:
      - type: say
        fields:
          type: string
          enum: [say]
          text: string
          priority: string
          enum: [now, queue]
      - type: state
        fields:
          type: string
          enum: [state]
          stop: object
      - type: approach_whisper
        fields:
          type: string
          enum: [approach_whisper]
          stop_id: string
          distance_m: number
          instruction: string
      - type: imminent_whisper
        fields:
          type: string
          enum: [imminent_whisper]
          stop_id: string
          distance_m: number
          instruction: string
