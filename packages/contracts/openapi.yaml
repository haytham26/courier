openapi: 3.1.0
info:
  title: Courier Copilot API
  version: 0.1.0
  description: |
    Voice-first delivery driver API for NZ/AU markets.
    All endpoints follow the decisions in DECISIONS.md (D1-D17).
    - D1: Live voice agent is core MVP feature
    - D2: Voice-only control, everything voice-accessible
    - D3: All languages from day 1
    - D4: Voice delivery proof default
    - D7: Enterprise-grade design
    - D10: Autonomous execution with review boards + 50x backtest
    - D12: Free-first with auto paid fallback
    - D15: Bundled offline map + weekly updates
    - D16: Custom day/night/high-contrast map style
servers:
  - url: http://localhost:8000
    description: Local development server
  - url: https://api.courier-copilot.com
    description: Production server
tags:
  - name: shifts
    description: Driver shift management
  - name: runs
    description: Territory run configuration
  - name: intake
    description: Morning intake (voice/OCR)
  - name: voice
    description: Real-time voice channel (WebSocket)
  - name: templates
    description: Master Template Lock
  - name: locations
    description: Learned door/park/entry points
paths:
  /runs/{run_id}/template:
    put:
      tags: [templates]
      summary: Master Template Lock - replace run's street order
      operationId: put_template
      security: [{ bearerAuth: [] }]
      parameters:
        - name: run_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/TemplateSegment'
      responses:
        '200':
          description: Template updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TemplateResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /shifts/{shift_id}/intake:
    post:
      tags: [intake]
      summary: Start morning intake from voice text
      operationId: intake_text
      security: [{ bearerAuth: [] }]
      parameters:
        - name: shift_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IntakeText'
      responses:
        '200':
          description: Intake started - returns briefing or first question
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/BriefingResponse'
                  - $ref: '#/components/schemas/InterruptQuestion'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '502':
          description: The extraction provider could not answer (never a silent empty manifest)

  /shifts/{shift_id}/intake/manifest:
    post:
      tags: [intake]
      summary: Upload paper manifest photo for OCR extraction
      description: |
        The photo is capped and magic-sniffed like the POD upload, then OCR'd
        through the gateway and run through the same intake graph with
        source='ocr'. HEIC is refused (the vision endpoints do not read it);
        503 means no gateway is configured yet - the endpoint never invents a
        manifest.
      operationId: intake_manifest
      security: [{ bearerAuth: [] }]
      parameters:
        - name: shift_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [image]
              properties:
                image:
                  type: string
                  format: binary
                  description: Photo of paper manifest
      responses:
        '200':
          description: OCR extraction queued - same intake graph with source='ocr'
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/BriefingResponse'
                  - $ref: '#/components/schemas/InterruptQuestion'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413': { description: The photo is over the 10 MiB cap }
        '415': { description: Not a JPEG/PNG/HEIC image, or HEIC (the OCR provider cannot read it) }
        '502':
          description: The OCR or extraction provider could not answer
        '503':
          description: No OCR provider is configured yet (the OmniRoute gateway is a founder item)

  /shifts/{shift_id}/stops:
    get:
      tags: [shifts]
      summary: List stops for a shift
      operationId: list_stops
      security: [{ bearerAuth: [] }]
      parameters:
        - name: shift_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, delivered, skipped, deferred, failed]
      responses:
        '200':
          description: List of stops
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StopResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /shifts/{shift_id}/events:batch:
    post:
      tags: [shifts]
      summary: Offline-first batch sync of delivery events
      operationId: sync_events
      security: [{ bearerAuth: [] }]
      parameters:
        - name: shift_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/DeliveryEvent'
      responses:
        '200':
          description: Events synced, returns server cursor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /shifts/{shift_id}/voice:
    get:
      tags: [voice]
      summary: Bidirectional voice channel (WebSocket upgrade)
      operationId: voice
      security: [{ bearerAuth: [] }]
      parameters:
        - name: shift_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '101':
          description: Switching protocols to WebSocket
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /runs:
    post:
      tags: [runs]
      summary: Create a new territory run
      operationId: create_run
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRunRequest'
      responses:
        '201':
          description: Run created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }

    get:
      tags: [runs]
      summary: List runs for current driver
      operationId: list_runs
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: List of runs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RunResponse'

  /runs/{run_id}:
    get:
      tags: [runs]
      summary: Get run details
      operationId: get_run
      security: [{ bearerAuth: [] }]
      parameters:
        - name: run_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Run details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunResponse'
        '404': { $ref: '#/components/responses/NotFound' }

  /locations/{location_id}/notes:
    x-status: planned
    get:
      tags: [locations]
      summary: Get learned notes for a location (entry codes, hazards, etc.)
      operationId: getLocationNotes
      security: [{ bearerAuth: [] }]
      parameters:
        - name: location_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Location notes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LocationNote'
    post:
      tags: [locations]
      summary: Add a learned note for a location
      operationId: addLocationNote
      security: [{ bearerAuth: [] }]
      parameters:
        - name: location_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateLocationNoteRequest'
      responses:
        '201':
          description: Note stored
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocationNote'

  /healthz:
    get:
      tags: [runs]
      summary: The uptime probe's target (data-free by construction)
      operationId: healthz
      responses:
        '200':
          description: The service is up; the body carries only status, version and engine names
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HealthResponse' }

  /auth/me:
    get:
      tags: [authentication]
      summary: The identity behind the presented access token
      operationId: get_me
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: The verified identity
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthMe' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/verify:
    get:
      tags: [authentication]
      summary: Reports whether the presented token is currently valid
      operationId: verify_session
      responses:
        '200':
          description: The validity verdict (never an error for an invalid token)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthVerify' }

  /shifts/{shift_id}/route:
    get:
      tags: [runs]
      summary: The day's route — the ordered stops with the arrival times
      operationId: shift_route
      security: [{ bearerAuth: [] }]
      parameters:
        - name: shift_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: The stored plan when it still covers the run, else a fresh plan
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RouteResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /runs/{run_id}/stops/{stop_id}/pod:
    post:
      tags: [stops]
      summary: Upload the proof-of-delivery photo for a stop
      operationId: upload_pod
      security: [{ bearerAuth: [] }]
      parameters:
        - name: run_id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: stop_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [image, occurred_at]
              properties:
                image:
                  type: string
                  format: binary
                  description: JPEG/PNG/HEIC, at most 10 MiB (checked by magic bytes, not by name)
                occurred_at:
                  type: string
                  format: date-time
                safe_place:
                  type: string
                  maxLength: 200
                event_id:
                  type: string
                  format: uuid
                  description: Client-generated; a replay returns the first upload's answer
      responses:
        '201':
          description: POD stored
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PodResponse' }
        '200':
          description: A replay of an already-stored client event id
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PodResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413': { description: "The image exceeds 10 MiB" }
        '415': { description: "Not a JPEG/PNG/HEIC image (checked by magic bytes, not by name)" }

  /runs/{run_id}/route:reopt:
    post:
      tags: [runs]
      summary: Re-place only the affected stops; the rest of the order stays
      operationId: reopt_route
      security: [{ bearerAuth: [] }]
      parameters:
        - name: run_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [affected_stop_ids]
              properties:
                affected_stop_ids:
                  type: array
                  maxItems: 500
                  items: { type: string, format: uuid }
      responses:
        '200':
          description: The reopt'd day with the finish-time delta (may be negative)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReoptResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { description: An affected stop is not part of this run }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
        message:
          type: string

    IntakeText:
      type: object
      required: [text]
      properties:
        source:
          type: string
          enum: [voice, ocr, scan, manual]
          default: voice
        text:
          type: string
          description: Raw voice transcript or OCR text

    TemplateSegment:
      type: object
      required: [street_key]
      properties:
        street_key:
          type: string
          description: Normalised street key (e.g., "redwood:main north rd")
        direction:
          type: string
          enum: [odd_first, even_first, zigzag, asc, desc]
          default: asc
          description: Delivery direction for this street

    TemplateResponse:
      type: object
      properties:
        run_id:
          type: string
          format: uuid
        segments:
          type: integer

    BriefingResponse:
      type: object
      properties:
        briefing:
          type: string
          description: Spoken briefing for driver
        stops_count:
          type: integer
        set_aside_count:
          type: integer

    InterruptQuestion:
      type: object
      properties:
        speak:
          type: string
          description: Question to speak to driver
        index:
          type: integer
          description: Parcel index requiring clarification

    DeliveryEvent:
      type: object
      required: [id, stop_id, kind, occurred_at]
      properties:
        id:
          type: string
          format: uuid
          description: Client-generated for idempotent offline replay
        stop_id:
          type: string
          format: uuid
        kind:
          type: string
          enum: [delivered, left_at, skipped, failed]
          description: "D4: Voice delivery proof default"
        utterance:
          type: string
          description: Exact driver words
        safe_place:
          type: string
          description: "D9: Safe place if 'left at'"
        lat:
          type: number
          format: double
          description: GPS latitude at moment of event
        lon:
          type: number
          format: double
          description: GPS longitude at moment of event
        accuracy_m:
          type: number
          format: double
          description: GPS accuracy in meters (learning only if <= 15m)
        occurred_at:
          type: string
          format: date-time

    SyncResponse:
      type: object
      properties:
        cursor:
          type: integer
          description: Server cursor for incremental sync
        accepted:
          type: integer
          description: Number of events accepted

    RouteResponse:
      type: object
      required: [shift_id, run_id, engine, locked, total_distance_m, total_duration_s, parcels, capacity_parcels, over_capacity, window_violations, unroutable_stop_ids, stops]
      properties:
        shift_id: { type: string, format: uuid }
        run_id: { type: string, format: uuid }
        engine: { type: string }
        locked: { type: boolean }
        template_id: { type: string, nullable: true }
        total_distance_m: { type: number }
        total_duration_s: { type: number }
        parcels: { type: integer }
        capacity_parcels: { type: integer, nullable: true }
        over_capacity: { type: boolean }
        window_violations: { type: integer }
        unroutable_stop_ids:
          type: array
          items: { type: string, format: uuid }
        stops:
          type: array
          items:
            type: object
            required: [stop_id, sequence, lat, lon, arrival_at, departure_at, distance_m, cumulative_distance_m, late]
            properties:
              stop_id: { type: string, format: uuid }
              sequence: { type: integer }
              lat: { type: number }
              lon: { type: number }
              arrival_at: { type: string, format: date-time }
              departure_at: { type: string, format: date-time }
              distance_m: { type: number }
              cumulative_distance_m: { type: number }
              late: { type: boolean }

    HealthResponse:
      type: object
      required: [status, version, engines]
      properties:
        status: { type: string, enum: [ok] }
        version: { type: string }
        engines:
          type: array
          items: { type: string }

    AuthMe:
      type: object
      required: [user_id]
      properties:
        user_id: { type: string }
        session_id: { type: string, nullable: true }
        organization_id: { type: string, nullable: true }
        team_id: { type: string, nullable: true }

    AuthVerify:
      type: object
      required: [valid]
      properties:
        valid: { type: boolean }
        user_id: { type: string }

    PodResponse:
      type: object
      required: [event_id, stop_id, sha256, bytes, stored_at, already_stored]
      properties:
        event_id: { type: string, format: uuid }
        stop_id: { type: string, format: uuid }
        sha256: { type: string }
        bytes: { type: integer }
        stored_at: { type: string, format: date-time }
        already_stored: { type: boolean }

    ReoptResponse:
      type: object
      required: [run_id, engine, finish_delta_s, stops]
      properties:
        run_id: { type: string, format: uuid }
        engine: { type: string }
        finish_delta_s: { type: number }
        stops:
          type: array
          items: { type: object }

    StopResponse:
      type: object
      description: >-
        The stop as listStops returns it (ADR-010 §2): the routing
        coordinates and the live status ride beside the contract's original
        shape. `van_zone` and `tip` return when the van-loading and the door
        memory land.
      required: [id, seq, status]
      properties:
        id:
          type: string
          format: uuid
        address:
          type: string
          nullable: true
        seq:
          type: integer
        status:
          type: string
          enum: [pending, delivered, skipped, deferred, failed]
        lat:
          type: number
          nullable: true
        lon:
          type: number
          nullable: true
        priority:
          type: boolean
        parcels:
          type: integer
        service_time_s:
          type: integer
          nullable: true
        window_start:
          type: string
          format: date-time
          nullable: true
        window_end:
          type: string
          format: date-time
          nullable: true

    CreateRunRequest:
      type: object
      description: >-
        The narrowed request of ADR-010 §3: unknown fields are refused, never
        dropped silently. `territory` comes back 422 until the schema gains a
        home for it; the finish point and the break window stay out until the
        runs table gains columns for them.
      required: [name, shift_id, depot, start_at]
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        shift_id:
          type: string
          format: uuid
        depot:
          type: object
          required: [lat, lon]
          additionalProperties: false
          properties:
            lat: { type: number, minimum: -90, maximum: 90 }
            lon: { type: number, minimum: -180, maximum: 180 }
        start_at:
          type: string
          format: date-time
        capacity_parcels:
          type: integer
          minimum: 0
          maximum: 9999
        speed_kmh:
          type: number
          minimum: 1
          maximum: 120
          default: 30

    RunResponse:
      type: object
      required: [id, shift_id, name, depot, speed_kmh, start_at]
      properties:
        id:
          type: string
          format: uuid
        shift_id:
          type: string
          format: uuid
        name:
          type: string
        depot:
          type: object
          required: [lat, lon]
          properties:
            lat: { type: number }
            lon: { type: number }
        capacity_parcels:
          type: integer
          nullable: true
        speed_kmh:
          type: number
        start_at:
          type: string
          format: date-time

    LocationNote:
      type: object
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
          enum: [entry, gate_code, hazard, safe_place, access]
        body:
          type: string
        confidence:
          type: number
          format: float
        last_confirmed:
          type: string
          format: date-time

    CreateLocationNoteRequest:
      type: object
      required: [kind, body]
      properties:
        kind:
          type: string
          enum: [entry, gate_code, hazard, safe_place, access]
        body:
          type: string
        confidence:
          type: number
          format: float
          default: 0.5

  # WebSocket message schemas (for documentation)
  x-websocket-messages:
    client_to_server:
      - type: transcript
        fields:
          type: string
          enum: [transcript]
          text: string
          final: boolean
          gps:
            type: object
            properties:
              lat: number
              lon: number
              accuracy_m: number
              speed_kmh: number
      - type: gps
        fields:
          type: string
          enum: [gps]
          lat: number
          lon: number
          accuracy_m: number
          speed_kmh: number

    server_to_client:
      - type: say
        fields:
          type: string
          enum: [say]
          text: string
          priority: string
          enum: [now, queue]
      - type: state
        fields:
          type: string
          enum: [state]
          stop: object
      - type: approach_whisper
        fields:
          type: string
          enum: [approach_whisper]
          stop_id: string
          distance_m: number
          instruction: string
      - type: imminent_whisper
        fields:
          type: string
          enum: [imminent_whisper]
          stop_id: string
          distance_m: number
          instruction: string