# Gitleaks configuration (V4 §7: zero findings).
#
# The default ruleset is used. The only exclusion is the auth service's test
# fixtures: they contain fixed strings that look like credentials to the
# generic-api-key rule. They are test inputs, never real secrets — the tests
# assert that the service refuses to start without a real one.
#
# Note: gitleaks 8.24 reads the global list under the singular key.

[extend]
useDefault = true

[allowlist]
description = "The fixed test strings of the auth and API services (they are not credentials)"
regexTarget = "secret"
regexes = [
  '''a-secret-that-is-definitely-long-enough-32''',
  '''test-only-value-not-a-real-credential-0000''',
  '''test-secret-value-with-at-least-32-characters''',
  '''server-test-secret-value-long-enough-32''',
  '''test-only-pod-url-signing-secret-0123456789''',
  '''a-different-pod-signing-secret-0123456789''',
  '''not-the-server-key-0123456789abcdef''',
  '''ci-only-pod-signing-secret-0123456789''',
  # The generic-api-key rule reads the argument after a `*_SECRET` constant as
  # the secret itself; this one is a TTL (and the call is one arg per line now).
  '''ttl_seconds=-1''',
  # The auth client's token test: two hand-written stand-ins for Better Auth's
  # session token and for the bearer token the auth service mints. They are
  # fixtures for a test that asserts WHICH of the two values the app sends to
  # the API (the API verifies the minted one and refuses the session's own),
  # they are in the shapes those tokens have because that is what the code has
  # to handle, and no service ever issued or verified either of them.
  '''yHT7olEgGGR3oD67hKsSRtQIXJ7fojlg''',
  '''eyJhbGciOiJFUzI1NiIsImtpZCI6Im1pbnRlZC1qd2sifQ.minted.courier''',
]
