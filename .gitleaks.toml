# Gitleaks configuration (V4 §7: zero findings).
#
# The default ruleset is used; the only exclusion is the auth service's test
# fixtures, which contain fixed strings that look like credentials to the
# generic-api-key rule. They are test inputs, never real secrets, and the
# tests assert that the service refuses to start without a real one.

[extend]
useDefault = true

[[allowlists]]
description = "Test-only constants in the auth service (not credentials)"
paths = ['''services/auth/tests/''']
rules = ["generic-api-key"]

[[allowlists]]
description = "The example values in the environment template"
paths = ['''\.env\.example$''']
