appId: com.courier.copilot
name: Stops list and the delivered action
---
- launchApp:
    clearState: true
- assertVisible:
    id: "login-screen"
- tapOn: "Sign Up"
- tapOn:
    id: "register-email"
- inputText: "stops@example.co.nz"
- tapOn:
    id: "register-password"
- inputText: "correct-horse-battery"
- tapOn: "Create Account"
- extendedWaitUntil:
    visible:
      id: "today-screen"
    timeout: 20000
- tapOn: "Stops"
- assertVisible:
    id: "stops-screen"
- assertVisible:
    id: "stop-2"
- tapOn:
    id: "stop-2"
- assertVisible: "Mark Delivered"
- tapOn: "Mark Delivered"
- assertVisible: "Delivered"
