appId: com.courier.copilot
name: The voice-sample recorder records with consent (A3)
---
# BUG-185: stop the app FIRST, then clear its state.
- stopApp
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: "today-screen"
    timeout: 60000
# The settings' Debug row (rendered in the test build the E2E legs install)
# opens the recorder screen.
- openLink: "courier:///settings"
- extendedWaitUntil:
    visible:
      id: "settings-screen"
    timeout: 30000
- tapOn:
    id: "settings-voice-samples"
- extendedWaitUntil:
    visible:
      id: "voice-samples-screen"
    timeout: 30000
# The exact per-purpose wording is on the screen (consent is never bundled).
- assertVisible:
    id: "voice-samples-wording-evaluation"
- assertVisible:
    id: "voice-samples-wording-training"
# Consent to evaluation use, separately from training use. Wait until the
# switch reads checked, so the consent record is written before Record taps.
- tapOn:
    id: "voice-samples-consent-evaluation"
- extendedWaitUntil:
    visible:
      id: "voice-samples-consent-evaluation"
      checked: true
    timeout: 15000
# On the 320x640 emulator the Record control sits below the fold of the
# screen's own ScrollView (the BUG-050 class), so reveal it first - the
# repo's scrollUntilVisible convention (summary.yaml, sign-in.yaml).
- scrollUntilVisible:
    element:
      id: "voice-samples-record"
    direction: DOWN
    timeout: 20000
# Record, then stop: the sample lands in the list below.
- tapOn:
    id: "voice-samples-record"
- scrollUntilVisible:
    element:
      id: "voice-samples-stop"
    direction: DOWN
    timeout: 20000
- tapOn:
    id: "voice-samples-stop"
- scrollUntilVisible:
    element:
      id: "voice-samples-list"
    direction: DOWN
    timeout: 20000
- extendedWaitUntil:
    visible:
      id: "voice-samples-sample-"
    timeout: 30000
# Delete removes the sample again.
- scrollUntilVisible:
    element:
      id: "voice-samples-sample-.*-delete"
    direction: DOWN
    timeout: 20000
- tapOn:
    id: "voice-samples-sample-.*-delete"
- extendedWaitUntil:
    visible:
      id: "voice-samples-empty"
    timeout: 15000
# Record once more, then revoke (the second tap confirms): revocation deletes
# every sample. The Record control is ABOVE the list we just scrolled to, so
# the reveal scrolls back up.
- scrollUntilVisible:
    element:
      id: "voice-samples-record"
    direction: UP
    timeout: 20000
- tapOn:
    id: "voice-samples-record"
- scrollUntilVisible:
    element:
      id: "voice-samples-stop"
    direction: UP
    timeout: 20000
- tapOn:
    id: "voice-samples-stop"
- scrollUntilVisible:
    element:
      id: "voice-samples-list"
    direction: DOWN
    timeout: 20000
- extendedWaitUntil:
    visible:
      id: "voice-samples-sample-"
    timeout: 30000
- scrollUntilVisible:
    element:
      id: "voice-samples-revoke"
    direction: DOWN
    timeout: 20000
- tapOn:
    id: "voice-samples-revoke"
- tapOn:
    id: "voice-samples-revoke"
- extendedWaitUntil:
    visible:
      id: "voice-samples-empty"
    timeout: 15000
- assertNotVisible:
    id: "voice-samples-sample-"
