appId: com.courier.copilot
name: 01 Control Room - the four screens of the direction
---
# The flow that records the video of the direction (MASTER_EXECUTION §13.6).
# It opens the lab route with a deep link, walks the four screens of the
# brief in order, presses the confirmation so the signature moment is on the
# recording, and ends on the night theme.
- launchApp:
    clearState: true
- openLink: "courier://design2/01-control-room/today"
- extendedWaitUntil:
    visible:
      id: "today-screen"
    timeout: 45000
- assertVisible:
    id: "today-next-stop"
- tapOn:
    id: "today-next-stop"
- takeScreenshot: "01-control-room-today"
- openLink: "courier://design2/01-control-room/driving"
- extendedWaitUntil:
    visible:
      id: "driving-screen"
    timeout: 45000
- assertVisible:
    id: "driving-next-stop"
- takeScreenshot: "01-control-room-driving"
- openLink: "courier://design2/01-control-room/copilot"
- extendedWaitUntil:
    visible:
      id: "copilot-screen"
    timeout: 45000
- takeScreenshot: "01-control-room-copilot"
- openLink: "courier://design2/01-control-room/scanner"
- extendedWaitUntil:
    visible:
      id: "scanner-screen"
    timeout: 45000
- takeScreenshot: "01-control-room-scanner"
- openLink: "courier://design2/01-control-room/today?theme=night"
- extendedWaitUntil:
    visible:
      id: "today-screen"
    timeout: 45000
- takeScreenshot: "01-control-room-today-night"
