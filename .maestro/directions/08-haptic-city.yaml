appId: com.courier.copilot
name: 08 Haptic City - the four screens of the direction
---
# The flow that records the video of the direction (MASTER_EXECUTION §13.6).
# It opens the lab route with a deep link, walks the four screens of the
# brief in order, presses the seal so the signature moment is on the
# recording, and ends on the night theme.
- launchApp:
    clearState: true
- openLink: "courier://design2/08-haptic-city/today"
- extendedWaitUntil:
    visible:
      id: "today-screen"
    timeout: 45000
- assertVisible:
    id: "today-seal"
- tapOn:
    id: "today-seal"
- takeScreenshot: "08-haptic-city-today"
- openLink: "courier://design2/08-haptic-city/driving"
- extendedWaitUntil:
    visible:
      id: "driving-screen"
    timeout: 45000
- assertVisible:
    id: "driving-next-stop"
- takeScreenshot: "08-haptic-city-driving"
- openLink: "courier://design2/08-haptic-city/copilot"
- extendedWaitUntil:
    visible:
      id: "copilot-screen"
    timeout: 45000
- takeScreenshot: "08-haptic-city-copilot"
- openLink: "courier://design2/08-haptic-city/scanner"
- extendedWaitUntil:
    visible:
      id: "scanner-screen"
    timeout: 45000
- takeScreenshot: "08-haptic-city-scanner"
- openLink: "courier://design2/08-haptic-city/today?theme=night"
- extendedWaitUntil:
    visible:
      id: "today-screen"
    timeout: 45000
- takeScreenshot: "08-haptic-city-today-night"
