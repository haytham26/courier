appId: com.courier.copilot
name: 03 Address First - the four screens of the direction
---
# The flow that records the video of the direction (MASTER_EXECUTION §13.6).
# It opens the lab route with a deep link, walks the four screens of the
# brief in order, presses the confirmation so the signature moment is on the
# recording, and ends on the night theme.
- launchApp:
    clearState: true
- openLink: "courier://design2/03-address-first/today"
- extendedWaitUntil:
    visible:
      id: "today-screen"
    timeout: 45000
- assertVisible:
    id: "today-next-stop"
- tapOn:
    id: "today-next-stop"
- takeScreenshot: "03-address-first-today"
- openLink: "courier://design2/03-address-first/driving"
- extendedWaitUntil:
    visible:
      id: "driving-screen"
    timeout: 45000
- assertVisible:
    id: "driving-next-stop"
- takeScreenshot: "03-address-first-driving"
- openLink: "courier://design2/03-address-first/copilot"
- extendedWaitUntil:
    visible:
      id: "copilot-screen"
    timeout: 45000
- takeScreenshot: "03-address-first-copilot"
- openLink: "courier://design2/03-address-first/scanner"
- extendedWaitUntil:
    visible:
      id: "scanner-screen"
    timeout: 45000
- takeScreenshot: "03-address-first-scanner"
- openLink: "courier://design2/03-address-first/today?theme=night"
- extendedWaitUntil:
    visible:
      id: "today-screen"
    timeout: 45000
- takeScreenshot: "03-address-first-today-night"
