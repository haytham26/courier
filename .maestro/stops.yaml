appId: com.courier.copilot
name: The stops list opens a stop
---
# BUG-185: stop the app FIRST, then clear its state. A launch that clears state
# force-stops the running app, and the old task removal then killed the freshly
# started process (run 41609308041's api-34 leg: "remove task" killed the new pid
# and the flow's 60s wait timed out) - stopping first lets the task be gone.
- stopApp
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: "today-screen"
    timeout: 60000
# The tab is tapped by its testID: the word "Stops" also appears on today's
# list ("5 stops, dry") and Maestro matches the text case-insensitively.
- tapOn:
    id: "tab-stops"
- extendedWaitUntil:
    visible:
      id: "stop-2"
    timeout: 30000
- tapOn:
    id: "stop-2"
- extendedWaitUntil:
    visible:
      id: "stop-detail-sheet"
    timeout: 30000
# Maestro matches the text exactly, so the assertion is the whole address.
- assertVisible: "45 Papanui Road"
- assertVisible: "Merivale"
- takeScreenshot: "stop-detail"
