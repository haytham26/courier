appId: com.courier.copilot
name: The stops list opens a stop
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: "today-screen"
    timeout: 60000
- tapOn: "Stops"
- extendedWaitUntil:
    visible:
      id: "stops-screen"
    timeout: 30000
- assertVisible:
    id: "stop-2"
- tapOn:
    id: "stop-2"
# The assertion is the whole text: Maestro matches the text exactly, not a
# part of it.
- assertVisible: "45 Papanui Road"
- assertVisible: "Merivale"
- takeScreenshot: "stop-detail"
