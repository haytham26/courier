appId: com.courier.copilot
name: Today's list shows the day
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: "today-screen"
    timeout: 60000
# The assertions are the screen's own testIDs: the copy moves with the design,
# the testIDs are the contract.
- assertVisible:
    id: "today-mark-delivered"
- assertVisible:
    id: "today-skip"
- assertVisible:
    id: "today-fail"
- assertVisible:
    id: "today-settings"
- takeScreenshot: "today-list"
