appId: com.courier.copilot
name: Today's list shows the day
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: "today-screen"
    timeout: 60000
# The settings affordance moved to the Account tab of the floating bar
# (D34); the intent stands - the settings are reachable on arrival.
- assertVisible:
    id: "tab-settings"
# The actions live inside the run sheet now (the design moved them there),
# and the sheet opens at peek - the morning glance - where the screen's
# centre, where a scroll gesture starts, is the map above the sheet. The
# courier raises the sheet with its grabber first (the design's own
# gesture); from half the scroll runs inside the sheet and reaches the
# actions.
- swipe:
    from:
      id: "today-sheet-grabber"
    direction: UP
# The actions are the screen's own testIDs: the copy moves with the design,
# the testIDs are the contract.
- scrollUntilVisible:
    element:
      id: "today-mark-delivered"
    direction: DOWN
    timeout: 20000
# The assertions are the screen's own testIDs: the copy moves with the design,
# the testIDs are the contract.
- assertVisible:
    id: "today-mark-delivered"
- assertVisible:
    id: "today-skip"
- assertVisible:
    id: "today-fail"
- takeScreenshot: "today-list"
