appId: com.courier.copilot
name: Today's list shows the day
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: "today-screen"
    timeout: 60000
# The stat labels are upper case in the design, so the flow looks for them the
# way the screen shows them.
- assertVisible: "DELIVERED"
- assertVisible: "REMAINING"
- assertVisible: "SUCCESS RATE"
- assertVisible: "Current Run"
- takeScreenshot: "today-list"
