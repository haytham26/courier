appId: com.courier.copilot
name: The end-of-day summary
---
# BUG-185: stop the app FIRST, then clear its state. A launch that clears state
# force-stops the running app, and the old task removal then killed the freshly
# started process (run 41609308041's api-34 leg: "remove task" killed the new pid
# and the flow's 60s wait timed out) - stopping first lets the task be gone.
- stopApp
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: "today-screen"
    timeout: 60000
# The way in is Today's End of day action: the dock carries no summary tab, so
# Today opens it (the run's own end of day).
# The action lives inside the run sheet, and the sheet opens at peek - the
# morning glance - where the screen's centre, where a tap's coordinate is
# judged, sits above the sheet's top edge. The courier raises the sheet with
# its grabber first (the design's own gesture, the same one today-list rides).
- swipe:
    from:
      id: "today-sheet-grabber"
    direction: UP
- scrollUntilVisible:
    element:
      id: "today-end-of-day"
    direction: DOWN
    timeout: 20000
- tapOn:
    id: "today-end-of-day"
- extendedWaitUntil:
    visible:
      id: "summary-screen"
    timeout: 30000
# What the day says (A3, the QA inspector's step 28): THIS run's own numbers,
# and an honest "Not tracked yet" for what the phone does not track. The
# reference mockup's $438.20, 206 delivered and 92 km are gone from every
# build - earnings are D60, not in the trial.
- assertVisible:
    id: "summary-earned"
# The money says so rather than showing a number the phone never earned.
- assertVisible: "Not tracked yet"
- assertVisible: "Earnings are not tracked in the trial"
# The three counts are the run's own: a fresh launch of the E2E day has
# nothing delivered yet, so the counter reads 0 - not the reference's 206.
- assertVisible:
    id: "summary-delivered"
- assertVisible:
    id: "summary-failed"
- assertVisible:
    id: "summary-driven"
# The carrier split is D60 too: the card is there and says "Not tracked yet".
- assertVisible:
    id: "summary-carriers"
- assertVisible:
    id: "summary-carriers-none"
# The dock stays on a root-stack route: the summary is not a tab, and the way
# out is the dock itself.
- assertVisible:
    id: "tab-bar"
- takeScreenshot: "summary"