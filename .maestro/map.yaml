appId: com.courier.copilot
name: The map screen renders
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: "today-screen"
    timeout: 60000
# The tab is tapped by its testID: the words on today's list can match the
# tab labels, and Maestro matches the text case-insensitively.
- tapOn:
    id: "tab-map"
- extendedWaitUntil:
    visible:
      id: "map-screen"
    timeout: 30000
- takeScreenshot: "map"
