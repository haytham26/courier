appId: com.courier.copilot
name: The map screen renders
---
# BUG-185: stop the app FIRST, then clear its state. A launch that clears state
# force-stops the running app, and the old task removal then killed the freshly
# started process (run 41609308041's api-34 leg: "remove task" killed the new pid
# and the flow's 60s wait timed out) - stopping first lets the task be gone.
- stopApp
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: "today-screen"
    timeout: 60000
# The tab is tapped by its testID: the words on today's list can match the
# tab labels, and Maestro matches the text case-insensitively.
- tapOn:
    id: "tab-map"
- extendedWaitUntil:
    visible:
      id: "map-screen"
    timeout: 30000
- takeScreenshot: "map"
