appId: com.courier.copilot
name: "The lock screen's glance - the run's Live Activity (screen 13)"
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: "today-screen"
    timeout: 60000
# The way in: the lock screen's content is opened from the Account tab's row,
# because the phone's own lock screen is the OS surface (the Live Activity on
# iOS, the ongoing notification on Android) and this is the way to see the
# design without locking the phone.
- tapOn:
    id: "tab-settings"
- extendedWaitUntil:
    visible:
      id: "settings-screen"
    timeout: 30000
# The row sits inside the settings screen's own ScrollView, and Android drops
# the clipped rows out of the view hierarchy: below the fold it is not in the
# tree at all, so a plain tap finds nothing (the api-34 leg of run 40872212564
# failed at exactly this). The repo's own gesture for a row that is on the
# screen but not visible is `scrollUntilVisible` (the same one summary.yaml and
# today-list.yaml use inside the sheet), and it never weakens the tap's target.
- scrollUntilVisible:
    element:
      id: "settings-lock-screen"
    direction: DOWN
    timeout: 20000
- tapOn:
    id: "settings-lock-screen"
- extendedWaitUntil:
    visible:
      id: "lock-screen"
    timeout: 30000
# The reference (13-lock-screen.html): the pill with the distance and the ETA,
# the clock, the Live Activity card with the run's progress, and the two
# lock-screen actions.
- assertVisible:
    id: "lock-pill"
- assertVisible:
    id: "lock-activity"
- assertVisible:
    id: "lock-delivered"
- assertVisible:
    id: "lock-call"
- assertVisible: "120 m"
- assertVisible:
    id: "lock-progress"
- takeScreenshot:
    path: "lock-screen"
