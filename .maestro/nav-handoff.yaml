appId: com.courier.copilot
name: 'The drive hands the stop to the nav app (queue 4g, trial #15)'
---
# Queue 4g's courier-facing half: the navigation hand-off (the trial's #15,
# built in PR #191 as `driving-nav-handoff`). The drive's own map is not a nav
# engine, so the panel's "Open in nav app" hands the run's own stop to the nav
# app the courier already has, with the key-free Google Maps deep link.
#
# What this flow proves on the emulator: the control rides the drive panel
# with the run's own stop, and the press takes the hand-off - the pinned
# emulator image ships Google Maps, so the key-free link is answered and Maps
# takes the foreground; back then returns to the drive, which is still on the
# run's stop (the app did not crash and kept its place in the stack). On a
# phone with no nav app the link is unanswered and the drive simply stays
# (the hand-off's 'failed' answer is a console warning, by design).
#
# BUG-185: stop the app FIRST, then clear its state.
- stopApp
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: "today-screen"
    timeout: 60000
# The Go sits inside the run sheet, below the fold of the peek: raise the
# sheet first (driving.yaml's convention).
- swipe:
    from:
      id: "today-sheet-grabber"
    direction: UP
- tapOn:
    id: "today-go"
- extendedWaitUntil:
    visible:
      id: "driving-screen"
    timeout: 30000

# The hand-off control: the accent pill under the slide, on the drive panel,
# visible without scrolling on the emulator (driving.yaml asserts the slide
# at the same depth).
- assertVisible:
    id: "driving-nav-handoff"
- assertVisible: "Open in nav app"
- tapOn:
    id: "driving-nav-handoff"
- waitForAnimationToEnd:
    timeout: 2500
# The hand-off was taken: the pinned emulator image ships Google Maps, so the
# key-free link IS answered and the nav app takes the foreground (run
# 42167328086's api-34 leg: after the tap the screen showed Maps' own landing
# - "Make it your map" - and driving-screen was gone). That is exactly what
# the hand-off is for. The image is pinned by revision (PR #204), so Maps'
# landing text is deterministic on both api legs.
- extendedWaitUntil:
    visible:
      text: "Make it your map"
    timeout: 30000
- takeScreenshot: "nav-app-answered"
# Maps' own location prompt appears a beat AFTER its landing on a fresh
# emulator (runs 42171396160 / 42175587894 / 42181802892 / 42186483187: a tap
# fired while the landing was still up warned through even with
# waitUntilVisible, and `back` does not dismiss the system dialog - the dialog
# was up when the drive was asserted). So WAIT for the dialog's own button
# (required: the image is pinned by revision, PR #204, and the runner grants
# permissions to OUR app only, so Maps always asks - seen on all four runs),
# tap it, then go back to the drive, which is still on the run's stop: the app
# did not crash, did not invent a chooser, and kept its place in the stack.
# Note `text` in a selector is a REGEX in Maestro 2.11 (it deserializes to the
# selector's textRegex field - run 42181802892 - and the YAML key `textRegex`
# itself is rejected, run 42179171405), so "Don.t allow" matches the pinned
# image's typographic apostrophe (U+2019) and the ASCII one.
- extendedWaitUntil:
    visible:
      text: "Don.t allow"
    timeout: 30000
- tapOn:
    text: "Don.t allow"
- back
- extendedWaitUntil:
    visible:
      id: "driving-screen"
    timeout: 15000
- assertVisible: "STOP 2 OF 5"
- takeScreenshot: "nav-handoff-taken"
