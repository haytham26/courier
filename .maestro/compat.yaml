appId: com.courier.copilot
name: B.7 compatibility screen and the voice permission prompt
---
- launchApp:
    clearState: true
- openLink: "courier://compat"
- extendedWaitUntil:
    visible:
      id: "compat-screen"
    timeout: 60000
# The recording permission prompt appears when expo-audio asks for the microphone.
- runFlow:
    when:
      visible:
        id: "compat-audio"
    commands:
      - tapOn: "While using the app"
      - tapOn: "Allow"
- extendedWaitUntil:
    visible:
      id: "compat-running"
    timeout: 60000
- assertVisible:
    id: "compat-sherpa"
- assertVisible:
    id: "compat-camera"
- assertVisible:
    id: "compat-maplibre"
- assertVisible:
    id: "compat-opsqlite"
- assertVisible:
    id: "compat-audio"
- assertVisible:
    id: "compat-reanimated"
- takeScreenshot: "b7-compat"
