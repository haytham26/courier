appId: com.courier.copilot
name: B.7 compatibility screen and the voice permission prompt
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: "today-screen"
    timeout: 60000
# The compatibility screen is reached from the settings, the way a courier (or
# a support agent on the phone) would reach it.
- tapOn:
    id: "today-settings"
- extendedWaitUntil:
    visible:
      id: "settings-screen"
    timeout: 30000
# The Diagnostics section is at the bottom of the settings.
- swipe:
    direction: UP
    duration: 400
- swipe:
    direction: UP
    duration: 400
- swipe:
    direction: UP
    duration: 400
- swipe:
    direction: UP
    duration: 400
- swipe:
    direction: UP
    duration: 400
- swipe:
    direction: UP
    duration: 400
- swipe:
    direction: UP
    duration: 400
- swipe:
    direction: UP
    duration: 400
- tapOn:
    id: "settings-compat"
- extendedWaitUntil:
    visible:
      id: "compat-screen"
    timeout: 60000
# The runner grants the microphone and the location up front, so the system
# dialog does not sit on top of the screen the flow reads. If it does appear,
# it is dismissed by its own button.
- runFlow:
    when:
      visible: "While using the app"
    commands:
      - tapOn: "While using the app"
- extendedWaitUntil:
    visible:
      id: "compat-running"
    timeout: 60000
- assertVisible:
    id: "compat-sherpa"
- assertVisible:
    id: "compat-camera"
- assertVisible:
    id: "compat-maplibre"
- assertVisible:
    id: "compat-opsqlite"
- assertVisible:
    id: "compat-audio"
- assertVisible:
    id: "compat-reanimated"
- takeScreenshot: "b7-compat"
