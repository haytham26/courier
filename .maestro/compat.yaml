appId: com.courier.copilot
name: B.7 compatibility screen and the voice permission prompt
---
# BUG-185: stop the app FIRST, then clear its state. A launch that clears state
# force-stops the running app, and the old task removal then killed the freshly
# started process (run 41609308041's api-34 leg: "remove task" killed the new pid
# and the flow's 60s wait timed out) - stopping first lets the task be gone.
- stopApp
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: "today-screen"
    timeout: 60000
# The compatibility screen is reached from the settings, the way a courier (or
# a support agent on the phone) would reach it. The slot keeps the settings
# route's testID: the D34 dock's words move with the design, the testIDs do
# not (`today-settings` became `tab-settings`, the D34 consequence).
- tapOn:
    id: "tab-settings"
- extendedWaitUntil:
    visible:
      id: "settings-screen"
    timeout: 30000
# The deep link opens the compatibility screen. The root stack keeps every route
# registered (Stack.Protected), so a link to /compat is routed instead of ignored.
- openLink: "courier:///compat"
- extendedWaitUntil:
    visible:
      id: "compat-screen"
    timeout: 60000
# The runner grants the microphone and the location up front, so the system
# dialog does not sit on top of the screen the flow reads. If it does appear,
# it is dismissed by its own button.
- runFlow:
    when:
      visible: "While using the app"
    commands:
      - tapOn: "While using the app"
- extendedWaitUntil:
    visible:
      id: "compat-running"
    timeout: 60000
- assertVisible:
    id: "compat-sherpa"
- assertVisible:
    id: "compat-camera"
- assertVisible:
    id: "compat-maplibre"
- assertVisible:
    id: "compat-opsqlite"
- assertVisible:
    id: "compat-audio"
- assertVisible:
    id: "compat-reanimated"
- takeScreenshot: "b7-compat"
