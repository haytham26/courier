._r{font-family:ui-rounded,'SF Pro Rounded',-apple-system,'Inter',sans-serif}
@keyframes bars{0%,100%{transform:scaleY(.3)}50%{transform:scaleY(1)}}
@keyframes flow{to{stroke-dashoffset:-40}}
@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.06);opacity:1}100%{transform:scale(1)}}

<button type="button" style="height:54px;border:0;border-radius:14px;background:rgba(10,124,255,.12);color:#0A7CFF;font:inherit;font-size:17px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;border-radius:27px"><svg aria-hidden="true" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#0A7CFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="15" r="4"></circle><path d="M11 12l9-9M17 6l3 3"></path></svg>Use a Passkey</button>

<button type="button" style="height:54px;border:0;border-radius:14px;background:rgba(120,120,128,.12);color:#000000;font:inherit;font-size:17px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;border-radius:27px"><svg aria-hidden="true" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#000000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2.5"></rect><path d="M3.5 7l8.5 6 8.5-6"></path></svg>Continue with Email</button>
