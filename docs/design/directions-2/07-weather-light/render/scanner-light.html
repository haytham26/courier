<!doctype html>
<html lang="en-NZ">
<head>
<meta charset="utf-8">
<title>Weather Light - scanner - light</title>
<link rel="stylesheet" href="../../fonts/fonts.css">
<style>
@font-face { font-family: display; src: local('Instrument Sans'); }
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 390px; height: 844px; overflow: hidden; }
body {
  background: #eef2f4;
  color: #0d161a;
  font-family: 'Public Sans', system-ui, sans-serif;
  -webkit-font-smoothing: antialiased;
}
.frame { width: 390px; height: 844px; overflow: hidden; display: flex; flex-direction: column; }
.display { font-family: 'Instrument Sans', 'Public Sans', system-ui, sans-serif; }
.metric{font-family:display;font-size:64px;line-height:68px;letter-spacing:-0.03em;font-weight:700;}.address{font-family:display;font-size:30px;line-height:38px;letter-spacing:-0.01em;font-weight:600;}.row{font-family:work;font-size:21px;line-height:28px;letter-spacing:0em;font-weight:400;}.label{font-family:work;font-size:17px;line-height:22px;letter-spacing:0.08em;font-weight:600;}.body{font-family:work;font-size:19px;line-height:26px;letter-spacing:0em;font-weight:400;}.caption{font-family:work;font-size:17px;line-height:22px;letter-spacing:0.01em;font-weight:600;}.title{font-family:display;font-size:32px;line-height:40px;letter-spacing:-0.02em;font-weight:700;}
.tabular { font-variant-numeric: tabular-nums; }

.screen { }
.next { display: flex; flex-direction: column; gap: 4px; }
.nowblock { display: flex; flex-direction: column; gap: 4px; }
.plate { display: flex; flex-direction: column; gap: 12px; }
.platerow { display: flex; align-items: flex-start; gap: 16px; }
.platemain { flex: 1; display: flex; flex-direction: column; gap: 2px; }
.plateside { display: flex; flex-direction: column; align-items: flex-end; }
.rows { display: flex; flex-direction: column; }
.row { display: flex; align-items: center; gap: 12px; min-height: 64px; padding: 8px 0; border-bottom: 1px solid transparent; }
.rowmain { flex: 1; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.action { min-height: 72px; display: flex; align-items: center; justify-content: center; }
.voice { display: flex; flex-direction: column; gap: 8px; }
.voice.haptic, .voice.gantry { flex-direction: row; align-items: center; gap: 12px; }
.haptictarget { width: 56px; height: 56px; border-radius: 28px; border: 2px solid; display: flex; align-items: center; justify-content: center; }
.hapticseal { min-height: 72px; display: flex; align-items: center; justify-content: center; gap: 12px; }
.gantrysign { padding: 8px 12px; display: inline-flex; }
.gantrysigncard { display: flex; flex-direction: column; gap: 4px; }
.talk { min-height: 72px; display: flex; align-items: center; justify-content: center; }
.secondary { min-height: 56px; display: flex; align-items: center; justify-content: center; }
.viewfinder { display: flex; flex-direction: column; }
</style>
</head>
<body>
<div class="frame" data-direction="weatherLight" data-mode="light">
<div class="screen" style="height:844px;display:flex;flex-direction:column">
  <div class="viewfinder" style="flex:1;margin:16px;background:#0d161a;border-radius:16px;padding:24px;position:relative">
    <div>
      <p style="font-size:26px;line-height:32px;font-weight:700;color:#ffffff">14 HAREWOOD RD</p>
      <p style="font-size:20px;line-height:26px;font-weight:600;color:#ffffff">PAPANUI</p>
      <p style="font-size:15px;line-height:20px;color:#ffffff">14 HAREWOOD RD &middot; PAPANUI &middot; 8014</p>
    </div>
    <div class="guide" style="position:absolute;left:32px;right:32px;top:80px;height:120px;border:2px solid #0a4a63;border-radius:8px"></div>
    <div style="margin-top:auto">
      <p style="font-size:15px;line-height:20px;color:#ffffff">Reading the address block</p>
    </div>
  </div>
  <div style="padding:24px">
    <div style="display:flex;justify-content:space-between;align-items:center">
      <p class="label" style="color:#3c4d55">Found</p>
      <p class="caption" style="color:#14603c">Confident</p>
    </div>
    <p class="address" style="color:#0d161a;padding-top:8px">14 HAREWOOD RD</p>
    <p class="body" style="color:#3c4d55">Stop 45 &middot; PAPANUI</p>
    <div style="padding-top:16px"><div class="action" style="background:#0a4a63;border-radius:10px"><p class="row" style="color:#ffffff;font-weight:700">Confirm the address</p></div></div>
    <div class="secondary" style="border:1px solid #5d6f77;border-radius:8px;margin-top:12px">
      <p class="row" style="color:#0d161a">Correct this address</p>
    </div>
  </div>
</div>
</div>
</body>
</html>
