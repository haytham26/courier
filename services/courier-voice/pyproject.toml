[build-system]
requires = ["setuptools>=61.0", "uv"]
build-backend = "setuptools.build_meta"

[project]
name = "courier-voice"
version = "0.1.0"
description = "Courier Voice - the shift companion (D23)"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.1",
    "httpx>=0.28.1",
    "pyjwt[crypto]>=2.15.1",
    # The cost guard's day is a New Zealand calendar day (BUG-155), so it reads
    # `ZoneInfo("Pacific/Auckland")`. A Linux container carries the IANA
    # database in the OS; a Windows box (the founder's, and CI's) does not, and
    # `zoneinfo` raises ZoneInfoNotFoundError without this package. On Linux it
    # is not installed at all - the marker says so.
    "tzdata>=2024.1; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    # B4: the mutation testing floor over the turn machine, the same one the
    # API's sync/runs/auth modules run at.
    "mutmut>=3.3,<4",
]
eval = [
    "numpy>=2.4.6",
    "sherpa-onnx>=2.0.1",
    "soundfile>=0.14.0",
]

[tool.uv]
# The security patch for a transitive dependency (the audits must stay clean):
# PYSEC-2026-4320 in certifi.
constraint-dependencies = [
    "certifi>=2026.10.19",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.mutmut]
# B4: the mutation floor over the turn machine (the audit's courier-voice slice).
# turns.py is where one turn of the conversation is decided, and conversation.py,
# safety.py and offline_brain.py are what a turn depends on; all four are in
# scope. The tests directory is never mutated.
source_paths = [
    "app/turns.py",
    "app/conversation.py",
    "app/safety.py",
    "app/offline_brain.py",
]

# The eval harness's test reads `packages/eval/voice/manifest/shift_sims.json`
# through `parents[3]` - the REPOSITORY ROOT - which the copied mutant tree
# resolves to the service directory, so no `also_copy` can satisfy it (run
# 41264345233: `also_copy = ["packages"]` was in place and the test still
# failed). Its own CI job proves it (ci.yml runs the whole suite); here it would
# fail every mutant for the harness's reason, not the code's. mutmut appends
# this to every pytest invocation it makes.
# The eval AUDIO test fails the same way, one layer earlier: it imports numpy
# and soundfile, which are the `eval` extra - ci.yml installs that extra
# (`uv sync --extra dev --extra eval`) but this lane runs `--extra dev` only,
# and run 42210602994's voice job died at COLLECTION with
# `ModuleNotFoundError: No module named 'numpy'` before a single mutant ran
# (BUG-241). `app/eval_audio.py` is outside this floor's `source_paths`, so
# nothing the lane mutates needs the extra; the test's own CI job proves it.
pytest_add_cli_args = [
    "--ignore=tests/test_eval_harness.py",
    "--ignore=tests/test_eval_audio.py",
    # The same reason as the two above, one file further: the TTS builder's own
    # suite imports numpy (the `eval` extra) for the samples it feeds through
    # the builder's seam, and mutmut runs with `--extra dev` only. Its own CI
    # job (the `eval` extra) proves it; here it would fail every mutant for the
    # import's reason, not the code's.
    "--ignore=tests/test_eval_tts.py",
    # The turn-set scorer reaches the judge through `app/eval_audio.py`, which
    # imports numpy and soundfile at module scope - the same `eval` extra, the
    # same reason.
    "--ignore=tests/test_eval_scale.py",
    # The address resolver's own suites reach the pinned voice builder
    # (`app/eval_tts.py`, numpy and soundfile at module scope) for the spoken
    # form a house number takes and for the build's seam - the same `eval`
    # extra, the same reason, and `app/address_resolve.py` is outside this
    # floor's source_paths anyway. Their own CI job (the `eval` extra) proves
    # them.
    "--ignore=tests/test_address_resolve.py",
    "--ignore=tests/test_eval_address.py",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "PTH", "T20", "SIM", "RET", "ARG", "PD", "PGH", "PL", "TRY", "NPY", "RSE", "PERF"]
ignore = ["E501", "B008", "PLR0913", "PLR0915", "PLR0912", "PLR2004", "ARG001", "ARG002", "TRY003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ARG005", "PLC0415"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
