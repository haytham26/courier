version: '3.8'

services:
  # PostgreSQL 16 + PostGIS 3.5 + pgvector 0.7.0 + pg_trgm
  postgres:
    security_opt:
      - no-new-privileges:true
    image: postgis/postgis:16-3.5
    container_name: courier-postgres
    environment:
      POSTGRES_USER: courier
      POSTGRES_PASSWORD: courier
      POSTGRES_DB: courier
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U courier -d courier"]
      interval: 5s
      timeout: 5s
      retries: 10
    command: >
      postgres
      -c shared_preload_libraries=pg_stat_statements,pg_trgm,vector
      -c max_connections=200
      -c work_mem=16MB
      -c maintenance_work_mem=256MB

  # Valkey 8.x for caching, rate limiting, session storage (Redis fork, OSI-approved)
  valkey:
    security_opt:
      - no-new-privileges:true
    image: valkey/valkey:8-alpine
    container_name: courier-valkey
    command: valkey-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - valkey_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Valhalla 3.6.x routing engine
  valhalla:
    security_opt:
      - no-new-privileges:true
    image: ghcr.io/valhalla/valhalla:3.6
    container_name: courier-valhalla
    environment:
      - VALHALLA_ADMIN_PORT=8002
      - VALHALLA_TILE_URL=https://valhalla-tiles.example.com/tiles.tar  # Will be replaced with local tiles
    volumes:
      - valhalla_tiles:/custom_files
    ports:
      - "8002:8002"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  # LiveKit Server for WebRTC voice transport
  livekit:
    security_opt:
      - no-new-privileges:true
    image: livekit/livekit-server:latest
    container_name: courier-livekit
    environment:
      - LIVEKIT_KEYS=devkey:devsecret
      - LIVEKIT_API_KEY=devkey
      - LIVEKIT_API_SECRET=devsecret
      - LIVEKIT_TURN_ENABLED=true
      - LIVEKIT_TURN_DOMAIN=turn.example.com
      - LIVEKIT_TURN_TLS_PORT=5349
      - LIVEKIT_TURN_CREDENTIAL=turnsecret
    ports:
      - "7880:7880"  # HTTP
      - "7881:7881"  # HTTPS (if TLS configured)
      - "50000-50100:50000-50100/udp"  # Media ports
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7880/"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MinIO for local S3-compatible storage (R2 fallback)
  minio:
    security_opt:
      - no-new-privileges:true
    image: minio/minio:latest
    container_name: courier-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"   # API
      - "9001:9001"   # Console
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 5

  # GlitchTip for error tracking (self-hosted, MIT licensed)
  glitchtip:
    security_opt:
      - no-new-privileges:true
    image: glitchtip/glitchtip:latest
    container_name: courier-glitchtip
    environment:
      - DATABASE_URL=postgresql://courier:courier@postgres:5432/courier
      - REDIS_URL=redis://valkey:6379
      - SECRET_KEY=dev-secret-key-change-in-production
      - ALLOWED_HOSTS=*
      - DEBUG=true
      - EMAIL_URL=console://
    depends_on:
      - postgres
      - valkey
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/_health/"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Uptime Kuma for uptime monitoring
  uptime-kuma:
    security_opt:
      - no-new-privileges:true
    image: louislam/uptime-kuma:1
    container_name: courier-uptime-kuma
    volumes:
      - uptime_kuma_data:/app/data
    ports:
      - "3001:3001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/api/status"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Langfuse for LLM observability
  langfuse:
    security_opt:
      - no-new-privileges:true
    image: langfuse/langfuse:2
    container_name: courier-langfuse
    environment:
      - DATABASE_URL=postgresql://courier:courier@postgres:5432/courier
      - REDIS_URL=redis://valkey:6379
      - NEXTAUTH_SECRET=dev-secret-change-in-production
      - NEXTAUTH_URL=http://localhost:3002
      - TELEMETRY_ENABLED=false
    depends_on:
      - postgres
      - valkey
    ports:
      - "3002:3000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/public/health"]
      interval: 30s
      timeout: 10s
      retries: 5

volumes:
  postgres_data:
  valkey_data:
  valhalla_tiles:
  minio_data:
  uptime_kuma_data: