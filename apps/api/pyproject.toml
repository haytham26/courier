[build-system]
requires = ["setuptools>=61.0", "uv"]
build-backend = "setuptools.build_meta"

[project]
name = "courier-api"
version = "0.1.0"
description = "Courier Copilot API"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.1",
    "langgraph>=0.2.60",
    "langgraph-checkpoint>=4.3.0",
    "anthropic>=0.40",
    "psycopg[binary]>=3.2",
    "sqlalchemy>=2.0",
    "alembic>=1.12",
    "redis>=5.0",
    "arq>=0.23",
    "litellm>=1.83.0",
    "pipecat-ai>=1.12.0",
    "python-jose[cryptography]>=3.3",
    "passlib[bcrypt]>=1.7.4",
    "python-multipart>=0.0.6",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-repeat>=0.9",
    "pytest-randomly>=3.15",
    "ruff>=0.5",
    "mypy>=1.10",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "PTH", "T20", "SIM", "RET", "ARG", "PD", "PGH", "PL", "TRY", "NPY", "RSE", "FUR", "LOG", "EXE", "ISC", "ICN", "PIE", "TID", "TCH", "PERF", "NPY"]
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true