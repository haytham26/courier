# The production stack of Courier Copilot.
#
# Run it from the repository root with the environment file that holds the
# secrets (never in this file):
#
#   docker compose --env-file infra/prod.env -f infra/compose.prod.yml up -d
#
# What runs:
#   - postgres  the database (PostgreSQL 16 + PostGIS 3.5 + pgvector)
#   - valkey    the cache and the rate-limit store
#   - api_a     the API, replica A
#   - api_b     the API, replica B
#   - auth_a    the auth service (Better Auth), replica A
#   - auth_b    the auth service (Better Auth), replica B
#   - caddy     the edge: TLS, the security headers, the rate limits
#
# Every secret comes from the environment. `infra/env.example` lists every
# variable this file reads, why it is needed and where the value comes from.
#
# The two replicas of each service exist for the zero-downtime swap
# (`infra/zero-downtime.md`): the edge load-balances over them and retries a
# replica that is being replaced, so a release never drops a request. Each
# service keeps the same address across a restart, which is what lets the edge
# keep its cached name resolution.

name: courier-prod

x-service-common: &service-common
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: '10m'
      max-file: '5'
  security_opt:
    - no-new-privileges:true

services:
  postgres:
    image: ${COURIER_POSTGRES_IMAGE:-courier-postgres:16-3.6-pgvector}
    build:
      context: ./postgres
      dockerfile: Dockerfile
    <<: *service-common
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-courier}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-courier}
      PGDATA: /var/lib/postgresql/data/pgdata
    command: >
      postgres
      -c shared_preload_libraries=pg_stat_statements,pg_trgm
      -c max_connections=200
      -c work_mem=16MB
      -c maintenance_work_mem=256MB
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../packages/contracts/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-courier} -d ${POSTGRES_DB:-courier}']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2g
    networks:
      courier:
        ipv4_address: ${COURIER_IPV4_PREFIX:-172.28.0}.10

  valkey:
    image: valkey/valkey:8-alpine
    <<: *service-common
    environment:
      VALKEY_PASSWORD: ${VALKEY_PASSWORD:?VALKEY_PASSWORD is required}
    command: >
      valkey-server
      --appendonly yes
      --requirepass ${VALKEY_PASSWORD}
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    volumes:
      - valkey_data:/data
    healthcheck:
      test: ['CMD-SHELL', 'valkey-cli -a "$$VALKEY_PASSWORD" ping | grep -q PONG']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512m
    networks:
      courier:
        ipv4_address: ${COURIER_IPV4_PREFIX:-172.28.0}.11

  api_a: &api
    image: ${COURIER_API_IMAGE:-courier-api:local}
    build:
      # The API lives in services/api (the compose file once said apps/api, a
      # path that has not existed since the repo's first restructure).
      context: ../services/api
      dockerfile: Dockerfile
    <<: *service-common
    environment:
      APP_ENV: production
      APP_VERSION: ${APP_VERSION:?APP_VERSION is required}
      DATABASE_URL: postgresql://${POSTGRES_USER:-courier}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-courier}
      # The JWKS lives on the auth service. The alias "auth" points at both
      # replicas, so the API keeps verifying tokens while one of them is being
      # replaced (the HTTP client tries the second address when the first one
      # refuses the connection).
      AUTH_JWKS_URL: http://auth:3001/api/auth${AUTH_JWKS_PATH:-/jwks}
      AUTH_JWT_AUDIENCE: ${AUTH_JWT_AUDIENCE:-courier-api}
      # The issuer the API checks on the token. The default is the public URL
      # of the auth service, the same one the auth service signs with.
      AUTH_JWT_ISSUER: ${AUTH_JWT_ISSUER:-https://${COURIER_DOMAIN}}
      VALKEY_URL: redis://:${VALKEY_PASSWORD}@valkey:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'python',
          '-c',
          "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3).status == 200 else 1)",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1g
    networks:
      courier:
        ipv4_address: ${COURIER_IPV4_PREFIX:-172.28.0}.20
        aliases:
          - api

  api_b:
    <<: *api
    networks:
      courier:
        ipv4_address: ${COURIER_IPV4_PREFIX:-172.28.0}.21
        aliases:
          - api

  auth_a: &auth
    image: ${COURIER_AUTH_IMAGE:-courier-auth:local}
    build:
      context: ..
      dockerfile: services/auth/Dockerfile
    <<: *service-common
    environment:
      NODE_ENV: production
      APP_VERSION: ${APP_VERSION:?APP_VERSION is required}
      PORT: '3001'
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET is required}
      BETTER_AUTH_URL: https://${COURIER_DOMAIN:?COURIER_DOMAIN is required}
      AUTH_DATABASE_URL: postgresql://${POSTGRES_USER:-courier}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-courier}
      AUTH_TRUSTED_ORIGINS: ${AUTH_TRUSTED_ORIGINS:?AUTH_TRUSTED_ORIGINS is required}
      # Only the edge can reach this service, and the edge overwrites the
      # header with the real address of the caller. A client cannot forge it.
      AUTH_TRUSTED_IP_HEADERS: x-forwarded-for
      AUTH_JWKS_PATH: ${AUTH_JWKS_PATH:-/jwks}
      AUTH_JWT_ISSUER: ${AUTH_JWT_ISSUER:-https://${COURIER_DOMAIN}}
      AUTH_JWT_AUDIENCE: ${AUTH_JWT_AUDIENCE:-courier-api}
      AUTH_JWT_EXPIRATION: ${AUTH_JWT_EXPIRATION:-15m}
      AUTH_RATE_LIMIT_MAX: ${AUTH_RATE_LIMIT_MAX:-100}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3001/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512m
    networks:
      courier:
        ipv4_address: ${COURIER_IPV4_PREFIX:-172.28.0}.30
        aliases:
          - auth

  auth_b:
    <<: *auth
    networks:
      courier:
        ipv4_address: ${COURIER_IPV4_PREFIX:-172.28.0}.31
        aliases:
          - auth

  caddy:
    image: ${COURIER_CADDY_IMAGE:-courier-caddy:2.10.2}
    build:
      context: ./caddy
      dockerfile: Dockerfile
    <<: *service-common
    environment:
      COURIER_DOMAIN: ${COURIER_DOMAIN:?COURIER_DOMAIN is required}
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL is required}
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      - caddy_logs:/var/log/caddy
    depends_on:
      api_a:
        condition: service_healthy
      api_b:
        condition: service_healthy
      auth_a:
        condition: service_healthy
      auth_b:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:2019/config/']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 256m
    networks:
      courier:
        ipv4_address: ${COURIER_IPV4_PREFIX:-172.28.0}.40

volumes:
  postgres_data:
    name: courier-postgres-data
  valkey_data:
    name: courier-valkey-data
  caddy_data:
    name: courier-caddy-data
  caddy_config:
    name: courier-caddy-config
  caddy_logs:
    name: courier-caddy-logs

networks:
  courier:
    name: ${COURIER_NETWORK:-courier-net}
    ipam:
      driver: default
      config:
        - subnet: ${COURIER_SUBNET:-172.28.0.0/24}
