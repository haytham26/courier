# Dependabot (the 2026-11-05 audit's item 3i, finding C14).
#
# Three ecosystems, all weekly. The rules each kind of PR must follow are
# written HERE, where the next reader of a dependabot PR will see them:
#
#  - github-actions: an action bump PR changes the `uses:` ref - but the ref
#    must STAY a full 40-hex commit SHA (`scripts/ci/check-action-pins.mjs`,
#    BUG-222). Resolve the new tag to its commit sha and pin THAT, with the
#    version in the trailing comment. A tag ref fails the Floor guard.
#  - npm (this is a pnpm workspace; the npm ecosystem reads pnpm-lock.yaml):
#    the PR must carry the updated lockfile AND the licence inventory
#    (`docs/product/LICENSES.md`, regenerated by
#    `node scripts/ci/check-licenses.mjs --write`) in the SAME PR. A dependency
#    change without its licence row is not a complete PR.
#  - uv: the Python side, one entry per service that carries a uv.lock. Same
#    rule: lockfile and licence review in the same PR.
#
# Ecosystem support verified against GitHub's own configuration reference on
# 2026-11-06: `uv` is a supported `package-ecosystem` value, and the `npm`
# ecosystem reads pnpm lockfiles (pnpm v7-v12).
#
# Every entry carries a 7-day cooldown (BUG-228): Semgrep's
# dependabot-missing-cooldown rule (Blocking) fired on this file without one.
# The cooldown only delays the automated PR by a week after a release; the
# pin-exact policy and the audit/licence gates still run on every landed PR,
# and a security patch can still be applied by hand the day it is published.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      days: 7
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      days: 7
  - package-ecosystem: uv
    directory: /services/api
    schedule:
      interval: weekly
    cooldown:
      days: 7
  - package-ecosystem: uv
    directory: /services/courier-voice
    schedule:
      interval: weekly
    cooldown:
      days: 7
