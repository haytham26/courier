name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

# BUG-056: the least privilege the job needs. Every other workflow declares its
# permissions; without this block the repository's default applies, and the
# default is wider than a read.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: lint, typecheck, test
    runs-on: ubuntu-latest
    timeout-minutes: 25

    # The database the DB-backed suite (tests/test_repo_db.py), the restore
    # drill and the Locust SLO profile run against. Pinned version; never a
    # production database - the service container lives and dies with the
    # runner (RUNBOOK section 12-13).
    services:
      postgres:
        # The schema requires PostGIS (packages/contracts/db/schema.sql line
        # 131), so the container is the official PostGIS build of the same
        # PostgreSQL major — pinned, and never a production database.
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_USER: courier
          POSTGRES_PASSWORD: courier
          POSTGRES_DB: courier
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U courier"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 12.14.0

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the design-tokens package
        # The mobile tsconfig resolves @courier/design-tokens/* from dist/,
        # which is not committed, so the shared package has to be built
        # before the lint and the typecheck of the app can see its types.
        run: pnpm --filter @courier/design-tokens build

      - name: Install Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true

      - name: Install the API dependencies
        run: uv sync --directory services/api --extra dev --extra s3test

      - name: Install the voice service dependencies
        run: uv sync --directory services/courier-voice --extra dev

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: The typed API client is fresh (ADR-019)
        # The argument is relative to services/api, because `uv run
        # --directory` makes that the cwd (the same convention the restore
        # drill and the load-test steps below use).
        run: uv run --directory services/api python scripts/generate_api_client.py check

      - name: Test the API against Postgres
        env:
          DATABASE_URL: postgresql://courier:courier@127.0.0.1:5432/courier
        run: uv run --directory services/api pytest -m db -q

      - name: The restore drill (the backup round-trip, RUNBOOK section 13)
        env:
          PGPASSWORD: courier
          DATABASE_URL: postgresql://courier:courier@127.0.0.1:5432/courier
          # The drill imports the app's request builder, whose module reads
          # the auth settings at import time - the placeholders keep the
          # import honest without a gateway (the same pattern tests/conftest
          # uses; the drill never verifies a token).
          AUTH_JWKS_URL: http://127.0.0.1:9/jwks.json
          AUTH_JWT_ISSUER: http://localhost:3001
          # The POD boot check reads this when app.main is imported; the
          # drill is test infrastructure, so the value is a throwaway.
          POD_URL_SIGNING_SECRET: ci-only-pod-signing-secret-0123456789
        run: |
          set -euo pipefail
          # The suite's teardown drops the schema, so the drill seeds it
          # (from the contract's own schema.sql) before taking the backup:
          # the dump must carry tables, not an empty public schema.
          psql -h 127.0.0.1 -U courier -d courier -v ON_ERROR_STOP=1 -f packages/contracts/db/schema.sql
          docker exec ${{ job.services.postgres.id }} pg_dump -U courier --no-owner --no-privileges courier > "$RUNNER_TEMP/drill-backup.sql"
          # BUG-101: the DROP/CREATE pair needs `-v ON_ERROR_STOP=1` on BOTH
          # calls. psql continues after a failed statement by default, so a
          # failed DROP let CREATE run against the very database the DROP was
          # meant to remove - the drill then "restored" into a populated
          # database and reported success, which is the one outcome a restore
          # drill exists to catch. With the flag, a failed DROP stops the step
          # before CREATE is ever reached.
          psql -h 127.0.0.1 -U courier -d postgres -v ON_ERROR_STOP=1 -c "DROP DATABASE IF EXISTS drill;"
          psql -h 127.0.0.1 -U courier -d postgres -v ON_ERROR_STOP=1 -c "CREATE DATABASE drill;"
          uv run --directory services/api python ops/restore_drill.py \
            --dump "$RUNNER_TEMP/drill-backup.sql" \
            --target postgresql://courier:courier@127.0.0.1:5432/drill

      - name: The Locust SLO profile (the short CI gate; the full run is for staging)
        env:
          DATABASE_URL: postgresql://courier:courier@127.0.0.1:5432/courier
          AUTH_JWKS_URL: http://127.0.0.1:8090/jwks.json
          AUTH_JWT_ISSUER: http://127.0.0.1:8090
          POD_URL_SIGNING_SECRET: ci-only-pod-signing-secret-0123456789
          LOADTEST_TOKEN_FILE: ${{ github.workspace }}/.loadtest/token.txt
          LOADTEST_SHIFTS: '60'
          LOADTEST_STOPS_PER_SHIFT: '5'
          LOADTEST_WAIT_MIN: '3'
          LOADTEST_WAIT_MAX: '8'
        run: |
          set -euo pipefail
          # uv run --directory changes the cwd: the JWKS goes to an
          # absolute path so the static server serves the same file the
          # minted token was signed with.
          # The seeded day: the shifts and the stops the users claim (the
          # foreign key is real - a run for an unseeded shift is refused).
          uv run --directory services/api python loadtests/seed_day.py \
            --shifts 60 --stops-per-shift 5
          uv run --directory services/api --extra load python loadtests/mint_token.py \
            --out-dir "$GITHUB_WORKSPACE/.loadtest" --issuer http://127.0.0.1:8090 \
            --subject loadtest-driver
          python -m http.server 8090 --bind 127.0.0.1 --directory "$GITHUB_WORKSPACE/.loadtest" &
          uv run --directory services/api \
            uvicorn app.main:app --host 127.0.0.1 --port 8000 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/healthz > /dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8000/healthz
          uv run --directory services/api --extra load \
            locust -f loadtests/locustfile.py --headless --only-summary \
            --host http://127.0.0.1:8000 -u 50 -r 10 --run-time 60s
          kill %1 %2

      # BUG-094 (C1 audit, squad 6 finding 2, accepted high): a cancelled run
      # does not execute a queued `if: always()` step, so the superseded run of
      # a flaky failure lost its only diagnosis artifact - the very evidence
      # PLAYBOOK section 2 reads first. `cancelled()` runs on the
      # success/cancellation outcomes, so the upload survives the cancellation
      # that `concurrency.cancel-in-progress` performs (GitHub documents that a
      # cancelled job skips `always()` steps; the conditional therefore names
      # the cancellation as well as the normal end).
      - name: Upload the evidence logs
        if: always() || cancelled()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ci-logs
          path: |
            docs/evidence/**/*.log
          if-no-files-found: ignore

  secrets:
    name: no secrets in git
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: 'false'
