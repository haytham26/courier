name: Quality gates

# The V4 §2 gates that are not part of the fast CI job: the floor guard, the
# coverage ratchet, the licence inventory, the dependency audits and the static
# analysis. Every job here blocks the merge.
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: gates-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  floor:
    name: Floor guard (no new suppressions, skips or stubs)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Check the diff against the floor
        run: node scripts/check-floor.mjs ${{ github.event.pull_request.base.sha || 'origin/main' }}
      - name: Check the voice evaluation set
        run: node scripts/check-voice-eval.mjs

  coverage:
    name: Coverage ratchet
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 12.14.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true
      - run: pnpm install --frozen-lockfile
      - run: uv sync --directory apps/api --extra dev
      - name: Coverage
        run: node scripts/run-coverage.mjs
      - name: Upload the coverage report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage
          path: |
            coverage/coverage-summary.json
            apps/api/coverage.json
            packages/*/coverage/
            services/*/coverage/
          if-no-files-found: ignore

  licences:
    name: Licence inventory
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 12.14.0
      - run: pnpm install --frozen-lockfile
      - name: No copyleft in the shipped app
        run: node scripts/check-licenses.mjs

  audits:
    name: Dependency audits
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 12.14.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - run: pnpm install --frozen-lockfile
      - name: JavaScript advisories
        run: node scripts/check-audit.mjs
      - name: Python advisories
        run: |
          # --quiet keeps the resolution summary out of the file: pip-audit
          # refuses a requirements file with a non-requirement first line.
          uv export --directory apps/api --quiet --format requirements-txt --no-hashes --no-emit-project > requirements.txt
          uvx pip-audit -r requirements.txt --strict

  sast:
    name: Static analysis (Semgrep)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - name: Semgrep (community rules)
        run: |
          uvx semgrep scan \
            --config p/default \
            --config p/owasp-top-ten \
            --exclude ".npmrc" \
            --exclude "pnpm-workspace.yaml" \
            --exclude-rule "typescript.react.security.react-insecure-request.react-insecure-request" \
            --exclude-rule "javascript.lang.security.detect-child-process.detect-child-process" \
            --exclude-rule "yaml.docker-compose.security.writable-filesystem-service.writable-filesystem-service" \
    --exclude-rule "package_managers.uv.uv-missing-dependency-cooldown" \
            --error --quiet .
      - name: Why the excluded rules are excluded
        run: |
          echo "The pnpm/npm supply-chain rules expect the pnpm 10 settings; pnpm 12 verifies"
          echo "the lockfile with its own policy and the versions are pinned exactly (W3)."
          echo "The loopback HTTP and child-process findings are the local test server and the"
          echo "test runner (W4). The read-only-filesystem rule would stop the databases (W3)."
