name: Quality gates

# The V4 section 2 gates that are not part of the fast CI job: the floor guard, the
# coverage ratchet, the licence inventory, the dependency audits and the static
# analysis. Every job here blocks the merge.
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: gates-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  floor:
    name: Floor guard (no new suppressions, skips or stubs)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Check the diff against the floor
        run: node scripts/ci/check-floor.mjs ${{ github.event.pull_request.base.sha || 'origin/main' }}
      - name: No merge conflict markers in the tree
        run: node scripts/ci/check-conflict-markers.mjs
      - name: Check the links of the documentation
        run: node scripts/ci/check-doc-links.mjs
      - name: No control characters in the tracked text
        run: node scripts/ci/check-control-chars.mjs
      # BUG-070's mojibake: on 2026-10-28 the founder found three tracked text
      # files whose UTF-8 had been read as Windows-1252 (or an OEM code page)
      # and saved again - 168 corrupted sequences that still read fine. This
      # gate keeps it from coming back, the way the control-character check
      # does for BEL/VT/FF.
      - name: No mojibake in the tracked text (UTF-8 read as Windows-1252)
        run: node scripts/ci/check-mojibake.mjs
      # BUG-052: a workflow that boots the emulator without -gpu
      # swiftshader_indirect makes the headless runner pick its own GL mode and
      # the E2E gate dies at launchApp, which reads like an app bug. The gate's
      # own test runs with the rest of scripts/*/__tests__ (test:store-readiness).
      - name: Every workflow file parses (the keys, and the dispatch inputs) (BUG-067)
        run: node scripts/ci/check-workflows.mjs
      - name: Every emulator boot asks for software rendering
        run: node scripts/ci/check-emulator-gpu.mjs
      # BUG-065: the E2E used to take Maestro from `releases/latest`, the
      # emulator binary and the system image from whatever the runner carried
      # that day, and the AVD cache key ignored all of them plus the emulator
      # options. The same APK was green on api-35 one hour and red on four PRs
      # the next. This gate keeps the pins present, well-shaped and identical
      # across every workflow that boots an emulator. Its own test runs with
      # `node --test scripts/*/__tests__/*.test.mjs`.
      - name: Every emulator boot carries the same pins
        run: node scripts/ci/check-e2e-pins.mjs
      # BUG-122: the API reads AUTH_JWT_ISSUER from its own environment while
      # the auth service signs with `AUTH_JWT_ISSUER ?? BETTER_AUTH_URL`, and
      # nothing compared the two - a deployment where they disagree answers
      # 401 for every correctly issued token with no diagnosis. This gate
      # reads the compose files and refuses a tree where the two sides do not
      # come from one source.
      - name: The API and the auth service agree on the issuer (BUG-122)
        run: node scripts/ci/check-auth-issuer.mjs
      # BUG-096: `apply()` used to write the images it was deploying into
      # .deploy-state, so a failed smoke test's rollback re-deployed the image
      # that failed. The suite drives the real script with a stubbed docker, so
      # it needs no daemon of its own.
      - name: The deploy's state file records what was running (BUG-096)
        run: bash scripts/ci/test-deploy.sh
      - name: Check the voice evaluation set
        run: node scripts/eval/check-voice-eval.mjs
      - name: Check the scanner evaluation set
        run: node scripts/eval/check-scanner-eval.mjs

  coverage:
    name: Coverage ratchet
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 12.14.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true
      - run: pnpm install --frozen-lockfile
      - run: uv sync --directory services/api --extra dev --extra s3test
      - name: Coverage
        run: node scripts/ci/run-coverage.mjs
      - name: Upload the coverage report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage
          path: |
            coverage/coverage-summary.json
            services/api/coverage.json
            packages/*/coverage/
            services/*/coverage/
          if-no-files-found: ignore

  licences:
    name: Licence inventory
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 12.14.0
      - run: pnpm install --frozen-lockfile
      - name: No copyleft in the shipped app
        run: node scripts/ci/check-licenses.mjs

  audits:
    name: Dependency audits
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 12.14.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - run: pnpm install --frozen-lockfile
      - name: JavaScript advisories
        run: node scripts/ci/check-audit.mjs
      - name: Python advisories
        run: |
          # --quiet keeps the resolution summary out of the file: pip-audit
          # refuses a requirements file with a non-requirement first line.
          uv export --directory services/api --quiet --format requirements-txt --no-hashes --no-emit-project > requirements.txt
          uvx pip-audit -r requirements.txt --strict

  sast:
    name: Static analysis (Semgrep)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - name: Semgrep (community rules)
        run: |
          # semgrep is pinned: the registry rules and the parameter checks change
          # with the version, so every version bump is a conscious update.
          uvx semgrep==1.182.1 scan \
            --config p/default \
            --config p/owasp-top-ten \
            --exclude ".npmrc" \
            --exclude "pnpm-workspace.yaml" \
            --exclude-rule "typescript.react.security.react-insecure-request.react-insecure-request" \
            --exclude-rule "javascript.lang.security.detect-child-process.detect-child-process" \
            --exclude-rule "yaml.docker-compose.security.writable-filesystem-service.writable-filesystem-service" \
            --exclude-rule "package_managers.uv.uv-missing-dependency-cooldown.uv-missing-dependency-cooldown" \
            --exclude-rule "javascript.lang.security.audit.detect-non-literal-regexp.detect-non-literal-regexp" \
            --exclude-rule "javascript.audit.detect-replaceall-sanitization.detect-replaceall-sanitization" \
            --exclude-rule "python.lang.security.audit.logging.logger-credential-leak.python-logger-credential-disclosure" \
            --error --quiet .
      - name: Why the excluded rules are excluded
        run: |
          echo "The pnpm/npm supply-chain rules expect the pnpm 10 settings; pnpm 12 verifies"
          echo "the lockfile with its own policy and the versions are pinned exactly (W3)."
          echo "The loopback HTTP and child-process findings are the local test server and the"
          echo "test runner (W4). The read-only-filesystem rule would stop the databases (W3)."
          echo "The uv cooldown, the non-literal regexp of a test, the HTML escaper of the"
          echo "render script and the token counter of the voice service are W3 and W5."
