name: Quality gates

# The V4 section 2 gates that are not part of the fast CI job: the floor guard, the
# coverage ratchet, the licence inventory, the dependency audits and the static
# analysis. Every job here blocks the merge.
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: gates-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  floor:
    name: Floor guard (no new suppressions, skips or stubs)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Check the diff against the floor
        run: node scripts/ci/check-floor.mjs ${{ github.event.pull_request.base.sha || 'origin/main' }}
      # Step 0 (2026-11-02): a PR that turns a `fixed`/`closed` BUGS row back
      # to `open` fails here unless the row says "Reopened with ..." - the
      # stale-write class that reopened BUG-074 twice. fetch-depth: 0 above is
      # what makes the base sha readable through `git show`.
      - name: The registers did not silently reopen (check-parity --base)
        run: node scripts/ci/check-parity.mjs --base ${{ github.event.pull_request.base.sha || 'origin/main' }}
      - name: No merge conflict markers in the tree
        run: node scripts/ci/check-conflict-markers.mjs
      # BUG-232 (audit item 4d, research row 62): no string-built SQL in the
      # API - every statement is a literal text()/execute() with parameters
      # where placeholders exist. Its own test runs with the rest of
      # scripts/*/__tests__ (test:store-readiness).
      - name: No string-built SQL in services/api (BUG-232)
        run: node scripts/ci/check-sql-parameterisation.mjs
      # BUG-198 (audit item 5, the trial-server proof): a human dispatch of
      # android-e2e.yml must run the emulator legs AND the A1 proof - the
      # human branch echoes e2e=true/a1=true and the jobs gate on them.
      - name: A human dispatch of android-e2e runs the whole set incl. A1 (BUG-198)
        run: node scripts/ci/check-e2e-dispatch.mjs
      - name: Check the links of the documentation
        run: node scripts/ci/check-doc-links.mjs
      - name: No control characters in the tracked text
        run: node scripts/ci/check-control-chars.mjs
      # BUG-070's mojibake: on 2026-10-28 the founder found three tracked text
      # files whose UTF-8 had been read as Windows-1252 (or an OEM code page)
      # and saved again - 168 corrupted sequences that still read fine. This
      # gate keeps it from coming back, the way the control-character check
      # does for BEL/VT/FF.
      - name: No mojibake in the tracked text (UTF-8 read as Windows-1252)
        run: node scripts/ci/check-mojibake.mjs
      # BUG-052: a workflow that boots the emulator without -gpu
      # swiftshader_indirect makes the headless runner pick its own GL mode and
      # the E2E gate dies at launchApp, which reads like an app bug. The gate's
      # own test runs with the rest of scripts/*/__tests__ (test:store-readiness).
      - name: Every workflow file parses (the keys, and the dispatch inputs) (BUG-067)
        run: node scripts/ci/check-workflows.mjs
      - name: Every emulator boot asks for software rendering
        run: node scripts/ci/check-emulator-gpu.mjs
      # BUG-107: the environment gate was referenced by no workflow, so it
      # protected nothing, and it read .env.local from the caller's cwd. It
      # runs here now (from the repository root, with the required variables
      # provided as CI values, since a checkout carries no .env.local) and the
      # root-based path is pinned by its own test. A developer's run still
      # clears their own .env.local from any directory in the tree.
      - name: The environment contract the gate checks (BUG-107)
        env:
          DATABASE_URL: postgresql://courier:courier@127.0.0.1:5432/courier
          REDIS_URL: redis://127.0.0.1:6379
          VALHALLA_URL: http://127.0.0.1:8002
          APP_ENV: ci
          NODE_ENV: test
        run: node scripts/ci/check-secrets.js
      # BUG-065: the E2E used to take Maestro from `releases/latest`, the
      # emulator binary and the system image from whatever the runner carried
      # that day, and the AVD cache key ignored all of them plus the emulator
      # options. The same APK was green on api-35 one hour and red on four PRs
      # the next. This gate keeps the pins present, well-shaped and identical
      # across every workflow that boots an emulator. Its own test runs with
      # `node --test scripts/*/__tests__/*.test.mjs`.
      - name: Every emulator boot carries the same pins
        run: node scripts/ci/check-e2e-pins.mjs
      # The 2026-11-05 audit's item 3a: `rsync infra/ services/ packages/`
      # (trailing slashes) copied the CONTENTS of each flat into /opt/courier
      # and --delete removed what was there, so the deploy's own next command -
      # `cd /opt/courier/infra` - failed on a directory that never arrived. The
      # gate asserts the command's shape everywhere and runs both shapes against
      # a scratch directory where rsync exists (here, on the runner).
      - name: The deploy's rsync keeps the tree (audit 3a)
        run: node scripts/ci/check-deploy-rsync.mjs
      # The 2026-11-05 audit's item 3b: the deploy step has always carried
      # APP_VERSION, but the remote smoke.sh invocation never forwarded it, so
      # smoke.sh took its "APP_VERSION is not set: skipping the version check"
      # branch and reported a green smoke test about a deployment it never
      # identified. The gate holds all three halves: the version is forwarded,
      # smoke.sh dies without it (--no-version is the only skip), and the
      # version fetch cannot fail quietly.
      - name: The deployed version reaches the smoke test (audit 3b)
        run: node scripts/ci/check-smoke-version.mjs
      # The 2026-11-05 audit's item 3c: the deploy used to interpolate
      # COURIER_STAGING_DOMAIN and COURIER_SMOKE_TOKEN straight into the remote
      # ssh command, which puts a secret in an argv - readable in the host's own
      # process list, and one quoting mistake from a log. The gate holds the
      # line: no secret in a command line, the two secrets in the step's env and
      # piped over stdin, read by the remote shell into variables.
      - name: The deploy's secrets never reach a command line (audit 3c)
        run: node scripts/ci/check-deploy-secrets-inline.mjs
      # The 2026-11-05 audit's item 3d: the deploy job used to run on the push
      # to main, in parallel with the repository's own CI and Quality gates, so
      # the staging host could be served a tree CI was about to call red. The
      # gate holds the workflow_run shape: both required workflows named, the
      # completed event, the deploy's `if:` off the push trigger, the checkout
      # pinned to the sha the gates ran on, and the gate step that reads both
      # conclusions from the API rather than assuming them.
      - name: The deploy waits for CI and Quality gates (audit 3d)
        run: node scripts/ci/check-deploy-gate.mjs
      # BUG-226: every --exclude-rule of the Semgrep scan must be written down -
      # a rule id in .semgrepignore with a numbered reason, and a W-row in the
      # exceptions table of docs/plan/CONSTRAINTS.md. An accepted finding with no
      # written reason is a suppression by another name (the floor's
      # no-suppressions check only sees inline Semgrep suppression comments).
      - name: Every Semgrep exclusion is written down (BUG-226)
        run: node scripts/ci/check-semgrep-exclusions.mjs
      # The 2026-11-05 audit's item 3e: the android-e2e AVD cache carried a
      # `restore-keys` prefix that stops short of the pins' fingerprint, so a
      # fingerprint miss restored an AVD built under a different Maestro version,
      # emulator build, system-image revision or option set - BUG-068's
      # tiny-device-profile failure, re-armed. Only an EXACT key restores now,
      # and the health workflow (which has none) is held to the same line.
      - name: Only an exact AVD cache key restores (audit 3e)
        run: node scripts/ci/check-e2e-avd-restore-keys.mjs
      # The 2026-11-05 audit's item 3f: the emulator-runner action installs the
      # system image from the stable channel by api-level, so the emulator's
      # BYTES change whenever Google publishes a revision and nothing commits it
      # - BUG-065's class (the same APK green on api-35 one hour and red on four
      # PRs the next). The gate holds the pin: SYSIMG_REV_<api> for every
      # matrix leg, the pins fingerprint reading it, the install pre-step's
      # three attempts with the wipe between them and its Pkg.Revision
      # assertion, the revision-keyed cache, and the record step failing if the
      # action moved the image under the pin.
      - name: The system image is pinned by revision (audit 3f)
        run: node scripts/ci/check-e2e-sysimg-pin.mjs
      # The 2026-11-05 audit's item 3g: the emulator workflow's pull_request
      # trigger carried a `paths:` filter, which keeps the whole workflow from
      # EXISTING for a documentation-only change - so its check names are never
      # reported, and a required check that is not reported blocks every PR
      # forever. The filter moved to a `changes` job (a plain
      # `git diff --name-only` step: no new action, nothing to SHA-pin, nothing
      # for the licence inventory) with `if:` on build/e2e/a1, so the jobs
      # report `skipped` instead of not existing.
      - name: The emulator jobs report skipped, not missing (audit 3g)
        run: node scripts/ci/check-e2e-trigger-conditions.mjs
      # The 2026-11-05 audit's item 3h: PLAYBOOK 17.1 says a re-run is not a
      # diagnosis, and the recurring case here is the harness (the same APK
      # green on api-35 and red on api-34 with the code byte-identical,
      # BUG-065). One re-run is the budget: the e2e and a1 jobs fail when
      # github.run_attempt > 2, and the second attempt writes the
      # justification request into the job summary. The gate holds the budget
      # as the FIRST step of each job, so a third attempt fails before it
      # boots an emulator.
      - name: The emulator jobs have a retry budget of one (audit 3h)
        run: node scripts/ci/check-e2e-retry-budget.mjs
      # The 2026-11-05 audit's item 3i, finding C12: setup-uv was referenced by
      # TWO different commit SHAs in the same tree (v5 in ci/codeql/quality-gates,
      # v10.3.3 in linz-changeset/mutation), so the same tool ran as two versions
      # depending on which workflow built you. The gate holds the check-e2e-pins
      # rule for it: every reference is a full 40-hex SHA and all of them AGREE.
      - name: setup-uv is pinned to one sha everywhere (audit 3i / C12)
        run: node scripts/ci/check-setup-uv-pin.mjs
      # The 2026-11-05 audit's item 3i, finding C11: the workflows declared
      # node-version in thirteen places and package.json's engines floor could
      # drift from them one edit at a time. Everything now says Node 24 (the
      # current LTS), and the gate holds one major declared everywhere plus an
      # engines floor that matches it - a bump is one PR that moves the
      # constant, every line and the floor together.
      - name: Node is one pinned major everywhere (audit 3i / C11)
        run: node scripts/ci/check-node-pin.mjs
      # The 2026-11-05 audit's item 3i, finding C10: every `uses:` ref must be
      # pinned to a full 40-hex commit sha. The tree already is (116 refs), but
      # nothing asserted it, so the next action added with a tag would have been
      # green - and a tag can be re-pointed to run new code with no commit in
      # this repository. Local ./ actions pass (reviewed with the code);
      # docker:// images need a @sha256: digest.
      - name: Every action is pinned by commit sha (audit 3i / C10)
        run: node scripts/ci/check-action-pins.mjs
      # The 2026-11-05 audit's item 3i, finding C14: dependabot watches the
      # three ecosystems this repo has (github-actions and npm at /, uv for
      # each service with a uv.lock) weekly, and a cron workflow smokes the
      # staging deployment nightly with the same infra/smoke.sh the deploy leg
      # runs. Secrets stay in step env only; without them the run skips with
      # a notice, not silently.
      - name: Dependabot is configured and the cron staging smoke exists (audit 3i / C14)
        run: node scripts/ci/check-staging-smoke.mjs
      # BUG-122: the API reads AUTH_JWT_ISSUER from its own environment while
      # the auth service signs with `AUTH_JWT_ISSUER ?? BETTER_AUTH_URL`, and
      # nothing compared the two - a deployment where they disagree answers
      # 401 for every correctly issued token with no diagnosis. This gate
      # reads the compose files and refuses a tree where the two sides do not
      # come from one source.
      - name: The API and the auth service agree on the issuer (BUG-122)
        run: node scripts/ci/check-auth-issuer.mjs
      # BUG-096: `apply()` used to write the images it was deploying into
      # .deploy-state, so a failed smoke test's rollback re-deployed the image
      # that failed. The suite drives the real script with a stubbed docker, so
      # it needs no daemon of its own.
      - name: The deploy's state file records what was running (BUG-096)
        run: bash scripts/ci/test-deploy.sh
      - name: Check the voice evaluation set
        run: node scripts/eval/check-voice-eval.mjs
      - name: Check the scanner evaluation set
        run: node scripts/eval/check-scanner-eval.mjs
      # BUG-280: the routing evaluation set (the founder's 2026-11-08 directive,
      # item 3) - the 144 seeded synthetic Christchurch days over the Valhalla-on-
      # OpenStreetMap road matrix, the engines' measured days re-derived from the
      # matrix, and the directive's targets (2% on average, 5% at worst, 0
      # violations where a feasible plan exists, solve p95 under 3s at 150
      # stops). Zero-dependency node, like the other eval checkers: it reads the
      # committed set, so the CI runner needs no docker, no tiles and no LINZ key.
      - name: Check the routing evaluation set
        run: node scripts/eval/check-routing-eval.mjs

  routing-eval-timing:
    name: The routing eval's solve time on THIS runner (BUG-280)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      # The production engine's own solve time on the CI runner is the number
      # the directive's p95 <3s bar is about, so it is measured HERE, not on a
      # workstation: only our engine runs (the baselines are a local,
      # long-budget measurement and their results are committed), only the
      # 150-stop instances (the size the bar names), into a throwaway directory
      # so the committed result files are never overwritten.
      - name: The production engine on every 150-stop day (our engine only)
        run: |
          uv sync --directory services/api --extra eval
          uv run --project services/api --extra eval \
            python scripts/eval/run-routing-eval.py --engines ours --only 150 \
            --results-dir "$RUNNER_TEMP/routing-eval" --check-targets
      # The node checker runs in the floor job without any toolchain: it re-reads
      # the committed set and the committed results and re-derives every number.

  coverage:
    name: Coverage ratchet
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 12.14.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - run: pnpm install --frozen-lockfile
      - run: uv sync --directory services/api --extra dev --extra s3test
      - name: Coverage
        run: node scripts/ci/run-coverage.mjs
      - name: Upload the coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: |
            coverage/coverage-summary.json
            services/api/coverage.json
            packages/*/coverage/
            services/*/coverage/
          if-no-files-found: ignore

  licences:
    name: Licence inventory
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 12.14.0
      - run: pnpm install --frozen-lockfile
      - name: No copyleft in the shipped app
        run: node scripts/ci/check-licenses.mjs

  audits:
    name: Dependency audits
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 12.14.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: pnpm install --frozen-lockfile
      - name: JavaScript advisories
        run: node scripts/ci/check-audit.mjs
      - name: Python advisories
        run: |
          # --quiet keeps the resolution summary out of the file: pip-audit
          # refuses a requirements file with a non-requirement first line.
          uv export --directory services/api --quiet --format requirements-txt --no-hashes --no-emit-project > requirements.txt
          uvx pip-audit -r requirements.txt --strict

  sast:
    name: Static analysis (Semgrep + Bandit)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Semgrep (community rules)
        run: |
          # semgrep is pinned: the registry rules and the parameter checks change
          # with the version, so every version bump is a conscious update.
          uvx semgrep==1.182.1 scan \
            --config p/default \
            --config p/owasp-top-ten \
            --exclude ".npmrc" \
            --exclude "pnpm-workspace.yaml" \
            --exclude-rule "typescript.react.security.react-insecure-request.react-insecure-request" \
            --exclude-rule "javascript.lang.security.detect-child-process.detect-child-process" \
            --exclude-rule "yaml.docker-compose.security.writable-filesystem-service.writable-filesystem-service" \
            --exclude-rule "package_managers.uv.uv-missing-dependency-cooldown.uv-missing-dependency-cooldown" \
            --exclude-rule "javascript.lang.security.audit.detect-non-literal-regexp.detect-non-literal-regexp" \
            --exclude-rule "javascript.audit.detect-replaceall-sanitization.detect-replaceall-sanitization" \
            --exclude-rule "python.lang.security.audit.logging.logger-credential-leak.python-logger-credential-disclosure" \
            --exclude-rule "yaml.github-actions.security.workflow-run-target-code-checkout.workflow-run-target-code-checkout" \
            --error --quiet .
      - name: Bandit (Python SAST, pinned) - BUG-234
        run: |
          # Research A4: bandit complements Semgrep's Python rules - it catches
          # the shell=True / pickle / exec classes Semgrep can miss. Pinned
          # like semgrep. Medium+ severity AND medium+ confidence fail the
          # build (the bar is zero high/critical). The three LOW findings the
          # tree carries on 2026-11-07 are accepted, all false positives:
          # two B105s on message strings (auth/websocket.py's "the token is
          # not valid", nz_address.py's `== "and"`), and B405 on
          # `from xml.etree.ElementTree import ParseError` in import_stops.py -
          # that import only CATCHES openpyxl's parse errors; our code never
          # parses upload XML with stdlib ET (the upload is magic-checked and
          # zip-index-capped before openpyxl sees it, BUG-211).
          uvx bandit==1.9.4 -r services/api/app -ll -ii --quiet
      - name: Why the excluded rules are excluded
        run: |
          echo "The pnpm/npm supply-chain rules expect the pnpm 10 settings; pnpm 12 verifies"
          echo "the lockfile with its own policy and the versions are pinned exactly (W3)."
          echo "The loopback HTTP and child-process findings are the local test server and the"
          echo "test runner (W4). The read-only-filesystem rule would stop the databases (W3)."
          echo "The uv cooldown, the non-literal regexp of a test, the HTML escaper of the"
          echo "render script and the token counter of the voice service are W3 and W5."
          echo "The workflow_run checkout rule is a static heuristic; our deploy checks out"
          echo "the sha the gates ran on, after BOTH required workflows said success on it (W6)."

  # BUG-245 (audit item 7, B4's "then gate it in CI"): the mutation floor as a
  # PR-time gate. The nightly lane (mutation.yml) proves the floor on a
  # schedule; here the floor BLOCKS THE MERGE, but only for a change that can
  # move it - the same What-changed pattern android-e2e.yml's `changes` job
  # uses (audit item 3g): a job-level `if:` reports `skipped`, never absent,
  # so a required check is always reported and a docs-only PR never spends
  # the minutes.
  #
  # `mutation-scopes` diffs the base against HEAD and reads each service's
  # `[tool.mutmut] source_paths` from its pyproject
  # (scripts/ci/changed-mutation-scopes.mjs): a change under a service's
  # source, tests/, pyproject.toml or uv.lock - or to the mutation pipeline
  # itself - runs that service's floor. mutmut 3.8.1's `run` takes only
  # mutant names and reads its config from the cwd pyproject, so the job runs
  # the service's FULL configured scope (a superset of the changed files,
  # identical to what the nightly lane measures), and `run` mode enforces the
  # 70 % floor itself (check-mutation-floor.mjs main -> checkStats, exit 1
  # below the floor).
  mutation-scopes:
    name: Mutation scopes (what changed)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      api: ${{ steps.scopes.outputs.api }}
      voice: ${{ steps.scopes.outputs.voice }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # The base sha is a commit that only exists in the repository, so
          # the whole history is fetched; a shallow clone answers "unknown
          # revision" and the diff then reads as "nothing changed", which is
          # the failure this gate exists to prevent.
          fetch-depth: 0

      - name: Which mutation scopes this change touches
        id: scopes
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
        run: node scripts/ci/changed-mutation-scopes.mjs

  mutation-api:
    name: The API's mutation floor (PR gate, BUG-245)
    needs: mutation-scopes
    if: needs.mutation-scopes.outputs.api == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # The same pinned PostGIS service as ci.yml's db step and mutation.yml's
    # API job, with DATABASE_URL set (BUG-243: without it the db-marked suite
    # stays `no_tests` and the floor is measured over the wrong suite). The
    # schema needs PostGIS; never a production database - the container lives
    # and dies with the runner.
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_USER: courier
          POSTGRES_PASSWORD: courier
          POSTGRES_DB: courier
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U courier"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://courier:courier@127.0.0.1:5432/courier
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Python and the API's dependencies
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: services/api/uv.lock

      - name: Run the floor
        run: node scripts/ci/check-mutation-floor.mjs run services/api

      - name: Keep the stats
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutation-api-pr-stats
          path: |
            services/api/mutants/mutmut-cicd-stats.json
            services/api/mutants/mutmut-results.txt
            services/api/mutants/mutmut-survivors.txt
          retention-days: 90
          if-no-files-found: warn

  mutation-voice:
