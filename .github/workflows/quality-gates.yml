name: Quality gates

# The V4 §2 gates that are not part of the fast CI job: the floor guard, the
# coverage ratchet, the licence inventory, the dependency audits and the static
# analysis. Every job here blocks the merge.
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: gates-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  floor:
    name: Floor guard (no new suppressions, skips or stubs)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check the diff against the floor
        run: node scripts/check-floor.mjs ${{ github.event.pull_request.base.sha || 'origin/main' }}

  coverage:
    name: Coverage ratchet
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.14.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: pnpm install --frozen-lockfile
      - run: uv sync --directory apps/api --extra dev
      - name: Coverage
        run: node scripts/run-coverage.mjs
      - name: Upload the coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            coverage/coverage-summary.json
            apps/api/coverage.json
            packages/*/coverage/
            services/*/coverage/
          if-no-files-found: ignore

  licences:
    name: Licence inventory
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 12.14.0
      - run: pnpm install --frozen-lockfile
      - name: No copyleft in the shipped app
        run: node scripts/check-licenses.mjs

  audits:
    name: Dependency audits
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.14.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v5
      - run: pnpm install --frozen-lockfile
      - name: JavaScript advisories
        run: pnpm audit --audit-level high
      - name: Python advisories
        run: |
          uv export --directory apps/api --format requirements-txt --no-hashes --no-emit-project > requirements.txt
          uvx pip-audit -r requirements.txt --strict || pip-audit -r requirements.txt

  sast:
    name: Static analysis (Semgrep)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v5
      - name: Semgrep (community rules)
        run: |
          uvx semgrep scan --config p/default --config p/owasp-top-ten --error --quiet .
