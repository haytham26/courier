name: Design videos

# The videos of the ten directions of the second round of the Design Studio
# (MASTER_EXECUTION §13.6, `docs/design/PLAN.md` day 6).
#
# The job builds the debug APK, opens the lab route on the emulator, records
# the screen with `adb shell screenrecord` and uploads the mp4 of every
# direction. The Maestro flow of each direction is in `.maestro/directions/`.

on:
  workflow_dispatch:
  push:
    branches: ['**']
    paths:
      - 'apps/mobile/**'
      - '.maestro/directions/**'
      - 'packages/design-tokens/**'
      - '.github/workflows/design-videos.yml'

concurrency:
  group: design-videos-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  videos:
    name: Record the ten directions
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PKG: com.courier.copilot
      # The Maestro CLI is pinned: the newest CLI ships its own driver APKs.
      MAESTRO_VERSION: cli-2.11.0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 12.14.0

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Set up Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install the dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the design tokens
        # The app imports `@courier/design-tokens/themes` and
        # `@courier/design-tokens/tokens`; Metro resolves them from the built
        # `dist`, so the package has to be built before the bundle.
        run: pnpm --filter @courier/design-tokens build

      - name: Build the debug APK
        # The design lab is a diagnostic, not the product: it is in the dev and
        # the E2E build only (MASTER_EXECUTION section 16.1.7). This job opens
        # the lab routes, so the build carries them.
        env:
          EXPO_PUBLIC_DESIGN_LAB: '1'
        run: |
          pnpm --filter mobile exec expo prebuild --platform android --no-install
          # The debug build has to carry its own JavaScript bundle: CI has no
          # Metro and no local emulator is allowed (MASTER_EXECUTION section 16.1).
          # The React Native Gradle plugin embeds the bundle in every variant
          # that is not listed in `debuggableVariants`.
          GRADLE="apps/mobile/android/app/build.gradle"
          sed -i -E 's/^(\s*)debuggableVariants\s*=\s*\[[^]]*\]/\1debuggableVariants = []/' "$GRADLE"
          grep -q 'debuggableVariants = \[\]' "$GRADLE" || {
            echo "::error::the debug build would load its bundle from Metro, and there is no Metro in CI"
            exit 1
          }
          cd apps/mobile/android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Start the emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: Nexus 6
          # The animations stay on: the video is the evidence of the motion.
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim

      - name: Install the Maestro CLI
        run: |
          # The installer is downloaded, printed and executed: it is never
          # piped into a shell (the V4 §7 rule).
          curl -Ls "https://get.maestro.mobile.dev" -o "$RUNNER_TEMP/maestro-install.sh"
          cat "$RUNNER_TEMP/maestro-install.sh"
          bash "$RUNNER_TEMP/maestro-install.sh" "$MAESTRO_VERSION"
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Install the APK on the emulator
        run: |
          adb wait-for-device
          adb install -r apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk
          # The permissions are granted up front: the system dialog would sit
          # on top of the screen the flow has to read.
          adb shell pm grant "$PKG" android.permission.RECORD_AUDIO || true
          adb shell pm grant "$PKG" android.permission.ACCESS_FINE_LOCATION || true
          adb shell pm grant "$PKG" android.permission.ACCESS_COARSE_LOCATION || true
          adb shell input keyevent KEYCODE_WAKEUP || true
          adb shell wm dismiss-keyguard || true

      - name: Record the ten directions
        run: |
          mkdir -p artifacts
          status=0
          for flow in .maestro/directions/*.yaml; do
            name="$(basename "$flow" .yaml)"
            echo "::group::$name"
            # The recording runs on the device while the flow walks the four
            # screens of the direction and presses the confirmation.
            adb shell screenrecord --time-limit 90 --bit-rate 8000000 "/sdcard/$name.mp4" &
            record_pid=$!
            sleep 3
            if maestro test "$flow"; then
              echo "the flow passed: $flow"
            else
              echo "::error::the flow failed: $flow"
              status=1
            fi
            # screenrecord finalises the file when it is interrupted.
            adb shell pkill -INT screenrecord || true
            wait "$record_pid" || true
            sleep 1
            adb pull "/sdcard/$name.mp4" "artifacts/$name.mp4" || true
            adb shell rm -f "/sdcard/$name.mp4" || true
            # The frame trace of the direction, for REVIEW-E7. The file is
            # named after the number of the direction: `fps-01.txt`.
            adb shell dumpsys gfxinfo "$PKG" framestats > "artifacts/fps-${name%%-*}.txt" || true
            echo "::endgroup::"
          done
          ls -la artifacts
          exit "$status"

      - name: Upload the videos
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: design-videos
          path: |
            artifacts/*.mp4
            artifacts/fps-*.txt
          if-no-files-found: warn
