# The B4 mutation floor (docs/plan/AUDIT_2026-10-25.md §B4, PLAYBOOK §14.5).
#
# mutmut mutates the source and runs the suites against each mutant: a survivor
# is a test the suite does not have. The audit's done-when is "mutmut runs
# scoped in CI at the 70 % floor" over `services/api` (sync, runs, auth) and
# `services/courier-voice` (the turn machine).
#
# A mutation run is minutes, not seconds, so it is a nightly lane and a manual
# dispatch - never a PR's blocker. The scope is the config each service carries
# (`[tool.mutmut] source_paths`), so the lane mutates exactly the modules the
# audit names and nothing else. The floor itself is enforced by
# `scripts/ci/check-mutation-floor.mjs`, which runs mutmut, exports its own
# stats, and fails the job below 70 % - the score arithmetic is mutmut's, read
# from its installed source.
#
# The PR-time variant lives in quality-gates.yml (BUG-245): a `mutation-scopes`
# What-changed job plus per-service floor jobs that run
# `check-mutation-floor.mjs run <service>` whenever the PR touches that
# service's `[tool.mutmut] source_paths`, tests, pyproject or lockfile - so the
# floor blocks the merge, not only the night. This workflow stays the nightly
# measurement and the manual dispatch; both run the identical `run` mode, so
# the PR gate and the night measure the same scope with the same floor.
#
# The `run` mode also exports the PER-MUTANT survivor list
# (`mutants/mutmut-results.txt`, from `mutmut results`): the stats JSON carries
# only counts, and the survivors have to be named before tests can be written
# to kill them (BUG-241). Both files are uploaded.

name: Mutation floor

on:
  schedule:
    # 03:40 UTC: after the nightly Android E2E is done and before the working
    # day in Christchurch (UTC+13) starts.
    - cron: '40 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mutation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  api:
    name: The API's mutation floor (sync, runs, auth)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # BUG-243: the same PostGIS service ci.yml's db step runs against, with
    # DATABASE_URL set - so the lane measures the WHOLE suite, the db-marked
    # tests included (the pyproject's mutmut args override the ini
    # `-m 'not db'`). Without it, every SqlAlchemyRepo line reachable only
    # through the db suite stayed `no_tests` (941 of 2656 on run 42350269397)
    # and the 70 % floor was unreachable at this scope. The schema needs
    # PostGIS (packages/contracts/db/schema.sql), same pinned image as ci.yml;
    # never a production database - the container lives and dies with the
    # runner.
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_USER: courier
          POSTGRES_PASSWORD: courier
          POSTGRES_DB: courier
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U courier"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://courier:courier@127.0.0.1:5432/courier
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Python and the API's dependencies
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: services/api/uv.lock

      - name: Run the floor
        run: node scripts/ci/check-mutation-floor.mjs run services/api

      - name: Keep the stats
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mutation-api-stats
          path: |
            services/api/mutants/mutmut-cicd-stats.json
            services/api/mutants/mutmut-results.txt
            services/api/mutants/mutmut-survivors.txt
          retention-days: 90
          if-no-files-found: warn

  voice:
    name: The voice service's mutation floor (the turn machine)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Python and the voice service's dependencies
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: services/courier-voice/uv.lock

      - name: Run the floor
        run: node scripts/ci/check-mutation-floor.mjs run services/courier-voice

      - name: Keep the stats
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mutation-voice-stats
          path: |
            services/courier-voice/mutants/mutmut-cicd-stats.json
            services/courier-voice/mutants/mutmut-results.txt
            services/courier-voice/mutants/mutmut-survivors.txt
          retention-days: 90
          if-no-files-found: warn
