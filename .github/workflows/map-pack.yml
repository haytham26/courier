name: Map pack (the Canterbury offline pack, D26)

# The data pipeline of MASTER_EXECUTION P3 and D26: build the pack the app
# ships, twice a week, and keep the evidence.
#
# Nothing here gates a pull request. It is a long build with a big download,
# and it writes an artifact the app bakes into a release — running it on every
# PR would burn the runner and say nothing about the PR. The pipeline runs:
#
#   - on the schedule below (twice a week, D26),
#   - on dispatch (the founder builds by hand),
#   - when the scripts or the workflow file change on main, so a change to the
#     pipeline itself is exercised (the only trigger that can break main's CI).
#
# BUG-064: the `push` filter proved not enough on its own - a feature-branch push
# started a run (40226600536) against a trigger that says `branches: [main]`.
# The guard below states the intent where it cannot be read as an edge case: this
# build runs for a push to `main` only, never for a PR's head branch.
#
# BUG-067: the runs the guard produced still failed, in 0 seconds, on every push
# since the workflow existed - and the guard was blamed for it. The cause was
# `inputs` in the dispatch steps: that context is only defined for a dispatch or
# a call, so a push (or the schedule) failed at the workflow level, before any
# job was created. The guard was never reached. The inputs now read through
# `github.event.inputs`, which exists for every event, so this comment records
# both: the trigger's guard and the context's form.
#
# The licence gates live in the scripts: `build-pmtiles.mjs` refuses a source
# whose terms forbid the offline use, whatever the workflow asks for.

on:
  schedule:
    # D26: twice a week (00:30 UTC Sunday and Wednesday).
    - cron: '30 0 * * 0,3'
  workflow_dispatch:
    inputs:
      extract_url:
        description: 'The .osm.pbf to build from (blank = the Geofabrik NZ extract)'
        required: false
        type: string
      source_id:
        description: 'A registered source id (blank = geofabrik-nz)'
        required: false
        type: string
  push:
    branches: [main]
    paths:
      - 'scripts/data/build-pmtiles.mjs'
      - 'scripts/data/build-3d-buildings.mjs'
      - '.github/workflows/map-pack.yml'

permissions:
  contents: read

jobs:
  build:
    # A push builds the pack on main; the schedule and the founder's dispatch
    # build it anywhere. A feature branch's push never does (BUG-064). The
    # workflow itself now starts on every event it names (BUG-067): a guard that
    # skips a job is visible as a skip, and a workflow that cannot start is not.
    if: github.event_name != 'push' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: The pinned tools
        env:
          # The exact releases the pipeline runs, and the digest planetiler
          # publishes beside its jar. Bumping a tool is a code change here.
          PLANETILER_VERSION: v0.10.2
          PLANETILER_JAR_SHA256: f310bd0413e2e4512b27f4046d418664e8e1d3bf31603c2a70e23de06c167e4d
          PMTILES_VERSION: v1.31.2
        run: |
          set -euo pipefail
          mkdir -p .tools

          curl -fsSL -o .tools/planetiler.jar \
            "https://github.com/onthegomap/planetiler/releases/download/$PLANETILER_VERSION/planetiler.jar"
          curl -fsSL -o .tools/planetiler.jar.sha256 \
            "https://github.com/onthegomap/planetiler/releases/download/$PLANETILER_VERSION/planetiler.jar.sha256"
          # The published digest is uppercase hex; sha256sum wants lowercase.
          tr 'A-F' 'a-f' < .tools/planetiler.jar.sha256 > .tools/planetiler.jar.sha256.lower
          (cd .tools && sha256sum -c planetiler.jar.sha256.lower)

          curl -fsSL -o .tools/pmtiles.tar.gz \
            "https://github.com/protomaps/go-pmtiles/releases/download/$PMTILES_VERSION/go-pmtiles_${PMTILES_VERSION#v}_Linux_x86_64.tar.gz"
          tar -xzf .tools/pmtiles.tar.gz -C .tools pmtiles
          chmod +x .tools/pmtiles

          # The scripts call `planetiler` by name. The shim resolves its jar
          # beside itself, so a later step's working directory cannot break it.
          printf '#!/usr/bin/env bash\nhere="$(cd "$(dirname "$0")" && pwd)"\nexec java -Xmx${MAP_PACK_HEAP_GB:-4}g -jar "$here/planetiler.jar" "$@"\n' \
            > .tools/planetiler
          chmod +x .tools/planetiler
          echo "$PWD/.tools" >> "$GITHUB_PATH"

          .tools/planetiler --version | tee .tools/planetiler.version
          .tools/pmtiles version | tee .tools/pmtiles.version

      - name: The extract
        env:
          # BUG-067: `inputs` alone is only valid for a `workflow_dispatch` /
          # `workflow_call` event. On a push (and on the schedule) GitHub refuses
          # the whole workflow before a single job is created - which is why
          # every run of this workflow since PR #43 failed in 0s. The `github`
          # context exists for every event, so this form answers the same
          # question everywhere: the dispatch's input, or nothing.
          EXTRACT_URL: ${{ github.event.inputs.extract_url || '' }}
        run: |
          set -euo pipefail
          mkdir -p data/maps
          url="$EXTRACT_URL"
          if [ -z "$url" ]; then
            # Geofabrik's New Zealand extract (ODbL; an OSM extract carries the
            # data, so the OSMF tile servers and their policy are not involved).
            url="https://download.geofabrik.de/australia-oceania/new-zealand-latest.osm.pbf"
          fi
          echo "extract: $url"
          curl -fsSL -o data/maps/newzealand-latest.osm.pbf "$url"
          ls -lh data/maps/newzealand-latest.osm.pbf

      - name: The plan (and the licence gates)
        env:
          # BUG-067: the `github` context, not the bare `inputs` (see the
          # extract step above).
          SOURCE_ID: ${{ github.event.inputs.source_id || '' }}
        run: |
          set -euo pipefail
          # A dispatch that names a source uses it; otherwise the registered
          # Geofabrik NZ extract, whose terms the script checks.
          source="$SOURCE_ID"
          [ -n "$source" ] || source=geofabrik-nz
          node scripts/data/build-pmtiles.mjs --source "$source" \
            --input data/maps/newzealand-latest.osm.pbf

      - name: Build the pack
        env:
          # BUG-067: the `github` context, not the bare `inputs`.
          SOURCE_ID: ${{ github.event.inputs.source_id || '' }}
        run: |
          set -euo pipefail
          source="$SOURCE_ID"
          [ -n "$source" ] || source=geofabrik-nz
          node scripts/data/build-pmtiles.mjs --source "$source" \
            --input data/maps/newzealand-latest.osm.pbf \
            --execute

      - name: The pack and its evidence
        run: |
          set -euo pipefail
          mkdir -p docs/evidence/maps/pack
          cp apps/mobile/assets/maps/canterbury.pmtiles* docs/evidence/maps/pack/
          {
            echo "# The Canterbury pack build"
            echo
            echo "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "Date: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo
            echo '```json'
            cat apps/mobile/assets/maps/canterbury.manifest.json
            echo '```'
            echo
            echo "Tools:"
            cat .tools/planetiler.version .tools/pmtiles.version
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the pack
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: canterbury-pack
          path: |
            apps/mobile/assets/maps/canterbury.pmtiles
            apps/mobile/assets/maps/canterbury.manifest.json
            docs/evidence/maps/pack/
          retention-days: 30
        if-no-files-found: error
