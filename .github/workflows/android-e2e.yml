name: Android E2E (emulator + Maestro)

# MASTER_EXECUTION P1: the pipeline is built at the root, not patched.
#  - triggers: PRs to main, nightly and manual only (no push: every push used
#    to cancel the running job and waste the private Actions minutes)
#  - the build job produces the release APK once and caches it by content hash;
#    the e2e job reuses that artifact
#  - readiness gates with short timeouts: boot -> install -> am start -> pid ->
#    first-screen testID, each one dumping evidence and failing fast
#  - the app runs in the E2E mode (local mocks): no Metro, no auth service, no API
on:
  pull_request:
    branches:
      - main
    # NO `paths:` filter here (audit item 3g, 2026-11-05): the same paths
    # are filtered at the JOB level below, by the `changes` job. A filter
    # on the trigger keeps the whole workflow from EXISTING for a change it
    # does not match, so the check names it would report (`Build the release
    # APK`, `Run the Maestro flows on the emulator (api 34)`, `A1: the app
    # against the real API (no mock)`) are never reported at all - and a
    # required check that is not reported is a PR that can never be merged,
    # forever pending. A job that runs and reports `skipped` is something
    # branch protection can actually reason about.
    #
    # Only the app, the shared packages, the flows, the a1 job's own scripts
    # and the pipeline itself can break the emulator - a documentation-only
    # push must not spend the minutes, and `scripts/**` is on the list
    # because the a1 job's rows assert and its own suite live there
    # (BUG-188's suite sat on the wrong side of this filter once). The
    # filter moved; the intent did not.
  push:
    branches:
      - main
    # PLAYBOOK 17.2: main is tested after every merge, so a red main is never
    # silent. The same path filter as the PR trigger applies: the flows and the
    # pipeline themselves are included, a docs-only merge is not.
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'services/**'
      - '.maestro/**'
      - 'scripts/**'
      - '.github/workflows/android-e2e.yml'
      - 'package.json'
      - 'pnpm-lock.yaml'
  schedule:
    # Nightly. A red nightly is the first task of the next session.
    - cron: '17 3 * * *'
  workflow_dispatch:

concurrency:
  group: android-e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# PLAYBOOK 17.1 (BUG-065): everything the E2E uses is pinned, and a change to a
# pin is a commit, never a runner's whim. Before this, Maestro was installed at
# `releases/latest`, the emulator binary and the system image were whatever the
# runner carried that day, and the AVD cache key ignored all of them and the
# emulator options - which is why the same APK was green on api-35 one hour and
# red on four PRs the next, with the app, the flows and the workflow unchanged.
#
# The values, with where each came from:
#  - MAESTRO_VERSION cli-2.11.0 - the release tag; MAESTRO_SHA256 is that
#    release's own published checksum for maestro.zip (the release ships a
#    checksums_sha256.txt; this line is that file's value).
#  - EMULATOR_BUILD 16632760 - the stable emulator 37.3.5 from Google's
#    repository2-3.xml (the Linux archive emulator-linux_x64-16632760.zip).
#  - SYSIMG_REV_<api> - the system image's `Pkg.Revision` (audit item 3f,
#    2026-11-05). Google publishes a new revision of
#    system-images;android-<api>;google_apis;x86_64 whenever the image changes,
#    and sdkmanager takes the newest stable one - so without this pin the
#    emulator's bytes change without a commit, which is the same class as the
#    Maestro and emulator pins above. These values are the revision the last
#    green run recorded in its own evidence (`.maestro/evidence/e2e-pins.txt`,
#    run 42019215529 on b81ad239: 14 for api 34, 9 for api 35), so they are read
#    from the pipeline's own output rather than written from memory. A run whose
#    image has moved on FAILS rather than silently recording a new revision:
#    bumping the pin is its own PR, like any other tool upgrade.
# A tool upgrade is its own PR with a green run on both legs.
env:
  MAESTRO_VERSION: cli-2.11.0
  MAESTRO_SHA256: 5384593cb4e7a106489e75a821d157dd43f4e438df6bc308b72e82c685e1283a
  EMULATOR_BUILD: '16632760'
  SYSIMG_REV_34: '14'
  SYSIMG_REV_35: '9'

jobs:
  # The paths filter the pull_request trigger used to carry (audit item 3g,
  # 2026-11-05). It lives HERE now: a plain `git diff --name-only` step, so no
  # new action enters the tree (nothing to SHA-pin, nothing to add to the
  # licence inventory), and every job below names the paths it needs instead of
  # vanishing with the whole workflow when the trigger filtered the run out.
  #
  # Why the trigger's filter was wrong and this one is right: a trigger-level
  # `paths:` keeps the workflow run from EXISTING for a change it does not
  # match, so the check names this workflow reports are never reported at all.
  # A required check that is not reported is a PR that can never be merged -
  # forever pending - which is the "check set that lies" in a stronger form: it
  # says nothing. A job with `if:` reports `skipped`, which branch protection
  # can reason about.
  #
  # The intent is unchanged from the comment the trigger carried: only the app,
  # the shared packages, the flows, the a1 job's own scripts and the pipeline
  # itself can break the emulator, so a documentation-only change must not spend
  # the minutes. `scripts/**` is on the list because the a1 job's rows assert
  # and its own suite live there - a change to them can turn the done-when red
  # (BUG-188's suite sat on the wrong side of this filter once).
  changes:
    name: What changed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      build: ${{ steps.diff.outputs.build }}
      flows: ${{ steps.diff.outputs.flows }}
      scripts: ${{ steps.diff.outputs.scripts }}
      pipeline: ${{ steps.diff.outputs.pipeline }}
      # The two the jobs below gate on, declared because a `needs.<job>.outputs`
      # reference only reads a job output the job declares.
      e2e: ${{ steps.diff.outputs.e2e }}
      a1: ${{ steps.diff.outputs.a1 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # The base sha is a commit that only exists in the repository, so the
          # whole history is fetched; a shallow clone answers "unknown revision"
          # and the diff then reads as "nothing changed", which is the failure
          # this gate exists to prevent.
          fetch-depth: 0

      - name: What this change touches
        id: diff
        run: |
          set -euo pipefail
          # A human who asks (a nightly, a manual dispatch) gets the whole set:
          # the point of the filter is to save the minutes a nobody asked for.
          if [ "${{ github.event_name }}" != "pull_request" ] && [ "${{ github.event_name }}" != "push" ]; then
            echo "the run was asked for by a human: every job runs"
            { echo "build=true"; echo "flows=true"; echo "scripts=true"; echo "pipeline=true"; } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
          fi
          # A new branch's `before` is forty zeroes and a force-push's makes the
          # sha vanish, and neither is a diff: the parent commit is. A diff
          # against nothing would read as "nothing changed", which silently
          # skips every job below.
          if [ -z "$base" ] || [ "${base//0/}" = "" ] || ! git rev-parse -q --verify "$base^{commit}" > /dev/null; then
            base="$(git rev-parse HEAD~1)"
            echo "::notice::the base sha is unusable (a new branch or a force-push), so the diff is against HEAD~1"
          fi
          changed="$(git diff --name-only "$base" HEAD)"
          printf 'the base: %s\nthe changed paths:\n%s\n' "$base" "$changed"
          wants() { printf '%s\n' "$changed" | grep -qE "$1"; }
          app=false flows=false scripts=false pipeline=false
          if wants '^(apps/|packages/)' || wants '^(package\.json|pnpm-lock\.yaml)$'; then app=true; fi
          if wants '^\.maestro/'; then flows=true; fi
          if wants '^scripts/'; then scripts=true; fi
          if wants '^\.github/workflows/android-e2e\.yml$'; then pipeline=true; fi
          build="$app"
          if [ "$app" = true ] || [ "$flows" = true ] || [ "$scripts" = true ] || [ "$pipeline" = true ]; then
            e2e=true
          else
            e2e=false
          fi
          # The a1 flow needs the app and the flows and the scripts; a docs-only
          # change cannot break a real stack that nothing in it touched.
          a1="$e2e"
          {
            echo "build=$build"
            echo "flows=$flows"
            echo "scripts=$scripts"
            echo "pipeline=$pipeline"
            echo "e2e=$e2e"
            echo "a1=$a1"
          } >> "$GITHUB_OUTPUT"
          echo "the jobs: build=$build e2e=$e2e a1=$a1"

  build:
    name: Build the release APK
    # The filter the trigger used to carry (audit item 3g): the job runs
    # for a change that can change the APK, and reports `skipped` for a
    # change that cannot - a reported skip is what makes this check usable
    # as a required check.
    #
    # The second half of the condition: a flow-only change (a new `.maestro/`
    # flow, a script's assert) does not change the APK's bytes, but the legs
    # below download the APK this job uploads, so it still has to produce one.
    # That is cheap, not wasteful: the APK is cached by content hash, so an
    # unchanged app restores the same APK rather than rebuilding it.
    if: needs.changes.outputs.build == 'true' || needs.changes.outputs.e2e == 'true'
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      apk-sha: ${{ steps.hash.outputs.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 12.14.0

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: pnpm

      - name: Set up Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a

      - name: Install the dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the workspace packages
        # The app bundles @courier/design-tokens from its built output: the
        # package must exist before Metro can resolve it (dist/ is not
        # committed).
        run: pnpm --filter @courier/design-tokens build

      - name: The content hash of the build inputs
        id: hash
        run: |
          # The APK only changes when the app, the lockfile or the native config
          # change: the cache key is that hash, not the commit.
          sha=$(git ls-files -s apps/mobile packages services pnpm-lock.yaml | sha256sum | cut -d' ' -f1)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "build input hash: $sha"

      # BUG-098 (C1 audit, squad 6 finding 6, accepted high): the cache used to
      # run before the build with no hit guard, so on a hit the APK was
      # restored and the build then re-ran and re-wrote it anyway - the cache
      # saved nothing, which is the cache this project's private Actions
      # minutes ride on - and a failed build left the restored APK in place
      # for the upload step to attach to a red run. The three steps below make
      # the order explicit: the restore is keyed on the build inputs' own
      # hash, the build is skipped when that key hits, and the upload only
      # runs when this run can account for the APK it is attaching (it built
      # it, or the cache did).
      - name: Restore the APK from the cache
        id: apk-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: apps/mobile/android/app/build/outputs/apk/release/app-release.apk
          key: apk-${{ steps.hash.outputs.sha }}

      - name: Build the release APK
        id: build-apk
        # A cache hit means the bytes on disk are the ones these inputs build:
        # rebuilding them is the waste the cache exists to remove.
        if: steps.apk-cache.outputs.cache-hit != 'true'
        env:
          # The E2E mode: the app runs on local mocks (no Metro, no auth, no API).
          EXPO_PUBLIC_E2E: '1'
        run: |
          pnpm --filter mobile exec expo prebuild --platform android --no-install
          # BUG-079: the flag is legal only in a TEST build that says it is
          # one. This APK needs the bundle embedded (a debug build waits for
          # Metro and never boots - the legs died that way at 68c23eb), so the
          # release artifact declares `--variant e2e`. The ship workflows build
          # `--variant release`, where the flag is refused outright.
          node scripts/ci/check-e2e-flag.mjs --variant e2e
          cd apps/mobile/android
          ./gradlew assembleRelease --no-daemon --stacktrace -PreactNativeArchitectures=x86_64

      - name: Upload the APK
        # A restored APK from this run's own key is a valid artifact; a restored
        # APK under a red build is not, and the guard is what keeps the two
        # apart (the build step failing stops the job before this runs).
        if: steps.build-apk.outcome == 'success' || steps.apk-cache.outputs.cache-hit == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: courier-release-apk
          path: apps/mobile/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 7

  e2e:
    name: Run the Maestro flows on the emulator (api ${{ matrix.api }})
    # `always()` because the legs cannot run without the APK the build
    # job produced: when the build is skipped, this job is skipped too -
    # and a skipped job still reports, which is the whole point of item 3g.
    if: always() && needs.changes.outputs.e2e == 'true' && needs.build.result == 'success'
    needs: [changes, build]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # BUG-051 (the founder): the crash is pinned to the api-34 image's own
    # Chromium init, so the gate runs on the newer api-35 image next to it:
    # the flows must be green on both, and a crash that only fires on one
    # image names itself in the evidence.
    strategy:
      fail-fast: false
      matrix:
        api: [34, 35]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Download the APK
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: courier-release-apk
          path: apk

      - name: Set up Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: 17

      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: The pins' fingerprint
        id: pins
        run: |
          # BUG-065: the AVD cache key was avd-<os>-<api>-google-apis-x86_64, so
          # it stayed the same when the Maestro version, the emulator build or
          # the emulator options changed, and a cached AVD built by a different
          # toolset was reused as if it were this one. The key now carries every
          # pin plus a hash of the emulator options, so a pin change is a cache
          # miss by construction rather than by luck.
          set -euo pipefail
          # The image's pinned revision is read through the variable the pin lives
          # in (SYSIMG_REV_<api>, set at the workflow's top level), so the key
          # changes on the commit that changes the pin and on nothing else
          # (audit item 3f). Without it the fingerprint's own comment - which
          # claims it covers "the system image's revision" - is a documentation
          # lie: a fingerprint miss fell through to the AVD cache and the image
          # itself moved underneath.
          rev_var="SYSIMG_REV_${{ matrix.api }}"
          opts="-no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -memory 6144 -cores 4"
          fingerprint="$MAESTRO_VERSION/$MAESTRO_SHA256/$EMULATOR_BUILD/android-${{ matrix.api }}/google_apis/x86_64/${!rev_var}/$opts"
          hash=$(printf '%s' "$fingerprint" | sha256sum | cut -d' ' -f1 | cut -c1-16)
          echo "hash=$hash" >> "$GITHUB_OUTPUT"
          # The revision is also an output, because caches and assertions name it
          # below and a matrix step cannot read a per-api env key by name.
          echo "revision=${!rev_var}" >> "$GITHUB_OUTPUT"
          echo "pin fingerprint: $fingerprint -> $hash (system image revision ${!rev_var})"

      # The system image is PINNED from here on (audit item 3f, 2026-11-05).
      # The emulator-runner action installs it from the stable channel, which
      # means the emulator's bytes move whenever Google publishes a revision and
      # nothing commits the change - the exact class the Maestro and emulator
      # pins above fixed. This cache restores the pinned image BY REVISION, the
      # step that follows installs it and ASSERTS the revision, and the pins
      # fingerprint above carries it, so a revision change is a cache miss, a
      # fingerprint change and a red run until the pin is bumped on purpose.
      - name: Cache the pinned system image
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ env.ANDROID_SDK_ROOT || env.ANDROID_HOME || '/usr/local/lib/android/sdk' }}/system-images/android-${{ matrix.api }}
          key: sysimg-${{ runner.os }}-${{ matrix.api }}-google_apis-x86_64-rev${{ steps.pins.outputs.revision }}

      - name: Install the pinned system image, and assert its revision
        id: sysimg
        run: |
          set -euo pipefail
          rev_var="SYSIMG_REV_${{ matrix.api }}"
          want="${!rev_var}"
          image="system-images;android-${{ matrix.api }};google_apis;x86_64"
          sdk="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          dir="$sdk/system-images/android-${{ matrix.api }}/google_apis/x86_64"
          # BUG-225: the runner image ships the cmdline-tools but does NOT put
          # them on PATH, so a bare `sdkmanager` is "command not found" and
          # every emulator leg died in this step (run 42058337877). Resolve
          # the newest cmdline-tools bin directory onto PATH here - `sort -V`
          # picks `latest` when it is there, else the highest numbered one -
          # and fail loudly, naming the path, when the SDK carries none.
          tools_bin="$(ls -d "$sdk"/cmdline-tools/*/bin 2>/dev/null | sort -V | tail -n 1 || true)"
          if [ -z "$tools_bin" ] || [ ! -x "$tools_bin/sdkmanager" ]; then
            echo "::error::no sdkmanager under $sdk/cmdline-tools/*/bin (resolved: ${tools_bin:-nothing}) - the runner image changed, or ANDROID_SDK_ROOT points at the wrong SDK"
            exit 1
          fi
          echo "::notice::sdkmanager resolved from $tools_bin"
          echo "$tools_bin" >> "$GITHUB_PATH"
          export PATH="$tools_bin:$PATH"
          # BUG-227: do NOT pipe `yes` into the install. Under `set -o pipefail`
          # the pipeline's status is 141 when `yes` dies of SIGPIPE after
          # sdkmanager exits 0, so the `until` loop read every SUCCESSFUL
          # install as a failure, wiped the just-installed image with
          # `rm -rf "$dir"`, and retried until the budget ran out (run
          # 42118045102: three attempts, each unzip completing 100%, each
          # "failing"). The emulator-runner action does it the safe way, and so
          # do we: accept the licenses once (the `|| true` is for the same
          # SIGPIPE), then install with stdin from /dev/null.
          yes | sdkmanager --licenses >"$RUNNER_TEMP/sdkmanager-licenses.log" 2>&1 || true
          # Three attempts, cleaning the image directory between them: a failed
          # sdkmanager can leave a half-unpacked image, and installing ON TOP of
          # one is how a run ends up asserting a revision from a directory that
          # is not the image.
          attempt=1
          until sdkmanager --install "$image" >"$RUNNER_TEMP/sdkmanager.log" 2>&1 </dev/null; do
            if [ "$attempt" -ge 3 ]; then
              echo "::error::the system image $image did not install in 3 attempts"
              grep -inE 'exception|error|no space|failed|cannot|denied' "$RUNNER_TEMP/sdkmanager.log" | tail -n 20 || true
              tail -c 2000 "$RUNNER_TEMP/sdkmanager.log"
              exit 1
            fi
            echo "::warning::attempt $attempt for $image failed: wiping the image directory and retrying"
            rm -rf "$dir"
            attempt=$((attempt + 1))
          done
          got="$(grep -h 'Pkg.Revision' "$dir/source.properties" | cut -d= -f2)"
          if [ "$got" != "$want" ]; then
            echo "::error::$image is at Pkg.Revision=${got:-unknown}, and the pin SYSIMG_REV_${{ matrix.api }}=$want. A revision that is not pinned changes the emulator's bytes without a commit."
            exit 1
          fi
          echo "revision=$got" >> "$GITHUB_OUTPUT"
          echo "the pinned system image $image is at Pkg.Revision=$got (pin $want)"

      - name: Cache the AVD snapshot
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.android/avd
          # BUG-068: the key must carry EVERYTHING that shapes the AVD, not just
          # os+api+target+arch. The old key (os-api-target-arch only) restored a
          # snapshot created on a rotated runner image with a tiny device
          # profile: every flow then failed their asserts on a 320x640 screen
          # while `am start` still answered COLD/ok - red gates blamed on the
          # app when the harness was what changed. PR #88 made the key carry the
          # emulator-runner's pinned revision and a hash of the emulator-options;
          # this branch's pins slice (BUG-065) takes it further, to the fingerprint
          # the pins step computes (the runner revision, the emulator build, the
          # system image's revision, the Maestro version and the emulator options
          # itself), so a change to any of them is the commit that renames the key.
          #
          # No `restore-keys` (audit item 3e, 2026-11-05): a restore-keys PREFIX
          # restores a cache entry whose key does not match, which undoes the
          # paragraph above. With `avd-<os>-<api>-google-apis-x86_64-` as the
          # prefix, an AVD built under a different Maestro version, emulator
          # build, system-image revision or option set is handed to this job on a
          # fingerprint miss - which is exactly BUG-068's tiny-device-profile
          # failure, re-armed one line below the comment that describes fixing it.
          # Only an EXACT key restores now, and a pin change is a cache miss that
          # builds the right AVD.
          key: avd-${{ runner.os }}-${{ matrix.api }}-google-apis-x86_64-${{ steps.pins.outputs.hash }}

      - name: Install Maestro
        env:
          MAESTRO_VERSION: ${{ env.MAESTRO_VERSION }}
          MAESTRO_SHA256: ${{ env.MAESTRO_SHA256 }}
        run: |
          # BUG-065: the installer takes its version from `releases/latest` when
          # MAESTRO_VERSION is empty, so the runner's Maestro changed without a
          # commit. The pinned release is downloaded directly and its archive's
          # checksum - the release's own published value, recorded in the
          # workflow env - is verified before anything runs. That is the same
          # guarantee a lockfile gives a package, and it is why no byte runs
          # unverified (V4 section 7: never pipe a script into a shell either).
          set -euo pipefail
          url="https://github.com/mobile-dev-inc/Maestro/releases/download/${MAESTRO_VERSION}/maestro.zip"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/maestro.zip" "$url"
          echo "${MAESTRO_SHA256}  $RUNNER_TEMP/maestro.zip" | sha256sum -c -
          rm -rf "$HOME/.maestro" "$HOME/.maestro/tmp"
          mkdir -p "$HOME/.maestro/tmp"
          unzip -qo "$RUNNER_TEMP/maestro.zip" -d "$HOME/.maestro/tmp"
          cp -rf "$HOME/.maestro/tmp/maestro/." "$HOME/.maestro/"
          rm -rf "$HOME/.maestro/tmp" "$RUNNER_TEMP/maestro.zip"
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
          "$HOME/.maestro/bin/maestro" --version

      - name: Run the Maestro flows on the emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          disable-animations: true
          # BUG-060: software GL. Without a -gpu flag the emulator picks its own
          # host GL mode, and on the headless runner it took the gate down with
          # "no first screen appeared in 90s" and today-screen asserts failing
          # while the GL chatter lines still appear in a green run.
          # swiftshader_indirect is the standard headless setting and is what
          # design-videos.yml already uses here (PR #12's screen-recordings.yml
          # carries it on its own branch). The gate that keeps it:
          # scripts/ci/check-emulator-gpu.mjs.
          # BUG-060/BUG-061: software GL (swiftshader) does the emulator's whole
          # drawing on the CPU, and 2048 MB is not enough for the emulator plus
          # the Skia surfaces the app draws - the runs that died did it losing
          # the adb daemon (both legs at the same second) after boots that had
          # slowed from 26-30 s to 36-39 s. The runner has 4 cores and 16 GB, so
          # the emulator gets 6 GB and 4 cores.
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -memory 6144 -cores 4
          # BUG-065: the emulator binary is pinned to EMULATOR_BUILD (the stable
          # 37.3.5 from Google's repository2-3.xml). The action installs the
          # system image from the stable channel by api-level, so that revision
          # is not a pin: it is read from the installed image after the run and
          # recorded in the evidence and in the nightly health file.
          emulator-build: ${{ env.EMULATOR_BUILD }}
          script: bash .maestro/run-all.sh
          working-directory: .

      - name: Record the pins this run actually used
        if: always()
        run: |
          # PLAYBOOK 17.1: "the system image, through its revision where the
          # action allows it, recorded otherwise". The image is installed by the
          # action from the stable channel, so its revision is read from the
          # installed package and written into the evidence - the number the
          # nightly health report then reads.
          set -uo pipefail
          mkdir -p .maestro/evidence
          sdk="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          image="$sdk/system-images/android-${{ matrix.api }}/google_apis/x86_64"
          rev=""
          if [ -f "$image/source.properties" ]; then
            rev="$(grep -h 'Pkg.Revision' "$image/source.properties" | cut -d= -f2)"
          fi
          {
            echo "maestro_version=$MAESTRO_VERSION"
            echo "maestro_sha256=$MAESTRO_SHA256"
            echo "emulator_build=$EMULATOR_BUILD"
            echo "system_image_revision=${rev:-unknown}"
            echo "avd_cache_key=avd-${{ runner.os }}-${{ matrix.api }}-google-apis-x86_64-${{ steps.pins.outputs.hash }}"
          } | tee .maestro/evidence/e2e-pins.txt
          # The emulator-runner action installs the image from the stable channel
          # by api-level (audit item 3f): the pre-step pinned it and asserted the
          # revision BEFORE the emulator ran, and this step proves the action did
          # not move it. A revision that changed under the pin is a failure here,
          # not a number to record and forget - the fix is to bump SYSIMG_REV_<api>
          # in its own PR, exactly like any other tool upgrade above.
          rev_var="SYSIMG_REV_${{ matrix.api }}"
          want="${!rev_var}"
          if [ "${rev:-unknown}" != "$want" ]; then
            echo "::error::the system image moved under the pin: the emulator left Pkg.Revision=${rev:-unknown}, and SYSIMG_REV_${{ matrix.api }}=$want. Bump the pin in its own PR, or the emulator's bytes changed without a commit."
            exit 1
          fi

      - name: Upload the evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: android-e2e-evidence-api${{ matrix.api }}
          path: |
            .maestro/evidence/**
            apk/**
          if-no-files-found: ignore
          retention-days: 7

  # A1's done-when (the audit's first finding): the app against the real API,
  # with no mock anywhere. Every other leg of this workflow proves the screens
  # on local mocks; this job proves the courier can work a shift.
  #
  #   - the API and Postgres run in compose with DEMO_SEED_ENABLED=true
  #     (infra/compose.ci.yml), so the day the app reads is a real seeded day
  #     in a real database;
  #   - the APK is built WITHOUT the E2E flag, so the auth client and the API
  #     client are the real ones, dialling the compose stack through the
  #     emulator's own address of the runner (10.0.2.2);
  #   - a flow signs up, loads the seeded day, delivers three stops, loses the
  #     network, delivers a fourth, gets the network back and lets the outbox
  #     send what it held;
  #   - and the job then asserts the rows landed in Postgres. A green run here
  #     is the audit's done-when, not a unit test.
  a1:
    name: 'A1: the app against the real API (no mock)'
    # The same filter, at the job level (audit item 3g). The a1 flow needs
    # its own APK, so it waits for the build job to have produced one.
    if: always() && needs.changes.outputs.a1 == 'true' && needs.build.result == 'success'
    needs: [changes, build]
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 12.14.0

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: pnpm

      - name: Set up Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a

      - name: Install the dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the design tokens
        run: pnpm --filter @courier/design-tokens build

      # The APK with no mock in it: EXPO_PUBLIC_E2E is absent, so the app
      # opens its real auth client and its real run store. The two URLs are
      # the emulator's own addresses of the compose stack on this runner -
      # and the same value the auth service's issuer carries, so the token the
      # app dials with is the token the API verifies (the audit's BUG-122
      # finding is that nothing cross-checks those two; here they are one value
      # by construction).
      - name: Build the release APK for the real server
        env:
          EXPO_PUBLIC_API_URL: http://10.0.2.2:8000
          EXPO_PUBLIC_AUTH_URL: http://10.0.2.2:3001
        run: |
          set -euo pipefail
          # BUG-079: this is the a1 job's own RELEASE APK and it carries no
          # E2E flag, so the gate that refuses a release build with the mocks
          # in it has to pass here.
          node scripts/ci/check-e2e-flag.mjs --variant release
          pnpm --filter mobile exec expo prebuild --platform android --no-install
          cd apps/mobile/android
          ./gradlew assembleRelease --no-daemon --stacktrace -PreactNativeArchitectures=x86_64

      - name: Start the API, the auth service and Postgres
        run: |
          set -euo pipefail
          # The stack comes up in two moves, because two migrations apply to
          # this one database and only one of them is the postgres container's.
          #
          #   1. The contract's schema.sql (the API's tables: runs, shifts,
          #      stops, delivery_events) is applied by the postgres image's own
          #      entrypoint from
          #      packages/contracts/db/schema.sql (infra/compose.ci.yml mounts
          #      it under docker-entrypoint-initdb.d), so postgres and valkey
          #      start first.
          #   2. The auth service's OWN tables (Better Auth's user, session,
          #      account, verification, organization, team, teamMember, member,
          #      invitation, twoFactor, jwks) are not in that schema, and the
          #      service refuses to serve a database without them: the first
          #      run of this job stopped with the auth container logging
          #      "Database schema mismatch ... Missing tables user, session, ..."
          #      and exiting. Better Auth creates them with its own CLI
          #      (services/auth/src/migrate.config.ts, the same module the
          #      service loads), which infra/deploy.sh runs on the deploy path -
          #      so it runs here too, inside the auth image, on this compose
          #      network, where the database is reachable by its service name.
          docker compose -f infra/compose.ci.yml up -d --wait postgres valkey
          docker compose -f infra/compose.ci.yml run --rm --no-deps -T auth \
            npx --yes auth@1.7.10 migrate --yes --config src/migrate.config.ts
          # `--wait` fails with only "container X exited (1)" - it does not
          # print the container's logs, which is how run 41356105462's a1
          # failure (the API refusing to boot over an unlisted plaintext JWKS
          # host) had to be root-caused locally. On failure, dump the logs so
          # the job itself names the reason.
          docker compose -f infra/compose.ci.yml up -d --wait || {
            docker compose -f infra/compose.ci.yml logs --no-color --tail 200 api auth
            exit 1
          }
          docker compose -f infra/compose.ci.yml ps

      - name: Install Maestro
        # The legs carry this step, and this job needs it exactly as they do:
        # `run-a1.sh` calls `maestro test`, and without the install the flow
        # runner died with `maestro: command not found` (exit 127) seconds
        # after the APK installed - the emulator and the install were fine,
        # and the flow never ran (run 41276278118 on head 8f64c22). Same
        # pinned release and the same recorded checksum as the legs' own
        # (BUG-065: the version is a commit, never the runner's whim).
        env:
          MAESTRO_VERSION: ${{ env.MAESTRO_VERSION }}
          MAESTRO_SHA256: ${{ env.MAESTRO_SHA256 }}
        run: |
          set -euo pipefail
          url="https://github.com/mobile-dev-inc/Maestro/releases/download/${MAESTRO_VERSION}/maestro.zip"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/maestro.zip" "$url"
          echo "${MAESTRO_SHA256}  $RUNNER_TEMP/maestro.zip" | sha256sum -c -
          rm -rf "$HOME/.maestro" "$HOME/.maestro/tmp"
          mkdir -p "$HOME/.maestro/tmp"
          unzip -qo "$RUNNER_TEMP/maestro.zip" -d "$HOME/.maestro/tmp"
          cp -rf "$HOME/.maestro/tmp/maestro/." "$HOME/.maestro/"
          rm -rf "$HOME/.maestro/tmp" "$RUNNER_TEMP/maestro.zip"
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
          "$HOME/.maestro/bin/maestro" --version

      - name: Enable KVM for the emulator
        # The step the e2e legs carry, and this job needs it exactly as they do.
        # Without it the runner has no /dev/kvm, the emulator-runner prints
        # "Disabling Linux hardware acceleration." and launches QEMU with
        # `-accel off` (full software emulation), which cannot boot an x86_64
        # Android image inside the action's 10-minute boot wait: the process
        # prints its INFO lines and then goes silent, every `adb -s
        # emulator-5554 shell getprop sys.boot_completed` answers
        # "device 'emulator-5554' not found", and the job dies with
        # "Timeout waiting for emulator to boot." before any flow ran - which
        # is why every a1 run so far ended with delivery_events: 0. With the
        # rule in place the same emulator boots in ~35 s, as both legs of the
        # same runs prove.
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run the no-mock flow on the emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -memory 6144 -cores 4
          emulator-build: ${{ env.EMULATOR_BUILD }}
          script: bash .maestro/run-a1.sh
          working-directory: .

      # The done-when's second half: the rows. This runner's database starts
      # empty and the flow is its only writer, so the count is decisive - three
      # deliveries sent while the network was up, one held while it was down
      # and sent once it came back.
      - name: Assert the rows the flow left in Postgres
        if: always()
        run: bash scripts/ci/assert-a1-rows.sh

      # BUG-188's own suite: it proves the assert above waits for the delivery
      # the outbox sends on its own schedule, against the very database this
      # job started. It lives outside the repo's standard script glob on
      # purpose (it needs the compose stack), and it runs here, where it is.
      - name: The rows assert's own suite (BUG-188)
        if: always()
        run: node --test scripts/ci/__tests__/a1/assert-a1-rows.test.mjs

      - name: Upload the evidence
        if: always() || cancelled()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: android-e2e-evidence-a1
          path: |
            .maestro/evidence
          if-no-files-found: ignore
          retention-days: 7
