name: Android E2E (emulator + Maestro)

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  maestro:
    name: Build the app and run the Maestro flows
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 12.14.0

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Set up Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install the dependencies
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install-deps chromium || true

      - name: Install Maestro
        run: |
          # The installer is downloaded, shown and then executed — never piped
          # straight into a shell (V4 §7).
          curl -fsSL "https://get.maestro.mobile.dev" -o "$RUNNER_TEMP/maestro-install.sh"
          echo "--- the installer starts with ---"
          head -n 20 "$RUNNER_TEMP/maestro-install.sh"
          chmod +x "$RUNNER_TEMP/maestro-install.sh"
          bash "$RUNNER_TEMP/maestro-install.sh"
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Build the debug APK
        env:
          # The emulator reaches the host on 10.0.2.2.
          EXPO_PUBLIC_AUTH_URL: http://10.0.2.2:3001
        run: |
          pnpm --filter mobile exec expo prebuild --platform android --no-install
          cd apps/mobile/android
          # Only the emulator ABI is built: four ABIs would quadruple the build.
          ./gradlew assembleDebug --no-daemon --stacktrace -PreactNativeArchitectures=x86_64

      - name: Upload the APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: courier-debug-apk
          path: apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Run the Maestro flows on the emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: bash .maestro/run-all.sh
          working-directory: .

      - name: Upload the Maestro artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: maestro-artifacts
          path: |
            ~/.maestro/tests/**/*.xml
            ~/.maestro/tests/**/*.png
            ~/.maestro/tests/**/*.html
          if-no-files-found: ignore

      - name: Upload logcat
        if: always()
        run: |
          timeout 60 adb logcat -d -t 2000 > android-logcat.txt || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: android-logcat
          path: android-logcat.txt
          if-no-files-found: ignore
