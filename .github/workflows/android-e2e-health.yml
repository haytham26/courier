name: Android E2E health (5 runs per leg)

# PLAYBOOK 17.4 (BUG-064): flake is measured, not argued. The nightly suite runs
# the FULL flow set five times per leg on main, then writes the per-flow pass
# rate into docs/evidence/e2e-health.md. Any flow under 100 % is a bug with a
# number, and the number is what a merge decision is made against.
#
# The pins are identical to android-e2e.yml's, and scripts/ci/check-e2e-pins.mjs
# (in the quality-gates floor job) fails the build if they ever differ: a tool
# upgrade is one PR that moves all of them, never one file's worth.
on:
  schedule:
    # After the main nightly (03:17), so the night's own run has already told us
    # whether main is green at all.
    - cron: '45 4 * * *'
  workflow_dispatch:

concurrency:
  group: android-e2e-health-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  # The same pins as android-e2e.yml; see that file for where each value came
  # from and why it is not the runner's choice.
  MAESTRO_VERSION: cli-2.11.0
  MAESTRO_SHA256: 5384593cb4e7a106489e75a821d157dd43f4e438df6bc308b72e82c685e1283a
  EMULATOR_BUILD: '16632760'

jobs:
  build:
    name: Build the release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      apk-sha: ${{ steps.hash.outputs.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 12.14.0
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - name: Set up Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - name: Install the dependencies
        run: pnpm install --frozen-lockfile
      - name: Build the workspace packages
        run: pnpm --filter @courier/design-tokens build
      - name: The content hash of the build inputs
        id: hash
        run: |
          sha=$(git ls-files -s apps/mobile packages services pnpm-lock.yaml | sha256sum | cut -d' ' -f1)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "build input hash: $sha"
      - name: Cache the APK by content hash
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: apps/mobile/android/app/build/outputs/apk/release/app-release.apk
          key: apk-${{ steps.hash.outputs.sha }}
      - name: Build the release APK
        env:
          EXPO_PUBLIC_E2E: '1'
        run: |
          pnpm --filter mobile exec expo prebuild --platform android --no-install
          cd apps/mobile/android
          ./gradlew assembleRelease --no-daemon --stacktrace -PreactNativeArchitectures=x86_64
      - name: Upload the APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: courier-health-apk
          path: apps/mobile/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 2

  measure:
    name: api ${{ matrix.api }}, run ${{ matrix.iteration }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        iteration: [1, 2, 3, 4, 5]
        api: [34, 35]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Download the APK
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: courier-health-apk
          path: apk
      - name: Set up Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: The pins' fingerprint
        id: pins
        run: |
          # The options are written out in full, exactly as the emulator-options
          # line below has them: the fingerprint is only honest if it hashes what
          # the emulator is actually launched with.
          set -euo pipefail
          opts="-no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -memory 6144 -cores 4"
          fingerprint="$MAESTRO_VERSION/$MAESTRO_SHA256/$EMULATOR_BUILD/android-${{ matrix.api }}/google_apis/x86_64/$opts"
          echo "hash=$(printf '%s' "$fingerprint" | sha256sum | cut -d' ' -f1 | cut -c1-16)" >> "$GITHUB_OUTPUT"
          echo "pin fingerprint: $fingerprint"
      - name: Cache the AVD snapshot
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.android/avd
          key: avd-${{ runner.os }}-${{ matrix.api }}-google-apis-x86_64-${{ steps.pins.outputs.hash }}
      - name: Install Maestro
        run: |
          # The pinned release, checksum-verified before anything runs, exactly
          # as android-e2e.yml does (BUG-064).
          set -euo pipefail
          url="https://github.com/mobile-dev-inc/Maestro/releases/download/${MAESTRO_VERSION}/maestro.zip"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/maestro.zip" "$url"
          echo "${MAESTRO_SHA256}  $RUNNER_TEMP/maestro.zip" | sha256sum -c -
          rm -rf "$HOME/.maestro" "$HOME/.maestro/tmp"
          mkdir -p "$HOME/.maestro/tmp"
          unzip -qo "$RUNNER_TEMP/maestro.zip" -d "$HOME/.maestro/tmp"
          cp -rf "$HOME/.maestro/tmp/maestro/." "$HOME/.maestro/"
          rm -rf "$HOME/.maestro/tmp" "$RUNNER_TEMP/maestro.zip"
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
          "$HOME/.maestro/bin/maestro" --version
      - name: Run the Maestro flows on the emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.34.0
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          disable-animations: true
          # BUG-060: software GL. The GL gate (scripts/ci/check-emulator-gpu.mjs)
          # reads this line itself, so the options are written out in full here
          # rather than drawn from an env variable: a gate that cannot see the
          # flag must fail, not hope.
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -memory 6144 -cores 4
          emulator-build: ${{ env.EMULATOR_BUILD }}
          script: bash .maestro/run-all.sh
          working-directory: .
      - name: Record the pins this run actually used
        if: always()
        run: |
          set -uo pipefail
          mkdir -p .maestro/evidence
          sdk="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          image="$sdk/system-images/android-${{ matrix.api }}/google_apis/x86_64"
          rev=""
          if [ -f "$image/source.properties" ]; then
            rev="$(grep -h 'Pkg.Revision' "$image/source.properties" | cut -d= -f2)"
          fi
          {
            echo "maestro_version=$MAESTRO_VERSION"
            echo "emulator_build=$EMULATOR_BUILD"
            echo "system_image_revision=${rev:-unknown}"
            echo "avd_cache_key=avd-${{ runner.os }}-${{ matrix.api }}-google-apis-x86_64-${{ steps.pins.outputs.hash }}"
          } | tee .maestro/evidence/e2e-pins.txt
      - name: Upload the run's own evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: health-api${{ matrix.api }}-run${{ matrix.iteration }}
          path: |
            .maestro/evidence/flows.txt
            .maestro/evidence/summary.txt
            .maestro/evidence/e2e-pins.txt
          if-no-files-found: warn

  report:
    name: Write the E2E health report
    needs: [build, measure]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: true
      - name: Gather the ten runs' results
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: health
          pattern: health-api*
      - name: Count the pass rate and write the report
        run: |
          set -uo pipefail
          mkdir -p docs/evidence
          # Each run's artifact holds its own flows.txt (one
          # `flow=<name> status=<pass|fail>` line per flow) and its summary.txt
          # (`run-summary: status=...`). The directory name carries the leg and
          # the iteration, so the counts are per (leg, flow) over the runs that
          # actually ran a flow: a run that died earlier writes no flow line and
          # is counted in the leg's green table, where the summary names it.
          {
            echo "# Android E2E health"
            echo
            echo "Measured: $(date -u '+%Y-%m-%d %H:%M UTC') on \`$(git rev-parse --short HEAD)\`"
            echo "by the \`android-e2e-health\` workflow."
            echo
            echo "PLAYBOOK 17.4: flake is measured, not argued. Five runs of the full"
            echo "flow set per leg on main. A flow under 100 % is a bug with a number,"
            echo "and that number is what a merge decision is made against."
            echo
            echo "| Leg | Flow | Green runs | Pass rate |"
            echo "|---|---|---|---|"
            for api in 34 35; do
              for flow in $(ls health/health-api${api}-run1/flows.txt >/dev/null 2>&1 && sed -n 's/^flow=\(.*\) status=.*$/\1/p' health/health-api${api}-run1/flows.txt); do
                green=0
                runs=0
                for dir in health/health-api${api}-run*; do
                  [ -d "$dir" ] || continue
                  runs=$((runs + 1))
                  if grep -q "^flow=${flow} status=pass$" "$dir/flows.txt" 2>/dev/null; then
                    green=$((green + 1))
                  fi
                done
                rate=$(( runs == 0 ? 0 : green * 100 / runs ))
                echo "| api-${api} | ${flow} | ${green}/${runs} | ${rate}% |"
              done
              green=0
              runs=0
              for dir in health/health-api${api}-run*; do
                [ -d "$dir" ] || continue
                runs=$((runs + 1))
                if grep -q 'status=green' "$dir/summary.txt" 2>/dev/null; then green=$((green + 1)); fi
              done
              echo "| api-${api} | the whole run | ${green}/${runs} | $(( runs == 0 ? 0 : green * 100 / runs ))% |"
            done
            echo
            echo "The pins every run used (recorded by each run, all ten agreed):"
            echo
            echo '```'
            cat health/health-api34-run1/e2e-pins.txt 2>/dev/null || echo "no pins file was produced"
            echo '```'
          } > docs/evidence/e2e-health.md
          cat docs/evidence/e2e-health.md
      - name: Commit the report
        run: |
          # [skip ci] keeps the report's own commit from re-running the suite:
          # the measurement, not the commit, is what the queue acts on.
          git config user.name "courier-ci"
          git config user.email "ci@courier.invalid"
          git add docs/evidence/e2e-health.md
          if git diff --cached --quiet; then
            echo "the health report did not change"
            exit 0
          fi
          git commit -m "docs(evidence): the E2E health report - 5 runs per leg [skip ci]"
          git push origin HEAD:main
