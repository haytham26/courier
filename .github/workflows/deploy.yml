# The staging deploy (A5).
#
# A push to main builds and smoke-tests the staging stack on the runner itself
# (the `verify` leg: the local VM the audit names). The deploy to the staging
# host waits for the repository's own gates - CI and Quality gates - to conclude
# on the SAME sha, which is what `workflow_run` gives us (audit item 3d): a
# deploy that runs while CI is still red, or on a sha that was never tested, is
# a deploy of whatever happened to be on the branch at that moment. The
# `workflow_run` trigger also means this file's own push-triggered run no longer
# deploys: the deploy job runs on the gates' completion, or on a human's
# explicit `workflow_dispatch`.
#
# The audit's founder input is the OCI host and key (FOUNDER_TODO). Until they
# exist, the `verify` leg runs on every push - it builds the images and brings
# the whole staging stack up on the runner itself - and the `deploy` leg is
# skipped, not quietly: it prints the exact secrets it is waiting for. A deploy
# that silently did nothing would be worse than one that says it has nowhere to
# go.
#
# All three legs use the same two scripts (`infra/deploy.sh`, `infra/smoke.sh`),
# so the procedure the workflow runs and the procedure a developer runs by hand
# on the host are one procedure. That is the whole point of testing against a
# local VM first: when the host arrives, what is new is a hostname, not a script.

name: Deploy staging

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: "verify builds the stack locally; deploy pushes it to the staging host"
        required: true
        default: verify
        type: choice
        options: [verify, deploy]
  # The gates finishing is the deploy's starting gun (audit item 3d): the run
  # carries the sha they ran on, and the deploy checks out THAT sha rather than
  # the tip of the branch, which may have moved since.
  workflow_run:
    workflows: ["CI", "Quality gates"]
    types: [completed]

permissions:
  contents: read
  # The gate below reads the runs of the two workflows, which is the only thing
  # this workflow asks the API for. A `workflow_run` event's token is read-only
  # by default; reading runs needs `actions: read`.
  actions: read

concurrency:
  # One deploy at a time: two pushes in a row would race on the same stack.
  # The in-progress run is not cancelled - cancelling a deploy mid-migration
  # leaves the host in a state nobody chose.
  group: deploy-staging
  cancel-in-progress: false

jobs:
  verify:
    name: Build and smoke-test the staging stack (the local VM)
    # The push that started CI already ran this leg; a `workflow_run` event
    # runs the deploy leg only (audit item 3d), so building the stack twice
    # would be cost with nothing proved.
    if: github.event_name != 'workflow_run'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # No workspace install on purpose: nothing here runs Node on the runner.
      # The images build their own dependencies, and the auth service's
      # migration runs INSIDE the auth image (`infra/deploy.sh`), where the
      # service's own configuration and its node_modules live. Both host-side
      # runs of that migration went red on main - once for a missing `zod`, once
      # for a missing `AUTH_DATABASE_URL` - and one `docker compose run` in the
      # image is the fix for the whole class (BUG-070).

      - name: Build the API image
        run: |
          docker build \
            --build-arg PYTHON_VERSION=3.12 \
            -t courier-api:${{ github.sha }} \
            -f services/api/Dockerfile services/api

      - name: Build the auth image
        run: |
          docker build \
            -t courier-auth:${{ github.sha }} \
            -f services/auth/Dockerfile .

      - name: The staging compose renders
        # The same validation a developer runs before a deploy: the three files
        # resolve, every required variable is named, and the network's addresses
        # are inside the subnet.
        run: |
          # The CI env file names the throwaway values, the same way a
          # developer's run does: a compose file that refuses to render without
          # them is telling the truth, and the values are the runner's.
          docker compose --env-file infra/ci-staging.env -f infra/compose.staging.yml config --quiet
          echo "the services: $(docker compose --env-file infra/ci-staging.env -f infra/compose.staging.yml config --services | tr '\n' ' ')"

      - name: Bring the staging stack up
        # The migrations run here (the compose file applies the contract's own
        # schema to a fresh volume), then the smoke test drives the core flow
        # through the edge: the seed, the run, the stops, and the health
        # endpoints' 404. A runner has more memory than the founder's local VM
        # (capped at 3 GB), so the whole stack fits.
        env:
          POSTGRES_PASSWORD: ci-staging-postgres
          VALKEY_PASSWORD: ci-staging-valkey
          BETTER_AUTH_SECRET: ci-staging-better-auth-secret-0123456789abcdef
          AUTH_TRUSTED_ORIGINS: "https://staging.courier.local,exp://"
          APP_VERSION: ${{ github.sha }}
          COURIER_API_IMAGE: courier-api:${{ github.sha }}
          COURIER_AUTH_IMAGE: courier-auth:${{ github.sha }}
          COURIER_DOMAIN: staging.courier.local
        run: |
          set -euo pipefail
          bash infra/deploy.sh apply --from infra/ci-staging.env
          # The staging edge publishes 8443 on the runner (the staging stack's
          # own port, so it cannot fight a runner's own services). The domain
          # answers on the loopback, and the edge holds Caddy's local-CA
          # certificate for it.
          echo "127.0.0.1 staging.courier.local" | sudo tee -a /etc/hosts

      - name: The smoke test
        # No token is passed on purpose: the CI verify leg has no staging
        # identity, and faking one to make the check green would prove nothing.
        # The smoke test runs what it can prove without an identity - the edge's
        # TLS, the version, the health endpoints' 404, and the anonymous 401 on
        # the seed - and reports which checks it skipped. The deploy leg runs
        # the same test with the staging token, which is a secret.
        env:
          # The version check compares /healthz against what this push deployed.
          # The stack step sets APP_VERSION for the API container, but a step's
          # environment is not inherited by the next one, so without this the
          # smoke test printed "APP_VERSION is not set: skipping the version
          # check" and the deployment's own version went unproven - a check
          # that silently does not run is a check nobody reads.
          APP_VERSION: ${{ github.sha }}
        run: |
          set -euo pipefail
          # --port 8443: the staging edge publishes 8443 on the runner (the
          # runner's own 443 is not ours to take), and the smoke test aims at
          # the edge it is asked for. Before this flag the script always used
          # 443 and the verify leg could never reach the stack it built.
          bash infra/smoke.sh --domain staging.courier.local --port 8443 --evidence .smoke

      - name: The stacks' evidence
        if: always()
        run: |
          docker compose --env-file infra/ci-staging.env -f infra/compose.staging.yml ps > .smoke/compose-ps.txt || true
          docker compose --env-file infra/ci-staging.env -f infra/compose.staging.yml logs --tail=200 caddy > .smoke/caddy.log || true

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: staging-smoke
          path: .smoke/
          retention-days: 14

  deploy:
    name: Deploy to the staging host
    # The deploy runs when the repository's gates SAID YES about a sha, or when a
    # human says yes themselves (audit item 3d). It does not run on the push that
    # started those gates: a push fires before they finish, and a deploy on a
    # push is a deploy of a tree nobody has tested yet.
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_run'
    runs-on: ubuntu-latest
    steps:
      # The gate: BOTH required workflows concluded `success` on the sha this
      # run is about. `workflow_run` fires for either workflow finishing, so the
      # other one is read from the API rather than assumed - a deploy that
      # waited for CI alone while Quality gates was red is the same bug as no
      # gate at all.
      - name: The gates are green on this sha
        if: github.event_name == 'workflow_run'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          runs="$(gh api "repos/$REPO/actions/runs?head_sha=$SHA" --paginate --jq '.workflow_runs[] | [.name, .status, .conclusion] | @tsv')"
          printf 'the runs on %s:\n%s\n' "$SHA" "$runs"
          for workflow in "CI" "Quality gates"; do
            if ! awk -F'\t' -v want="$workflow" '$1 == want && $2 == "completed" && $3 == "success" { found = 1 } END { exit found ? 0 : 1 }' <<<"$runs"; then
              echo "::error::$workflow has not passed on $SHA: the deploy waits for CI AND Quality gates"
              exit 1
            fi
          done
          echo "::notice::CI and Quality gates both passed on $SHA: the deploy may proceed"

      - name: The host the audit is waiting for
        id: host
        run: |
          set -euo pipefail
          for secret in COURIER_STAGING_HOST COURIER_STAGING_USER COURIER_STAGING_KEY; do
            if [ -z "${!secret:-}" ]; then
              echo "::notice::A5 is waiting for the OCI host (FOUNDER_TODO): $secret is not set, so the deploy leg is skipped"
              echo "configured=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "configured=true" >> "$GITHUB_OUTPUT"

      - name: Nothing to deploy to yet
        if: steps.host.outputs.configured != 'true'
        run: |
          echo "::notice::A5's deploy leg is skipped: the OCI host and key (FOUNDER_TODO) are not configured"
          echo "The verify leg above builds the same stack and runs the same smoke test on the runner,"
          echo "which is the local VM the audit names. The procedure is one procedure:"
          echo "  infra/deploy.sh apply --from infra/staging.env"
          echo "  infra/smoke.sh --domain <the staging domain> --token <a courier's JWT>"

      # The sha the gates ran on, NOT the branch tip (audit item 3d): the tip
      # may have moved since they finished, and a deploy of the tip is a deploy
      # of a tree nobody tested. On a `workflow_dispatch` the event's own sha is
      # what a human asked for.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: steps.host.outputs.configured == 'true'
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      # The host's bootstrap, before anything is copied to it (the founder
      # decision of 2026-11-11): the deploy user, Docker, the firewall, the
      # automatic updates, the swap and the nightly backup cron. It is
      # idempotent by construction, so it runs on every deploy and changes
      # nothing after the first. ARM64 is the host's architecture (the Oracle
      # Ampere always-free shape): every package it installs comes from
      # repositories that serve arm64.
      - name: Bootstrap the host (once; idempotent)
        if: steps.host.outputs.configured == 'true'
        env:
          HOST: ${{ secrets.COURIER_STAGING_HOST }}
          USER: ${{ secrets.COURIER_STAGING_USER }}
          KEY: ${{ secrets.COURIER_STAGING_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
          ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=accept-new "${USER}@${HOST}" \
            'bash -s' < infra/bootstrap-host.sh

      - name: Deploy to the host
        if: steps.host.outputs.configured == 'true'
        env:
          HOST: ${{ secrets.COURIER_STAGING_HOST }}
          USER: ${{ secrets.COURIER_STAGING_USER }}
          KEY: ${{ secrets.COURIER_STAGING_KEY }}
          # The domain and the smoke token live here, in the environment, and
          # travel to the remote shell over STDIN (audit item 3c). They are
          # never spelled into the ssh command line: a secret interpolated into
          # an ssh argv is readable in the remote host's own `ps` by any process
          # on that host for as long as the command runs, and a quoting mistake
          # is a leak into a log. `scripts/ci/check-deploy-secrets-inline.mjs`
          # holds the line.
          STAGING_DOMAIN: ${{ secrets.COURIER_STAGING_DOMAIN }}
          SMOKE_TOKEN: ${{ secrets.COURIER_SMOKE_TOKEN }}
          APP_VERSION: ${{ github.sha }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
          # The deployment runs as the deploy user on the host, in the checked
          # out tree. The compose files, the Dockerfiles and the two scripts
          # are copied by rsync, so the host runs this commit's infra/ exactly.
          #
          # --relative, and NO trailing slashes on the three sources (audit item
          # 3a): `infra/ services/ packages/` with slashes copies the CONTENTS of
          # each flat into /opt/courier, so /opt/courier/api/ ends up where
          # /opt/courier/services/api/ belongs, and `--delete` then removes
          # whatever the host already had there. The very next command - `cd
          # /opt/courier/infra` - fails on a directory that never arrived.
          # `--relative` recreates the tree: infra/, services/ and packages/
          # each keep their own level, and --delete trims inside them.
          rsync -az --delete --relative -e "ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=accept-new" \
            infra services packages "${USER}@${HOST}:/opt/courier/"
          ssh -i ~/.ssh/id_ed25519 "${USER}@${HOST}" \
            "cd /opt/courier/infra && bash deploy.sh apply --from staging.env"
          # The version is forwarded into the remote environment (audit item
          # 3b): smoke.sh requires it and now dies without it, because a smoke
          # test whose version check silently does not run says "green" about a
          # deployment it never identified. The sha is not a secret, so it is
          # spelled in the remote command on purpose - the quoting below keeps
          # it local-expanded while the rest of the command stays single-quoted.
          #
          # The domain and the token are NOT spelled here (audit item 3c): they
          # are piped over stdin and read by the remote shell into variables,
          # so neither the runner's nor the host's process list ever carries
          # them. A failed read exits 9 loudly - a smoke test that ran with an
          # empty token would prove nothing about an authenticated round trip.
          printf '%s\n%s\n' "$STAGING_DOMAIN" "$SMOKE_TOKEN" | ssh -i ~/.ssh/id_ed25519 "${USER}@${HOST}" \
            'read -r domain && read -r token || exit 9; cd /opt/courier/infra && APP_VERSION='"$APP_VERSION"' bash smoke.sh --domain "$domain" --token "$token"'

      - name: Roll back on a failed smoke test
        if: failure() && steps.host.outputs.configured == 'true'
        env:
          HOST: ${{ secrets.COURIER_STAGING_HOST }}
          USER: ${{ secrets.COURIER_STAGING_USER }}
          KEY: ${{ secrets.COURIER_STAGING_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
          echo "::error::the smoke test failed: returning the images that were running"
          ssh -i ~/.ssh/id_ed25519 "${USER}@${HOST}" \
            "cd /opt/courier/infra && bash deploy.sh rollback --from staging.env"
