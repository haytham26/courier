name: Main APK

# A6: the release APK of every merge to main, downloadable from one stable
# link, so the founder's acceptance run
# (docs/operations/ACCEPTANCE_TEST.md) installs the build the CI just made and
# reports what it found.
#
# The link is stable because the artefact is attached to a FIXED release tag
# (`latest`) that this workflow rewrites on every merge:
#
#   https://github.com/haytham26/courier/releases/download/latest/courier.apk
#
# The APK is signed when the keystore secrets are configured and unsigned
# otherwise (`courier-unsigned.apk` on the same release) - an unsigned APK
# installs on a phone the founder controls, which is what the acceptance run
# is.
#
# The URLs the APK dials (A5, BUG-272): the founder's APK is PINNED TO
# STAGING. When the repository variable COURIER_STAGING_DOMAIN is set, the
# build carries EXPO_PUBLIC_AUTH_URL=https://<domain>/api/auth and
# EXPO_PUBLIC_API_URL=https://<domain> - the edge's own layout
# (infra/Caddyfile.staging: /api/auth/* -> the auth service, everything else
# -> the API), so one domain serves both. Without the staging domain the
# build falls back to the EXPO_PUBLIC_AUTH_URL / EXPO_PUBLIC_API_URL
# variables (the API URL defaults to the auth URL's own host, since the edge
# is one domain). A build that names no server at all builds an APK that
# cannot sign anyone in (BUG-072): on the tag path (release-apk.yml) that
# fails the job, because a release must be whole. Here the job SKIPS with a
# notice instead: the repository variables are founder-configurable values,
# and a merge must not go red over a variable nobody has set yet - the LINZ
# weekly's skip is the same pattern (BUG-162). Set the variables and the next
# merge publishes the APK.
on:
  push:
    branches: [main]
    paths:
      - 'apps/**'
      - 'packages/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: main-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Build the APK of this merge and attach it to the stable link
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: The URLs this APK dials (pinned to staging, A5)
        # Runs FIRST, because the Node cache below is enabled only when there
        # is something to build: with `cache: pnpm` and no `pnpm install` on
        # the runner, setup-node's cache-save step fails the job on the
        # missing pnpm store ("Path Validation Error ... no cache is being
        # saved", run 42385639298) - a merge went RED over a variable nobody
        # had set, which is the opposite of the skip-notice this job exists
        # for (BUG-272).
        # The values are reported as outputs, not exported into every later
        # step's environment: a repository VARIABLE is not a secret, but the
        # build step is the one place the values belong (the shape BUG-100
        # removed was values leaking into every step's env).
        id: urls
        env:
          STAGING_DOMAIN: ${{ vars.COURIER_STAGING_DOMAIN }}
          AUTH_URL: ${{ vars.EXPO_PUBLIC_AUTH_URL }}
          API_URL: ${{ vars.EXPO_PUBLIC_API_URL }}
        run: |
          set -euo pipefail
          if [ -n "${STAGING_DOMAIN}" ]; then
            # A5: the founder's APK points at staging. The edge is one
            # domain: /api/auth/* -> the auth service, the rest -> the API
            # (infra/Caddyfile.staging).
            echo "pinned=staging" >> "$GITHUB_OUTPUT"
            echo "auth_url=https://${STAGING_DOMAIN}/api/auth" >> "$GITHUB_OUTPUT"
            echo "api_url=https://${STAGING_DOMAIN}" >> "$GITHUB_OUTPUT"
            echo "configured=yes" >> "$GITHUB_OUTPUT"
            echo "::notice::this APK is pinned to staging: auth=https://${STAGING_DOMAIN}/api/auth api=https://${STAGING_DOMAIN}"
          elif [ -n "${AUTH_URL}" ]; then
            echo "pinned=var" >> "$GITHUB_OUTPUT"
            echo "auth_url=${AUTH_URL}" >> "$GITHUB_OUTPUT"
            if [ -n "${API_URL}" ]; then
              echo "api_url=${API_URL}" >> "$GITHUB_OUTPUT"
            else
              # The API rides the same edge as the auth URL unless the API
              # variable says otherwise: the edge is one domain.
              host="$(printf '%s' "${AUTH_URL}" | sed -E 's#(https?://[^/]+).*#\1#')"
              echo "api_url=${host}" >> "$GITHUB_OUTPUT"
            fi
            echo "configured=yes" >> "$GITHUB_OUTPUT"
          else
            echo "configured=no" >> "$GITHUB_OUTPUT"
            echo "::notice::neither COURIER_STAGING_DOMAIN nor EXPO_PUBLIC_AUTH_URL is set, so this merge publishes no APK: a build that names no auth server cannot sign anyone in (BUG-072). Set the repository variables (Settings > Secrets and variables > Actions > Variables); the next merge publishes the stable link (A6), pinned to staging when COURIER_STAGING_DOMAIN is set (A5)."
          fi

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 12.14.0

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          # The pnpm cache is enabled only when the build will run: without a
          # `pnpm install` the pnpm store does not exist on a fresh runner
          # and the cache-save step fails the job (run 42385639298, BUG-272).
          # BUG-279: && and ||, never ?:. A ternary is not a GitHub expression,
          # and written unquoted its ": " makes the line invalid YAML, so
          # GitHub refused the whole workflow on every event (check-workflows
          # parses every workflow now and fails on both shapes).
          cache: ${{ steps.urls.outputs.configured == 'yes' && 'pnpm' || '' }}

      - name: Set up Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install the dependencies
        if: steps.urls.outputs.configured == 'yes'
        run: pnpm install --frozen-lockfile

      - name: Build the design tokens
        if: steps.urls.outputs.configured == 'yes'
        # The app imports @courier/design-tokens/tokens; Metro resolves it from
        # the built dist, so the package is built before the bundle.
        run: pnpm --filter @courier/design-tokens build

      - name: Read the signing secrets
        if: steps.urls.outputs.configured == 'yes'
        id: keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "${ANDROID_KEYSTORE_BASE64}" ]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/courier.keystore"
            echo "keystore_path=$RUNNER_TEMP/courier.keystore" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No ANDROID_KEYSTORE_BASE64 in the GitHub Secrets: this APK is unsigned (it installs on a phone you control, which is what the acceptance run is). The names are in docs/status/FOUNDER_TODO.md."
          fi

      - name: Build the APK
        if: steps.urls.outputs.configured == 'yes'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          # BUG-072: the URLs are build-time literals. Without this the bundle
          # carries a localhost literal that no phone can reach, and nothing
          # downstream can tell. BUG-272 (A5): BOTH URLs are pinned - the auth
          # URL and the API base - so the shipped APK dials the staging edge
          # for sign-in AND for the run data, not one and a localhost.
          EXPO_PUBLIC_AUTH_URL: ${{ steps.urls.outputs.auth_url }}
          EXPO_PUBLIC_API_URL: ${{ steps.urls.outputs.api_url }}
          # BUG-289 (the founder's 2026-11-12 directive item 4): the voice
          # service is dialled DIRECTLY by the app
          # (`EXPO_PUBLIC_VOICE_SERVICE_URL`, apps/mobile/src/voice), so an APK
          # with no voice URL carries a localhost literal and the voice flows
          # cannot reach the service that answers them. It rides the same edge
          # layout as the API unless the variable says otherwise.
          EXPO_PUBLIC_VOICE_SERVICE_URL: ${{ vars.EXPO_PUBLIC_VOICE_SERVICE_URL }}
        run: |
          set -euo pipefail
          if [ -z "${EXPO_PUBLIC_AUTH_URL}" ] || [ -z "${EXPO_PUBLIC_API_URL}" ]; then
            echo "::error::the build URLs are not set: this APK could not sign anyone in or reach the API."
            exit 1
          fi
          pnpm --filter mobile exec expo prebuild --platform android --no-install
          cd apps/mobile/android
          if [ "${{ steps.keystore.outputs.signed }}" = "true" ]; then
            ./gradlew assembleRelease --no-daemon --stacktrace \
              -Pandroid.injected.signing.store.file="${{ steps.keystore.outputs.keystore_path }}" \
              -Pandroid.injected.signing.store.password="${ANDROID_KEYSTORE_PASSWORD}" \
              -Pandroid.injected.signing.key.alias="${ANDROID_KEY_ALIAS}" \
              -Pandroid.injected.signing.key.password="${ANDROID_KEY_PASSWORD}"
          else
            ./gradlew assembleDebug --no-daemon --stacktrace
          fi

      - name: Collect the APK
        if: steps.urls.outputs.configured == 'yes'
        id: apk
        working-directory: apps/mobile/android
        run: |
          set -euo pipefail
          mkdir -p artifacts
          # The build writes under apps/mobile/android, and each step gets a
          # fresh shell, so this step's cwd is there (BUG-095's lesson).
          if [ "${{ steps.keystore.outputs.signed }}" = "true" ]; then
            cp app/build/outputs/apk/release/app-release.apk artifacts/courier.apk
          else
            cp app/build/outputs/apk/debug/app-debug.apk artifacts/courier-unsigned.apk
          fi
          echo "file=$(ls artifacts)" >> "$GITHUB_OUTPUT"

      - name: Check the APK against the store budget
        if: steps.urls.outputs.configured == 'yes'
        # The 80 MB budget and the 64-bit requirement, on the very bytes this
        # run produced (BUG-099's release mode).
        run: |
          node scripts/ci/check-store-readiness.mjs \
            --repo . --app apps/mobile \
            --apk "apps/mobile/android/artifacts/${{ steps.apk.outputs.file }}"

      - name: Attach the APK to the stable link
        if: steps.urls.outputs.configured == 'yes'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          # The fixed tag: the same URL after every merge.
          tag_name: latest
          name: The latest APK of main
          files: apps/mobile/android/artifacts/${{ steps.apk.outputs.file }}
          prerelease: true
          generate_release_notes: true
