name: Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    name: Build the preview APK and attach it to the release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 12.14.0

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Set up Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install the dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the design tokens
        # The app imports `@courier/design-tokens/themes` and
        # `@courier/design-tokens/tokens`; Metro resolves them from the built
        # `dist`, so the package has to be built before the bundle.
        run: pnpm --filter @courier/design-tokens build

      - name: Read the signing secrets
        id: keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "${ANDROID_KEYSTORE_BASE64}" ]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/courier.keystore"
            echo "keystore_path=$RUNNER_TEMP/courier.keystore" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No signing key in the GitHub Secrets: building the unsigned debug APK. Add ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD to sign the release (see docs/FOUNDER_TODO.md)."
          fi

      - name: Build the APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          pnpm --filter mobile exec expo prebuild --platform android --no-install
          cd apps/mobile/android
          if [ "${{ steps.keystore.outputs.signed }}" = "true" ]; then
            ./gradlew assembleRelease --no-daemon --stacktrace \
              -Pandroid.injected.signing.store.file="${{ steps.keystore.outputs.keystore_path }}" \
              -Pandroid.injected.signing.store.password="${ANDROID_KEYSTORE_PASSWORD}" \
              -Pandroid.injected.signing.key.alias="${ANDROID_KEY_ALIAS}" \
              -Pandroid.injected.signing.key.password="${ANDROID_KEY_PASSWORD}"
          else
            ./gradlew assembleDebug --no-daemon --stacktrace
          fi

      - name: Collect the APK
        id: apk
        run: |
          mkdir -p artifacts
          if [ "${{ steps.keystore.outputs.signed }}" = "true" ]; then
            cp app/build/outputs/apk/release/app-release.apk artifacts/courier.apk
          else
            cp app/build/outputs/apk/debug/app-debug.apk artifacts/courier-unsigned.apk
          fi
          echo "path=artifacts/$(ls artifacts)" >> "$GITHUB_OUTPUT"

      - name: Attach the APK to the release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: apps/mobile/android/${{ steps.apk.outputs.path }}
          generate_release_notes: true
