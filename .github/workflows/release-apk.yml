name: Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    name: Build the preview APK and attach it to the release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 12.14.0

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Set up Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install the dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the design tokens
        # The app imports `@courier/design-tokens/themes` and
        # `@courier/design-tokens/tokens`; Metro resolves them from the built
        # `dist`, so the package has to be built before the bundle.
        run: pnpm --filter @courier/design-tokens build

      - name: Read the signing secrets
        id: keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "${ANDROID_KEYSTORE_BASE64}" ]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/courier.keystore"
            echo "keystore_path=$RUNNER_TEMP/courier.keystore" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No signing key in the GitHub Secrets: building the unsigned debug APK. Add ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD to sign the release (see docs/status/FOUNDER_TODO.md)."
          fi

      - name: Build the APK
        # No EXPO_PUBLIC_DESIGN_LAB and no EXPO_PUBLIC_E2E here: the design
        # lab and the compatibility screen are diagnostics, and the release
        # build does not carry them (MASTER_EXECUTION section 16.1.7).
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          # BUG-072 (the C1 audit): the auth base URL is a build-time literal,
          # so a release that sets nothing shipped a bundle that could not
          # reach any auth server (the app fell back to localhost, which on a
          # phone is the phone). It comes from the repository variable, and the
          # build fails loudly if it is absent: shipping an APK that cannot
          # sign anyone in is not a release.
          EXPO_PUBLIC_AUTH_URL: ${{ vars.EXPO_PUBLIC_AUTH_URL }}
        run: |
          # BUG-072: without this the release bundle carries a localhost
          # literal that no phone can reach, and nothing downstream can tell.
          if [ -z "${EXPO_PUBLIC_AUTH_URL}" ]; then
            echo "::error::EXPO_PUBLIC_AUTH_URL is not set: this release would build an APK that cannot reach an auth server. Set the repository variable (Settings > Secrets and variables > Actions > Variables)."
            exit 1
          fi
          pnpm --filter mobile exec expo prebuild --platform android --no-install
          cd apps/mobile/android
          if [ "${{ steps.keystore.outputs.signed }}" = "true" ]; then
            ./gradlew assembleRelease --no-daemon --stacktrace \
              -Pandroid.injected.signing.store.file="${{ steps.keystore.outputs.keystore_path }}" \
              -Pandroid.injected.signing.store.password="${ANDROID_KEYSTORE_PASSWORD}" \
              -Pandroid.injected.signing.key.alias="${ANDROID_KEY_ALIAS}" \
              -Pandroid.injected.signing.key.password="${ANDROID_KEY_PASSWORD}"
          else
            ./gradlew assembleDebug --no-daemon --stacktrace
          fi

      # BUG-095 (C1 audit, squad 6 finding 3, accepted high, consequence
      # amended): this step runs at the repository root, while `cp
      # app/build/outputs/...` resolves relative to where the build ran (the
      # prebuild step ends with `cd apps/mobile/android`, and each step gets a
      # fresh shell, so that `cd` does not survive here). The replay under
      # `bash -e` made `cp` fail and the job red, and the `files:` path handed
      # to the release action was a second mismatch - it resolved against the
      # root, where the artifact was written by the same wrong assumption.
      # Both are fixed by naming the directory the build writes into and
      # resolving the release action's path from the root, which is where the
      # `artifacts/` directory actually is.
      - name: Collect the APK
        id: apk
        working-directory: apps/mobile/android
        run: |
          mkdir -p artifacts
          if [ "${{ steps.keystore.outputs.signed }}" = "true" ]; then
            cp app/build/outputs/apk/release/app-release.apk artifacts/courier.apk
          else
            cp app/build/outputs/apk/debug/app-debug.apk artifacts/courier-unsigned.apk
          fi
          echo "path=artifacts/$(ls artifacts)" >> "$GITHUB_OUTPUT"

      # BUG-099 (C1 audit, squad 6 finding 7, accepted high, consequence
      # amended): no release-path workflow built or passed the APK, so the
      # 80 MB budget and the 64-bit requirement were never enforced on the
      # path that actually submits. This workflow builds the artefact it
      # attaches, so it measures the very bytes it ships: the check runs in
      # its release mode, where a missing or oversized APK fails the job
      # rather than warning. The check reads the tree (app.json, the
      # manifest, the signing configuration) and measures the APK this run
      # collected.
      - name: Check the release APK against the store budget
        run: |
          node scripts/ci/check-store-readiness.mjs \
            --repo . --app apps/mobile \
            --apk "apps/mobile/android/${{ steps.apk.outputs.path }}" \
            --release

      # BUG-095's second half: the `files:` path is resolved against the
      # repository root (where this action runs), and the Collect step writes
      # into `apps/mobile/android/artifacts/` - so the path the release action
      # reads is the one that names that directory. Both halves of this fix
      # are the same fact seen from two steps: the build writes under
      # `apps/mobile/android`, not under the root.
      - name: Attach the APK to the release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: apps/mobile/android/${{ steps.apk.outputs.path }}
          generate_release_notes: true
