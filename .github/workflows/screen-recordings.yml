name: Screen recordings (13 reference screens)

# MASTER_EXECUTION §13.8.7 (the evidence rule of §13.8.6): every screen PR
# records the screen on the emulator beside its reference — light AND dark —
# and the driving screen's frame-time trace (ADR-008 §4 tunes the motion
# tokens against this evidence; the change lands in ADR-008, never in a
# screen). This workflow replaces `design-videos.yml` (deleted in the same
# PR): the ten directions are history; the 13 chosen screens are the product.
#
# How the gate fills in: `.maestro/recordings/` holds one flow per screen,
# named after its reference (`03-today.yaml` records against
# `docs/design/chosen/screens/03-today.html`). A screen PR adds its flow —
# until then the workflow simply records what exists. The side-by-side
# composition and every mp4 ride the `screen-recordings` artifact; the ONLY
# emulator is the CI one (no local emulator, §16.1).
#
# Dark alias: the night driving is its own reference (12-driving-night), so
# the dark pass of the driving flow is composed against that one.
#
# BUG-270's screen-recordings half (P7's acceptance is "on the CI emulator at
# TWO screen sizes"): the record job is a MATRIX over the two profiles - the
# small one (an empty device name is the emulator-runner's own default) and the
# large one (Nexus 6) - because recordings proven on one size prove nothing
# about the other. The two legs run as parallel jobs on the same pins
# (BUG-065/BUG-068), the AVD cache key carries the profile so a snapshot is
# never restored onto the other screen, and each leg's artefacts carry the
# profile in their names so the two sets of baselines never collide. The
# reference HTML renders at the leg's own viewport, so a side-by-side compares
# like with like rather than a phone render against a tablet screencap.

on:
  pull_request:
    branches:
      - main
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'services/**'
      - '.maestro/**'
      - '.github/workflows/screen-recordings.yml'
      - 'package.json'
      - 'pnpm-lock.yaml'
  workflow_dispatch:

concurrency:
  group: screen-recordings-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# BUG-065: every workflow that boots the emulator carries the same pins, and a
# change to a pin is a commit (PLAYBOOK 17.1). The values and where each came
# from are in android-e2e.yml; the recordings must not float on a different
# Maestro or emulator than the gate does, or its evidence is not comparable.
env:
  MAESTRO_VERSION: cli-2.11.0
  MAESTRO_SHA256: 5384593cb4e7a106489e75a821d157dd43f4e438df6bc308b72e82c685e1283a
  EMULATOR_BUILD: '16632760'

jobs:
  build:
    name: Build the release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 12.14.0

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm

      - name: Set up Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Install the dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the design tokens
        # The app bundles @courier/design-tokens from its built output: the
        # package must exist before Metro can resolve it (dist/ is not
        # committed).
        run: pnpm --filter @courier/design-tokens build

      - name: Build the release APK
        env:
          # The recording runs against the same E2E build the flows run on
          # (local mocks): no Metro, no auth service, no API.
          EXPO_PUBLIC_E2E: '1'
        run: |
          pnpm --filter mobile exec expo prebuild --platform android --no-install
          # BUG-079: from the repo root, before the cd into the android
          # project - the flag is legal in a debug build (a test artifact),
          # and the gate names the variant it is asked about.
          node scripts/ci/check-e2e-flag.mjs --variant e2e
          cd apps/mobile/android
          ./gradlew assembleRelease --no-daemon --stacktrace -PreactNativeArchitectures=x86_64

      - name: Upload the APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: recordings-app
          path: apps/mobile/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 7

  record:
    name: Record the screens on the emulator (${{ matrix.profile }})
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          # The small screen: an empty device name is the emulator-runner's own
          # default AVD, the one this job has always booted, and 390x844 is the
          # phone the design was drawn on.
          - profile: small
            device: ''
            viewport: '390x844'
          # The large screen: the Nexus 6 AVD (1440x2560 device px at 560 dpi,
          # which is 411x731 logical dp) - the profile the lead's P4 job names
          # as `large`. The reference renders at the leg's own logical size
          # rather than the design phone's, so the side-by-side is a comparison
          # of the same window at two sizes.
          - profile: large
            device: 'Nexus 6'
            viewport: '411x731'
    env:
      PKG: com.courier.copilot
      PROFILE: ${{ matrix.profile }}
      VIEWPORT: ${{ matrix.viewport }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Download the APK
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: recordings-app
          path: apk

      - name: Set up Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 17

      # BUG-097 (C1 audit, squad 6 finding 5, accepted high, consequence
      # amended): the key carried no hash of what determines the browser's
      # bytes, so a dependency rotation (a new Playwright pin in the lockfile)
      # was indistinguishable from the entry it replaced, and there were no
      # restore-keys, so a partial entry was restored as a complete hit. A key
      # over the lockfile's own hash makes a new browser a new key, and the
      # restore-key lets an older Chromium still be restored (its download is
      # only the delta, and Chromium is content-addressed by version). The
      # runner's own cache of a 13-screen render is not worth a stale browser,
      # but a partial entry is worth nothing at all.
      - name: Cache the Chromium of Playwright
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ matrix.profile }}-${{ hashFiles('**/pnpm-lock.yaml') }}-chromium-1.49.1
          restore-keys: |
            playwright-${{ runner.os }}-${{ matrix.profile }}-chromium-1.49.1-

      - name: Render the 13 reference screens
        # The references are static HTML, rendered at THIS LEG's own viewport
        # (the matrix's viewport): a phone render beside a tablet screencap
        # would compare two different windows, and the composition would prove
        # nothing. Chromium is the renderer; the browser is cached, and the
        # cache key carries the profile so the two legs' entries are separate.
        run: |
          mkdir -p ~/.cache/ms-playwright
          npx --yes playwright@1.49.1 install chromium --with-deps
          mkdir -p render
          size="${VIEWPORT//x/,}"
          for html in docs/design/chosen/screens/*.html; do
            name="$(basename "$html" .html)"
            npx --yes playwright@1.49.1 screenshot \
              --viewport-size="$size" --wait-for-timeout=2500 \
              "file://$PWD/$html" "render/$name.png"
            echo "rendered: $name"
          done
          ls -la render

      # BUG-068's shape, applied where the same defect survived: the AVD cache
      # key in this workflow still carried only os+api+target+arch, so a rotated
      # runner image (or an emulator/system-image upgrade) restored a snapshot
      # made on a different toolset and the boot failure read as an app failure.
      # The key carries the same pins and the same hash of the emulator options
      # android-e2e.yml uses (BUG-065/BUG-068), so a pin change is a miss by
      # construction, and the restore-keys let a compatible older snapshot
      # still be reused.
      - name: The AVD pins' fingerprint
        id: pins
        run: |
          set -euo pipefail
          opts="-no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim"
          # BUG-270: the fingerprint carries the PROFILE. A snapshot is made of
          # one screen; restoring it onto the other leg's device would boot a
          # screen the snapshot never saw, and the failure would read as an app
          # failure (the same class as BUG-068's runner-image rotation).
          fingerprint="$MAESTRO_VERSION/$MAESTRO_SHA256/$EMULATOR_BUILD/34/google_apis/x86_64/$opts/$PROFILE"
          hash=$(printf '%s' "$fingerprint" | sha256sum | cut -d' ' -f1 | cut -c1-16)
          echo "hash=$hash" >> "$GITHUB_OUTPUT"
          echo "pin fingerprint: $fingerprint -> $hash"

      - name: Cache the AVD snapshot
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.android/avd
          key: avd-${{ runner.os }}-34-google-apis-x86_64-${{ matrix.profile }}-${{ steps.pins.outputs.hash }}
          restore-keys: |
            avd-${{ runner.os }}-34-google-apis-x86_64-${{ matrix.profile }}-

      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Boot the emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          # The device comes from the matrix: an empty one is the runner's own
          # default AVD (the small screen) and the large leg names its own. The
          # profile itself travels in the AVD cache key's hash above, not here.
          profile: ${{ matrix.device }}
          # The animations stay on: the recording is the evidence of the
          # motion (the flows gate runs under the same rules it asserts).
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          # BUG-065: the pinned emulator binary, the same one the gate records.
          emulator-build: ${{ env.EMULATOR_BUILD }}
          # The runner's `script` is REQUIRED (run 39905489120 died without
          # it: `Input required and not supplied: script`), and it is ONE LINE
          # on purpose (BUG-114). The action does not run a multi-line script
          # as one program: `src/script-parser.ts` splits it per line and
          # `src/main.ts` runs each line as its own `sh -c`, so every `export`,
          # every variable and every `set -o pipefail` dies on the spot
          # (run 40962263045: `/usr/bin/sh: 1: set: Illegal option -o
          # pipefail`, the job red on its first line). The body lives in
          # `.maestro/recordings-boot.sh`, run under bash, exactly the way
          # android-e2e.yml runs `bash .maestro/run-all.sh`.
          script: bash .maestro/recordings-boot.sh

      - name: Upload the recordings
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          # BUG-270: the artefact's name carries the profile. Two legs uploading
          # under one name would merge the two sets of baselines into one
          # artifact - the small set beside the large one - and the visual gate
          # would promote whichever it read first.
          name: screen-recordings-${{ matrix.profile }}
          path: |
            .maestro/recordings/**
            render/**
          if-no-files-found: warn
          retention-days: 14
